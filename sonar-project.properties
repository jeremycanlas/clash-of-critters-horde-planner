# SonarCloud configuration for the CI security/quality scan.
#
# Fill in the two placeholders after creating the project at sonarcloud.io
# (import the GitHub repo, then read the org and project key off the project's
# Information page). The scan runs from .github/workflows/ci.yml and only when
# the ENABLE_SONAR repository variable is 'true'.

sonar.organization=YOUR_SONARCLOUD_ORG
sonar.projectKey=YOUR_SONARCLOUD_PROJECT_KEY

# Scan the hand-written code, not generated data or vendored images.
sonar.sources=assets/js,tools,supabase
sonar.exclusions=data/**,assets/img/**,**/*.min.js

# Language hints (SonarCloud auto-detects, but this keeps it focused).
sonar.javascript.file.suffixes=.js,.mjs
sonar.python.version=3.11
