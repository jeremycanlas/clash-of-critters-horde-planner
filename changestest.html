<!doctype html>
<meta charset="utf-8">
<title>patch changes test</title>
<body style="font:14px monospace;background:#111;color:#ddd;padding:16px">
<div id="log">loading…</div>
<script type="module">
/*
 * data/changes.json against the roster it describes.
 *
 * The file is hand-authored from patch notes, so the failures worth catching are
 * authoring ones: a name typed wrong, a line that gained an evolution since the
 * notes were read, a Tatari filed under two directions at once. The last one is
 * the reason for the whole-line check -- Lordopus and Dharmadder arrived as new
 * T4s in the same week as these notes, and a stale members list would silently
 * leave the newest member of a nerfed line unmarked.
 */
import { load, state } from './assets/js/data.js';

const DIRECTIONS = ['buff', 'nerf', 'adjusted'];

const out = document.getElementById('log');
let pass = 0, fail = 0;
const ok = (name, cond, detail) => {
  if (cond) { pass++; out.innerHTML += `<div style="color:#7c7">ok   ${name}</div>`; }
  else { fail++; out.innerHTML += `<div style="color:#f77">FAIL ${name}${detail ? ': ' + detail : ''}</div>`; }
};

await load();
const book = await fetch('data/changes.json').then((r) => r.json());
const lines = book.lines ?? [];
out.innerHTML = '';

ok('roster loaded', state.all.length > 0, `${state.all.length} Tatari`);
ok('changes.json has a patch label', !!book.patch && !!book.label);
ok('every entry names a direction we render', lines.every((l) => DIRECTIONS.includes(l.direction)),
   lines.filter((l) => !DIRECTIONS.includes(l.direction)).map((l) => l.line).join(', '));
ok('every entry carries at least one change', lines.every((l) => (l.changes ?? []).length > 0),
   lines.filter((l) => !(l.changes ?? []).length).map((l) => l.line).join(', '));

// Names, not just shapes: a slug that is not in the roster marks nothing at all,
// and does it silently.
const unknown = lines.flatMap((l) => (l.members ?? []).filter((s) => !state.bySlug.has(s)));
ok('every member slug is a real Tatari', unknown.length === 0, unknown.join(', '));

const headNotInRoster = lines.filter((l) => !state.all.some((t) => t.name === l.line));
ok('every line name is a real Tatari', headNotInRoster.length === 0,
   headNotInRoster.map((l) => l.line).join(', '));

/*
 * The check that earns its keep. Horde skills belong to the family, so a change
 * applies to the family as it stands today -- not as it stood when the notes were
 * read. If the wiki has since added a T4, this fails and names it.
 */
const stale = [];
for (const l of lines) {
  const head = state.all.find((t) => t.name === l.line);
  if (!head) continue;
  const expected = (head.evolutionLine ?? [head.name])
    .map((n) => state.all.find((t) => t.name === n)?.slug).filter(Boolean);
  const missing = expected.filter((s) => !(l.members ?? []).includes(s));
  const extra = (l.members ?? []).filter((s) => !expected.includes(s));
  if (missing.length || extra.length) {
    stale.push(`${l.line}: ${missing.length ? 'missing ' + missing.join('/') : ''}` +
               `${extra.length ? ' unexpected ' + extra.join('/') : ''}`);
  }
}
ok('every line covers its whole evolution family', stale.length === 0, stale.join('; '));

// One Tatari cannot be both buffed and nerfed. Overlapping families would mean
// whichever entry was read last silently wins.
const seen = new Map();
const dupes = [];
for (const l of lines) {
  for (const s of l.members ?? []) {
    if (seen.has(s)) dupes.push(`${s} in both ${seen.get(s)} and ${l.line}`);
    else seen.set(s, l.line);
  }
}
ok('no Tatari appears in two entries', dupes.length === 0, dupes.join('; '));

// The fan-out the loader does, checked against the file it did it from.
ok('loader flattened every member', state.changes.size === seen.size,
   `${state.changes.size} in state, ${seen.size} in file`);
ok('loader kept the direction', lines.every((l) =>
     (l.members ?? []).every((s) => state.changes.get(s)?.direction === l.direction)));
ok('untouched Tatari carry no entry',
   state.all.some((t) => !state.changes.has(t.slug)),
   'every Tatari is marked, which would make the marker meaningless');

/*
 * The numbers the Patch chips print, checked against the file they came from.
 *
 * The chips count Tatari and the file counts lines, and the difference is the
 * whole reason to check: 12 nerfed lines are 46 nerfed Tatari, and a chip
 * claiming 12 would send anyone hunting for 34 cards that were never missing.
 */
const perDirection = Object.fromEntries(DIRECTIONS.map((d) => [d, 0]));
for (const { direction } of state.changes.values()) perDirection[direction] += 1;
const fromFile = Object.fromEntries(DIRECTIONS.map((d) => [d,
  lines.filter((l) => l.direction === d).reduce((n, l) => n + l.members.length, 0)]));
ok('chip counts match the file, per direction',
   DIRECTIONS.every((d) => perDirection[d] === fromFile[d]),
   DIRECTIONS.map((d) => `${d}: ${perDirection[d]} vs ${fromFile[d]}`).join(', '));
ok('the three directions account for every marked Tatari',
   DIRECTIONS.reduce((n, d) => n + perDirection[d], 0) === state.changes.size);
// The premise the Patch chips are single-choice on: a Tatari is one of the three.
// Nothing is both buffed and nerfed, which is what "adjusted" is the name for.
ok('every marked Tatari has exactly one direction',
   [...state.changes.values()].every((c) => DIRECTIONS.includes(c.direction)));

/*
 * The arrows on changes.html, checked against the editorial call on the entry.
 *
 * movement() decides up-or-down from the numbers with one exception -- a longer
 * interval is worse -- and colours the row green or red on that. If the game
 * ever ships a stat where higher is worse and the word "interval" is not in it,
 * every fragment of some buffed line will start reading red and nothing on the
 * page would say so. This is what says so.
 */
const { movement } = await import('./assets/js/changes.js');
const split = (l) => l.changes.flatMap((c) => {
  const head = state.all.find((t) => t.name === l.line);
  const skills = Object.values(head?.hordeSkills ?? {})
    .map((s) => s.name).sort((a, b) => b.length - a.length);
  const norm = (x) => x.toLowerCase().replace(/[^a-z0-9]/g, '');
  const name = skills.find((n) => norm(c).startsWith(norm(n)));
  const rest = (name ? c.slice(name.length) : c).replace(/^\s*:\s*/, '');
  return rest.split(/,\s+/);
});

const fragments = lines.flatMap((l) => split(l).map((p) => ({ dir: l.direction, line: l.line, p })));
const unread = fragments.filter((f) => movement(f.p) === null);
ok('every stat fragment has two readable numbers', unread.length === 0,
   unread.map((f) => `${f.line}: ${f.p}`).join('; '));

const wrongWay = fragments.filter((f) => f.dir !== 'adjusted'
  && (movement(f.p) === 'up') !== (f.dir === 'buff'));
ok('every arrow agrees with the direction on its entry', wrongWay.length === 0,
   wrongWay.map((f) => `${f.line}: ${f.p}`).join('; '));

const adjusted = lines.filter((l) => l.direction === 'adjusted')
  .flatMap((l) => split(l).map(movement));
ok('an adjusted line really does move both ways',
   !adjusted.length || (adjusted.includes('up') && adjusted.includes('down')),
   adjusted.join(', '));

/*
 * The preview set, held to every rule the live one is held to except the
 * loader's.
 *
 * It is deliberately NOT loaded into state, so the fan-out and chip-count
 * checks above have nothing to say about it. Everything else applies unchanged:
 * a slug that is not in the roster or an arrow pointing the wrong way is just
 * as wrong on a tab nobody has pressed yet, and worse, because the tab it is on
 * is the one nobody is checking by eye.
 */
const preview = book.preview;
if (preview?.lines?.length) {
  const plines = preview.lines;
  const p = (name, cond, detail) => ok(`preview: ${name}`, cond, detail);

  /* The flag is what puts "preview" on the tab. Without it the set is
     indistinguishable from live notes, which is the one way this fails
     silently. */
  p('carries a label and is flagged provisional', !!preview.label && preview.provisional === true);
  /* Somebody read every one of these off the game by hand and passed them on.
     A credit that quietly disappears in an edit is worse than one that was
     never there, so it is checked rather than trusted. */
  p('still credits whoever read it off the game',
    typeof preview.by === 'string' && preview.by.trim().length > 0);
  p('every entry names a direction we render', plines.every((l) => DIRECTIONS.includes(l.direction)),
    plines.filter((l) => !DIRECTIONS.includes(l.direction)).map((l) => l.line).join(', '));
  p('every entry carries at least one change', plines.every((l) => (l.changes ?? []).length > 0),
    plines.filter((l) => !(l.changes ?? []).length).map((l) => l.line).join(', '));

  const pUnknown = plines.flatMap((l) => (l.members ?? []).filter((s) => !state.bySlug.has(s)));
  p('every member slug is a real Tatari', pUnknown.length === 0, pUnknown.join(', '));

  const pStale = [];
  for (const l of plines) {
    const head = state.all.find((t) => t.name === l.line);
    if (!head) { pStale.push(`${l.line}: not a Tatari`); continue; }
    const expected = (head.evolutionLine ?? [head.name])
      .map((n) => state.all.find((t) => t.name === n)?.slug).filter(Boolean);
    const missing = expected.filter((s) => !(l.members ?? []).includes(s));
    const extra = (l.members ?? []).filter((s) => !expected.includes(s));
    if (missing.length || extra.length) pStale.push(`${l.line}: ${missing.join('/')}${extra.join('/')}`);
  }
  p('every line covers its whole evolution family', pStale.length === 0, pStale.join('; '));

  const pSeen = new Set();
  const pDupes = [];
  for (const l of plines) for (const s of l.members ?? []) {
    if (pSeen.has(s)) pDupes.push(s); else pSeen.add(s);
  }
  p('no Tatari appears in two entries', pDupes.length === 0, pDupes.join(', '));

  const pFrags = plines.flatMap((l) => split(l).map((q) => ({ dir: l.direction, line: l.line, p: q })));
  const pUnread = pFrags.filter((f) => movement(f.p) === null);
  p('every stat fragment has two readable numbers', pUnread.length === 0,
    pUnread.map((f) => `${f.line}: ${f.p}`).join('; '));

  const pWrong = pFrags.filter((f) => f.dir !== 'adjusted'
    && (movement(f.p) === 'up') !== (f.dir === 'buff'));
  p('every arrow agrees with the direction on its entry', pWrong.length === 0,
    pWrong.map((f) => `${f.line}: ${f.p}`).join('; '));

  const pAdjusted = plines.filter((l) => l.direction === 'adjusted').flatMap((l) => split(l).map(movement));
  p('an adjusted line really does move both ways',
    !pAdjusted.length || (pAdjusted.includes('up') && pAdjusted.includes('down')), pAdjusted.join(', '));

  /*
   * The property the whole shape exists to guarantee. A preview is unreleased
   * numbers; if one ever reached state.changes it would mark cards in the
   * drafter, and somebody would draft off a number the live game does not have.
   * The loader reads the top level only, and this is what keeps it that way.
   */
  p('never reaches the drafter', state.patch?.label === book.label && state.patch.label !== preview.label,
    `state is showing ${state.patch?.label}`);
  p('marked Tatari still come only from the live patch', state.changes.size === seen.size,
    `${state.changes.size} marked, ${seen.size} in the live file`);
}

const counts = DIRECTIONS.map((d) => `${d} ${lines.filter((l) => l.direction === d).length}`).join(', ');
out.innerHTML += `<div style="margin-top:12px">${pass} passed, ${fail} failed`
  + `. ${lines.length} lines (${counts}) covering ${state.changes.size} of ${state.all.length} Tatari</div>`;
/* In the title so a headless run can read the verdict without running
   script of its own -- tools/check.sh greps exactly this. */
document.title = `${fail ? `FAIL (${fail})` : 'ok'}: patch changes`;
window.__done = { pass, fail };
</script>
</body>
