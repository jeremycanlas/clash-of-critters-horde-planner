<!doctype html>
<meta charset="utf-8">
<title>logic test</title>
<body style="font:14px/1.5 ui-monospace,monospace;background:#111;color:#ddd;padding:16px">
<div id="log">loading…</div>
<script type="module">
/*
 * The pure logic under the app, driven directly.
 *
 * apptest and mobiletest drive the rendered page; chipstest and changestest check
 * the data files. Nothing checked the state engine and the two codecs it hangs
 * off -- the share-link grammar in hash.js and the JSON in store.js -- even
 * though those are the most format-versioned, most silently-breakable code in the
 * project: a decode that drops a field corrupts every link ever pasted, and no
 * screenshot would catch it.
 *
 * So this drives store.js the way the app does -- place(), addToBench(),
 * switchTier(), addStep() -- takes a snapshot, sends it through the codec and
 * back, and asserts the formation that comes out is the one that went in. The
 * store is a module singleton, so every group resets it first.
 */
import { load, state } from './assets/js/data.js';
import * as store from './assets/js/store.js';
import {
  toFragment, fromFragment, withRoom, withoutRoom, roomInHash, HASH_VERSION,
} from './assets/js/hash.js';
import { coveredFrom, coverage, hasRange } from './assets/js/range.js';
import { parseContribution } from './assets/js/range-import.js';
import { OUTCOMES, expected, spread, withSpecials, totalChance, toCap } from './assets/js/pinball.js';

const out = document.getElementById('log');
let pass = 0, fail = 0, suite = '';

const only = new URLSearchParams(location.search).get('only')?.toLowerCase() ?? '';
let matchedOnly = false;

const group = (name, body) => {
  if (only && !name.toLowerCase().includes(only)) return Promise.resolve();
  if (only) matchedOnly = true;
  suite = name;
  out.innerHTML += `<div style="margin:12px 0 2px;color:#ffc93c;font-weight:700">${name}</div>`;
  try { return Promise.resolve(body()); } catch (err) {
    fail++;
    out.innerHTML += `<div style="color:#f77">  FAIL ${name} threw: ${err.message}</div>`;
    return Promise.resolve();
  }
};

const ok = (name, cond, detail) => {
  if (cond) { pass++; out.innerHTML += `<div style="color:#7c7">  ok   ${name}</div>`; }
  else {
    fail++;
    out.innerHTML += `<div style="color:#f77">  FAIL ${name}${detail ? `<div style="padding-left:5ch;color:#aaa">${detail}</div>` : ''}</div>`;
  }
};
const eq = (name, got, want) =>
  ok(name, JSON.stringify(got) === JSON.stringify(want),
    `got ${JSON.stringify(got)}, wanted ${JSON.stringify(want)}`);

await load();
out.innerHTML = '';

// ---------------------------------------------------------------- fixtures
/* Real slugs off the loaded roster, so the codecs see what they see in the app.
   Two distinct families for placement, one family with two tiers for the swap,
   and one Zobo. Found rather than hard-coded, so a data change cannot rot them. */
const byFamily = new Map();
for (const t of state.all) {
  if (!byFamily.has(t.familyId)) byFamily.set(t.familyId, []);
  byFamily.get(t.familyId).push(t);
}
const families = [...byFamily.values()];
const A = families[0][0];                                   // one Tatari
const B = families.find((f) => f[0].slug !== A.slug)[0];    // a different family
const C = families.find((f) => ![A, B].some((x) => x.familyId === f[0].familyId))[0];
const line = families.find((f) => f.length >= 2)             // two tiers, one line
  .slice().sort((a, b) => a.tier - b.tier);
/* Families are keyed by familyId, so one Tatari out of each of the first six
   is six distinct lines -- enough to fill three squares and shortlist three. */
const [D, E, F] = [families[3][0], families[4][0], families[5][0]];
const zoboSlug = [...state.zoboBySlug.keys()][0];

/* A full blank formation: clearAll leaves mode, name and lines alone, which would
   leak between groups. applySnapshot with a complete blob resets everything. */
const reset = () => store.applySnapshot({
  mode: 'solo', sandbox: false, zoboGround: false, pullRows: 0,
  cells: [], flex: [], swaps: [], bench: { 1: [], 2: [] }, plan: [],
  name: '', lines: { lf: { wants: [], note: '' }, have: { wants: [], note: '' } },
  lfMode: 'lf',
});

/*
 * The formation as the codecs are actually responsible for it.
 *
 * Deliberately drops what a given codec is known NOT to carry, so the roundtrip
 * asserts the contract rather than a coincidence. Bench is compared as a set --
 * membership is the fact, order is not -- and cells positionally, because where a
 * Tatari stands is the whole point.
 */
const shapeOf = (s, { flex = false } = {}) => ({
  mode: s.mode,
  sandbox: s.sandbox,
  zoboGround: s.zoboGround,
  cells: s.cells.map((o) => (o ? `${o.player}.${o.slug}${o.kind === 'zobo' ? ':z' : ''}` : '')),
  bench: { 1: [...s.bench[1]].sort(), 2: [...s.bench[2]].sort() },
  plan: s.plan.map((st) => `${st.members.map((m) => `${m.player}.${m.slug}`).join('+')}=${st.level}$${st.note}`),
  name: s.name,
  lf: `${[...s.lines.lf.wants].join('+')}|${s.lines.lf.note}`,
  have: `${[...s.lines.have.wants].join('+')}|${s.lines.have.note}`,
  ...(flex ? { flex: [...s.flex].sort((a, b) => a - b) } : {}),
});

/* A group as the store is responsible for it: which squares, and who is on the
   shortlist. Cells sorted because the order you tapped them in is not a fact. */
const swapShape = (s) => (s.swaps ?? []).map((g) =>
  `${[...g.cells].sort((a, b) => a - b).join('/')}=${[...g.slugs].sort().join('+')}`);

// A note holding every separator the grammar uses, to prove the double-encode
// survives all of them.
const NASTY = 'a,b+c.d$e~f%g/h';

// ============================================================ share link
await group('share link: a solo formation survives the round trip', () => {
  reset();
  store.place(A.slug, 0);
  store.place(B.slug, 8);
  store.addToBench(C.slug);                 // brought, not placed
  store.setName('My build ' + NASTY);
  store.addStep([{ slug: A.slug, player: 1 }], 5, NASTY);
  store.addStep([{ slug: B.slug, player: 1 }], null, '');
  store.toggleWant(C.slug, 'lf');
  store.setLF('need a healer ' + NASTY, 'lf');
  store.setLF('have ' + NASTY, 'have');
  store.toggleWant(A.slug, 'have');

  const before = store.snapshot();
  const frag = toFragment(before);
  ok('the fragment names the current version', frag.startsWith(`${HASH_VERSION}=`), frag);

  const decoded = fromFragment('#' + frag);
  ok('it decodes to a formation', !!decoded && !!decoded.blob);
  ok('with no unknown slugs', decoded.unknown.length === 0, decoded.unknown.join(', '));

  store.applySnapshot(decoded.blob);
  eq('the formation is identical after a round trip', shapeOf(store.snapshot()), shapeOf(before));
});

await group('share link: co-op keeps each token with its owner', () => {
  reset();
  store.setMode('coop');
  store.place(A.slug, 0, 1);
  store.place(A.slug, 1, 2);                 // both players may bring the same one
  store.place(B.slug, 7, 2);
  const before = store.snapshot();
  store.applySnapshot(fromFragment('#' + toFragment(before)).blob);
  eq('both players come back on the field', shapeOf(store.snapshot()), shapeOf(before));
});

await group('share link: sandbox, zobo ground and a placed Zobo all ride along', () => {
  reset();
  store.setSandbox(true);
  store.setZoboGround(true);
  store.place(A.slug, 0);
  store.place(zoboSlug, 40);                 // an enemy cell, only reachable here
  const before = store.snapshot();
  ok('the fragment marks sandbox and zobo ground', /sb=1/.test(toFragment(before)) && /zg=1/.test(toFragment(before)));
  const decoded = fromFragment('#' + toFragment(before));
  store.applySnapshot(decoded.blob);
  const after = store.snapshot();
  eq('sandbox and zobo ground survive', [after.sandbox, after.zoboGround], [true, true]);
  ok('the Zobo comes back as a Zobo', after.cells[40]?.kind === 'zobo' && after.cells[40].slug === zoboSlug,
    JSON.stringify(after.cells[40]));
});

await group('share link: unknown and malformed input is handled, not thrown on', () => {
  reset();
  const decoded = fromFragment(`#${HASH_VERSION}=solo/1.not-a-real-slug@0,1.${A.slug}@1;;`);
  ok('an unknown slug is reported', decoded.unknown.includes('not-a-real-slug'), decoded.unknown.join(', '));
  ok('and the real one beside it still lands', decoded.blob.cells[1]?.slug === A.slug);

  let threw = false;
  try { fromFragment(`#${HASH_VERSION}=solo/1.${A.slug}@0;;n=oops%`); } catch { threw = true; }
  ok('a stray percent in a hand-edited link does not throw', !threw);

  ok('a hash with no fragment decodes to null', fromFragment('#nothing-here') === null);
  ok('an empty formation writes an empty fragment', toFragment(store.snapshot()) === '');
});

await group('share link: an older v5/v4 link is still read', () => {
  reset();
  const v5 = fromFragment(`#v5=solo/1.${A.slug}@3`);
  ok('a v5 link with no meta segment decodes', !!v5 && v5.blob.cells[3]?.slug === A.slug);
  const v4 = fromFragment(`#v4=solo/1.${A.slug}@3`);
  ok('a v4 link decodes too', !!v4 && v4.blob.cells[3]?.slug === A.slug);
});

await group('share link: a live room rides beside the formation', () => {
  reset();
  store.place(A.slug, 0);
  const frag = toFragment(store.snapshot());
  const room = 'abcdefgh23456789';                 // 16 chars, the room grammar
  const withR = withRoom(`https://x/#${frag}`, room);
  ok('the room reads back out', roomInHash(new URL(withR).hash) === room, withR);
  ok('the formation is untouched by stamping a room on', /1\./.test(withR) && withR.includes(A.slug));
  ok('and taking the room off leaves the formation', roomInHash(new URL(withoutRoom(withR)).hash) === null);
});

// ============================================================ JSON
await group('JSON: export and re-import is faithful', () => {
  reset();
  store.setName('Named build');
  store.place(A.slug, 0);
  store.place(B.slug, 8);
  store.addToBench(C.slug);
  store.addStep([{ slug: A.slug, player: 1 }], 3, 'level early');
  store.toggleWant(B.slug, 'lf');
  store.setLF('a note', 'lf');
  const before = store.snapshot();

  const json = JSON.parse(JSON.stringify(store.toJSON()));   // as a file would be
  const result = store.fromJSON(json);
  ok('the import reports success', result.ok, result.reason);
  ok('with nothing unknown', result.unknown.length === 0, result.unknown.join(', '));
  // JSON carries no flex/sandbox/zoboGround, so compare only what it promises.
  eq('the formation is identical after a JSON round trip', shapeOf(store.snapshot()), shapeOf(before));
});

await group('JSON: garbage is refused, unknown slugs are named', () => {
  reset();
  ok('a non-object is refused', store.fromJSON(null).ok === false);
  ok('an object with no formation data is refused', store.fromJSON({}).ok === false);
  const r = store.fromJSON({
    mode: 'solo',
    players: [{ player: 1, bench: [{ slug: 'ghost-tatari', cell: 0, onField: true }] }],
  });
  ok('an unknown slug is reported rather than swallowed', r.ok && r.unknown.includes('ghost-tatari'), JSON.stringify(r));
});

// ============================================================ tier swap
await group('tier swap: changing tier keeps cell, bench slot and plan', () => {
  reset();
  const [t1, t2] = line;
  store.place(A.slug, 0);                    // something ahead of it in the bench
  store.place(t1.slug, 6);
  store.addStep([{ slug: t1.slug, player: 1 }], 5, 'planned');
  const cellBefore = store.cellOf(t1.slug, 1);
  const benchIndexBefore = store.benchOf(1).indexOf(t1.slug);

  const res = store.switchTier(t1.slug, t2.slug, 1);
  ok('the swap succeeds within a line', res.ok, res.reason);
  ok('the new tier stands in the old one\'s cell', store.cellOf(t2.slug, 1) === cellBefore);
  ok('the old tier is gone from the field', store.cellOf(t1.slug, 1) === null);
  ok('the bench slot is kept, not appended', store.benchOf(1).indexOf(t2.slug) === benchIndexBefore, `${store.benchOf(1)}`);
  const step = store.snapshot().plan[0];
  ok('the plan step follows the swap, keeping its level and note',
    step.members[0].slug === t2.slug && step.level === 5 && step.note === 'planned', JSON.stringify(step));

  const across = store.switchTier(t2.slug, B.slug, 1);
  ok('a swap across lines is refused', across.ok === false, JSON.stringify(across));
});

// ============================================================ player switch
await group('co-op: handing a Tatari to the other player takes its plan', () => {
  reset();
  store.setMode('coop');
  store.place(A.slug, 0, 1);
  store.addStep([{ slug: A.slug, player: 1 }], 4, 'note');
  const res = store.switchPlayer(A.slug, 1);
  ok('the switch succeeds', res.ok, res.reason);
  ok('it is now the other player\'s on the field', store.cellOf(A.slug, 2) === 0 && store.cellOf(A.slug, 1) === null);
  const step = store.snapshot().plan[0];
  ok('and the plan step went with it', step.members[0].player === 2 && step.level === 4, JSON.stringify(step));
});

// ============================================================ family & caps
await group('rules: one per line, and the bench and field caps, are enforced', () => {
  reset();
  const [t1, t2] = line;
  store.addToBench(t1.slug);
  ok('a second tier of the same line is blocked on the bench',
    !!store.benchBlockedReason(t2, 1), store.benchBlockedReason(t2, 1));

  reset();
  store.setSandbox(true);
  store.addToBench(t1.slug);
  ok('sandbox lifts the one-per-line rule', store.benchBlockedReason(t2, 1) === null);

  reset();
  const cap = store.benchCap();
  let benched = 0;
  for (const t of state.all) { if (store.addToBench(t.slug).ok) benched++; if (benched >= cap) break; }
  ok('the bench fills to its cap', store.benchOf(1).length === cap, `${store.benchOf(1).length}/${cap}`);
  const extra = state.all.find((t) => !store.onBench(t.slug, 1));
  ok('and refuses one past it', !!store.benchBlockedReason(extra, 1));
});

// ============================================================ sandbox copies
await group('sandbox: a duplicate is a second copy, not a move', () => {
  reset();
  store.setSandbox(true);
  store.place(A.slug, 0);
  const copy = store.placeCopy(A.slug, 1);
  ok('the copy is placed', copy.ok, JSON.stringify(copy));
  ok('both the original and the copy stand', store.allPlaced().filter((o) => o.slug === A.slug).length === 2,
    `${store.allPlaced().filter((o) => o.slug === A.slug).length}`);
});

/*
 * Sandbox duplicates move and leave by the tile you took hold of.
 *
 * Reported as "I have 3 of the same Tatari, I move one and the one I didn't
 * move moved instead". The cause is one function used two ways: place() and
 * unplace() locate the piece with cellOf(), a findIndex over the board -- the
 * FIRST tile holding that slug. Outside Sandbox a Tatari is on the field at
 * most once, so first-match and the-one-you-dragged are the same tile and
 * nothing looks wrong. Sandbox lets three copies stand, and then they are not.
 *
 * Checked at the store rather than through a drag, because this is the store's
 * bug: moveFrom and unplaceAt take a cell and are the only honest way to say
 * which copy you meant. The grid and the roster now call them for anything
 * coming off the field; the check that they do is in apptest.
 */
await group('sandbox: three copies move and leave one at a time', () => {
  reset();
  store.setSandbox(true);
  store.place(A.slug, 0);
  store.placeCopy(A.slug, 1);
  store.placeCopy(A.slug, 2);
  const at = () => store.allPlaced().filter((o) => o.slug === A.slug).map((o) => o.cell).sort((x, y) => x - y);
  eq('three copies are out', at(), [0, 1, 2]);

  /* The bug, stated as the store sees it: place() moves the first one. */
  store.moveFrom(2, 10);
  eq('moving the third moves the third, not the first', at(), [0, 1, 10]);

  store.moveFrom(0, 20);
  eq('and moving the first still moves the first', at(), [1, 10, 20]);

  /* Same for taking one off. */
  store.unplaceAt(10);
  eq('taking one off takes the one named, not the first', at(), [1, 20]);

  /* And the one function that cannot know which copy you meant still behaves:
     from the detail sheet there is no cell, so first-match is the only answer
     available and it must remain a legal one. */
  store.unplace(A.slug);
  eq('unplace by slug alone still removes exactly one', at(), [20]);
  store.setSandbox(false);
});

// ============================================================ boss pull
await group('boss pull: rows open, then close and bring everyone home', () => {
  reset();
  store.place(A.slug, 30);                   // front-ish; a lane to be pulled from
  const pulled = store.movePositions(
    [{ from: 30, to: store.cellAtRow(-1, 0), slug: A.slug, player: 1 }], 1);
  ok('a pull opens a row past the line', store.pullRows() >= 1, `${store.pullRows()}`);
  ok('the Tatari is standing past the line', store.allPlaced().some((o) => store.isEnemyCell(o.cell) && o.slug === A.slug));

  const home = store.evacuatePullRows();
  ok('closing the pull empties the enemy rows', store.pullRows() === 0);
  ok('and brings the Tatari back onto the field, not the bench',
    home.benched === 0 && store.allPlaced().some((o) => !store.isEnemyCell(o.cell) && o.slug === A.slug));
});

// ============================================================ range coverage
await group('range: coverage lands on the right tiles and clips at the edge', () => {
  reset();
  /* A plus-shape reach, injected so the arithmetic is tested against a known
     pattern rather than whichever slugs happen to carry a recorded range. Row 0
     is the front; offsets are [dCol, dRow]. */
  const cross = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];
  state.ranges = state.ranges || {};
  state.ranges.bySlug = state.ranges.bySlug || {};
  const saved = state.ranges.bySlug[A.slug];
  state.ranges.bySlug[A.slug] = { tiles: cross };
  try {
    ok('an unrecorded slug has no reach', !hasRange('not-a-slug'));
    ok('and covers nothing rather than throwing', coveredFrom(14, 'not-a-slug').length === 0);
    // Cell 14 is row 2, col 2 — all five tiles land on the 6x6 board.
    eq('a centred reach covers all five tiles',
      coveredFrom(14, A.slug).sort((a, b) => a - b), [8, 13, 14, 15, 20]);
    // Cell 0 is the front-left corner — the up and left offsets fall off the board.
    eq('a corner reach drops the tiles that fall off the board',
      coveredFrom(0, A.slug).sort((a, b) => a - b), [0, 1, 6]);

    const cov = coverage([{ cell: 14, slug: A.slug }, { cell: 0, slug: 'not-a-slug' }]);
    ok('coverage counts the recorded reach and flags the unknown one',
      cov.known === 1 && cov.unknown === 1, JSON.stringify(cov));
    ok('and every tile the reach hits is counted once',
      [8, 13, 14, 15, 20].every((i) => cov.counts[i] === 1) && cov.counts[35] === 0);
  } finally {
    if (saved === undefined) delete state.ranges.bySlug[A.slug];
    else state.ranges.bySlug[A.slug] = saved;
  }
});

// ============================================================ contribution parser
await group('contribution parser: reads a range, and names what it cannot', () => {
  const entry = (body) => `{ "${A.slug}": ${body} }`;

  const bare = parseContribution(entry('{ "tiles": [[0,0],[1,0]], "from": "range diagram" }'));
  ok('a bare recorder block yields one entry',
    bare.entries.length === 1 && bare.entries[0].slug === A.slug, JSON.stringify(bare));

  ok('empty input is reported, not silently empty',
    parseContribution('').problems.some((p) => /Nothing pasted/.test(p)));

  const fenced = parseContribution(
    `here is my range\n\`\`\`json\n${entry('{ "scope": "all", "from": "in-game observation" }')}\n\`\`\`\nthanks`);
  ok('a fenced block inside a pasted issue body is found',
    fenced.entries.length === 1 && fenced.entries[0].scope === 'all', JSON.stringify(fenced));

  const broken = parseContribution(entry('{ "tiles": [[0,0]  }'));   // unbalanced
  ok('unbalanced JSON is called out rather than swallowed',
    broken.problems.some((p) => /could not be read as JSON/.test(p)), JSON.stringify(broken));

  const both = parseContribution(entry('{ "scope": "all", "tiles": [[0,0]], "from": "other" }'));
  ok('scope "all" with tiles is refused as contradictory',
    both.entries.length === 0 && both.problems.some((p) => /reaches everything/.test(p)));

  const badTile = parseContribution(entry('{ "tiles": [[0,"x"]], "from": "other" }'));
  ok('a tile that is not a pair of whole numbers is refused',
    badTile.entries.length === 0 && badTile.problems.some((p) => /whole numbers/.test(p)));

  const dupes = parseContribution(entry('{ "tiles": [[0,0],[0,0],[1,0]], "from": "other" }'));
  ok('a repeated tile is dropped, and said so',
    dupes.entries.length === 1 && dupes.entries[0].tiles.length === 2
    && dupes.problems.some((p) => /same tile more than once/.test(p)), JSON.stringify(dupes));

  const src = parseContribution(entry('{ "tiles": [[0,0]], "from": "my own eyes" }'));
  ok('an unknown source falls back to "other" and says so',
    src.entries[0]?.from === 'other' && src.problems.some((p) => /not one of the recorder/.test(p)));

  const twice = parseContribution(
    `// data/ranges.json\n${entry('{ "tiles": [[0,0]], "from": "other" }')}\n${entry('{ "tiles": [[1,0]], "from": "other" }')}`);
  ok('the same slug listed twice collapses to the last one',
    twice.entries.length === 1 && twice.entries[0].tiles[0] === '1,0', JSON.stringify(twice.entries));
});

/*
 * The boss order, checked against the roster rather than against itself.
 *
 * It is hand-authored from play, so the failure it can actually have is a slug
 * that does not exist or a boss quietly left out -- both of which would show up
 * in the app as a card with no number and no explanation, which is worse than no
 * numbers at all because it reads as that boss never being sent.
 *
 * The inversion gets its own checks because it is the only logic here: the file
 * says "stage 15 sends Sandworm and Golf" and the app asks "Goonch, which
 * stages", and a boss the run sends three times is exactly what a naive
 * slug -> stage map would flatten to one.
 */
await group('boss order: every stage names a real boss, and every boss has a stage', async () => {
  const file = await fetch('data/boss-order.json').then((r) => r.json());
  const stages = file.stages ?? [];
  eq('the run is 25 stages long', stages.length, 25);
  eq('the loader agrees with the file', state.bossStageCount, stages.length);
  ok('and it says who worked it out', !!state.bossOrderBy, String(state.bossOrderBy));

  const named = new Set(stages.flat());
  const unknown = [...named].filter((s) => !state.zoboBySlug.has(s));
  eq('every slug in it is a Zobo the app knows', unknown, []);
  const notBoss = [...named].filter((s) => state.zoboBySlug.get(s) && !state.zoboBySlug.get(s).boss);
  eq('and every one of them is a boss', notBoss, []);

  const missing = state.zobos.filter((z) => z.boss && !named.has(z.slug)).map((z) => z.slug);
  eq('no boss is left without a stage', missing, []);

  /* A boss the run sends more than once keeps all of them. */
  eq('Goonch is sent three times, and all three survive the lookup',
    state.bossStages.get('goonch-zobo'), [2, 7, 16]);
  /* And a stage that sends two puts the same number on both cards. */
  ok('a stage that sends two bosses numbers both of them',
    state.bossStages.get('sandworm-zobo')?.includes(15)
    && state.bossStages.get('golf-zobo')?.includes(15),
    `sandworm ${state.bossStages.get('sandworm-zobo')}, golf ${state.bossStages.get('golf-zobo')}`);

  /* Every stage number is reachable from some card, which is what makes the
     "1 to 25" in the credit line under the roster true rather than decorative. */
  const reachable = new Set([...state.bossStages.values()].flat());
  eq('every stage from 1 to 25 is on at least one card',
    [...Array(stages.length)].map((_, i) => i + 1).filter((n) => !reachable.has(n)), []);
});

await group('share link: a flex square travels, which it never used to', () => {
  reset();
  store.place(A.slug, 0);
  store.toggleFlex(7);
  store.toggleFlex(9);

  const before = store.snapshot();
  eq('two squares are marked', before.flex.slice().sort((x, y) => x - y), [7, 9]);

  const frag = toFragment(before);
  ok('the link carries them', /~?fx=/.test(frag), frag);
  store.applySnapshot(fromFragment('#' + frag).blob);
  eq('and they are still marked after the round trip',
    shapeOf(store.snapshot(), { flex: true }), shapeOf(before, { flex: true }));

  /* The rule that outlives the codec: a mark says nothing is here on purpose. */
  store.place(B.slug, 7);
  eq('placing into one clears it', store.snapshot().flex, [9]);
});

await group('flex: a mark trades places with a Tatari dragged onto it', () => {
  reset();
  store.place(A.slug, 0);
  store.toggleFlex(5);
  eq('one square is open on purpose', store.snapshot().flex, [5]);

  // The drag path and the keyboard both land here.
  const moved = store.moveFrom(0, 5);
  ok('the move is allowed', moved.ok, moved.reason);
  eq('the Tatari is in the square that was marked', store.formation.cells[5].slug, A.slug);
  eq('nobody is left behind', store.formation.cells[0] ?? null, null);
  eq('and the mark took the square she left', store.snapshot().flex, [0]);

  /* The count is the invariant. Rearranging a board cannot change how many
     squares it leaves open -- that would be the tool editing your statement. */
  store.moveFrom(5, 0);
  eq('trading back returns the mark too', store.snapshot().flex, [5]);
  eq('and she is home', store.formation.cells[0].slug, A.slug);

  /* A mark spent is still spent: filling an open square from the bench is what
     the mark invited, and there is no vacated square for it to move to. */
  store.place(B.slug, 5);
  eq('a bench placement still consumes it', store.snapshot().flex, []);
});

await group('flex: a swap between two occupied squares leaves marks alone', () => {
  reset();
  store.place(A.slug, 0);
  store.place(B.slug, 1);
  store.toggleFlex(9);

  store.moveFrom(0, 1);
  eq('they exchange squares', store.formation.cells[0].slug, B.slug);
  eq('and back again', store.formation.cells[1].slug, A.slug);
  eq('the unrelated mark is untouched', store.snapshot().flex, [9]);
});

// ============================================================ swap groups
await group('swaps: a shortlist is recorded and saved with the formation', () => {
  reset();
  // Three front-line squares, holding the best guess out of six candidates.
  store.place(A.slug, 0);
  store.place(B.slug, 1);
  store.place(C.slug, 2);
  for (const t of [D, E, F]) store.addToBench(t.slug);

  const added = store.addSwap([0, 1, 2], [A, B, C, D, E, F].map((t) => t.slug));
  ok('the group is recorded', added.ok, added.reason);
  eq('naming all six lists only the three not already standing there',
    store.swapAt(0)?.slugs.slice().sort(), [D, E, F].map((t) => t.slug).sort());
  eq('every square in it finds the same group',
    [0, 1, 2].map((i) => store.swapIndexAt(i)), [0, 0, 0]);
  eq('a square outside it finds none', store.swapIndexAt(8), -1);

  const before = store.snapshot();
  store.applySnapshot(JSON.parse(JSON.stringify(before)));
  eq('it survives a save and a reload', swapShape(store.snapshot()), swapShape(before));

  const frag = toFragment(before);
  ok('the link carries it in the meta segment, not the layout', /~?sw=/.test(frag), frag);
  store.applySnapshot(fromFragment('#' + frag).blob);
  eq('and it survives the share link', swapShape(store.snapshot()), swapShape(before));

  /* The reason it needed no version bump: strip the key a reader would not know
     and the formation is still whole, just undecided about nothing. */
  const older = frag.replace(/~?sw=[^~]*/, '');
  const back = fromFragment('#' + older);
  eq('a reader that skips the key still gets the whole board',
    back.blob.cells.filter(Boolean).length, 3);
  eq('and simply knows of no shortlist', back.blob.swaps, undefined);
});

await group('swaps: the shortlist tracks the board it annotates', () => {
  reset();
  store.place(A.slug, 0);
  store.place(B.slug, 1);
  store.place(C.slug, 2);
  for (const t of [D, E, F]) store.addToBench(t.slug);
  store.addSwap([0, 1, 2], [D, E, F].map((t) => t.slug));

  // Swapping one in makes it the answer, so it stops being a question.
  store.place(D.slug, 0);
  eq('a candidate you go on to place stops being a candidate',
    store.swapAt(0)?.slugs.slice().sort(), [E.slug, F.slug].sort());

  store.unplaceAt(0);
  eq('an emptied square leaves the group', store.swapAt(0), null);
  eq('and the squares still filled keep it', store.swapAt(1)?.cells.slice().sort(), [1, 2]);

  store.unplaceAt(1);
  store.unplaceAt(2);
  eq('a group with no filled squares left goes with them', store.snapshot().swaps, []);
});

await group('swaps: a group only ever annotates a real placement', () => {
  reset();
  store.place(A.slug, 0);
  store.addToBench(B.slug);

  eq('an empty square is refused', store.addSwap([9], [B.slug]).ok, false);
  eq('so is naming only somebody already standing there',
    store.addSwap([0], [A.slug]).ok, false);
  ok('a one-square group is the same record as a three-square one',
    store.addSwap([0], [B.slug]).ok);
  eq('and a square cannot be in two groups at once',
    store.addSwap([0], [C.slug]).ok, false);

  store.toggleSwapSlug(0, C.slug);
  eq('a candidate can be named after the fact',
    store.swapAt(0)?.slugs.slice().sort(), [B.slug, C.slug].sort());
  store.toggleSwapSlug(0, C.slug);
  eq('and taken off again', store.swapAt(0)?.slugs, [B.slug]);

  store.removeSwap(0);
  eq('dropping the group leaves the board alone',
    [store.snapshot().swaps.length, store.snapshot().cells[0]?.slug], [0, A.slug]);
});

/*
 * The pinball board is a flat lottery, and the one property that says the table
 * is complete rather than merely plausible is that its chances sum to exactly
 * 100. Everything else here is arithmetic off that table -- which is the point:
 * if a payout or an odds figure is ever edited wrong, these are the numbers that
 * move, and nothing on the page itself would look broken.
 */
await group('pinball: the board pays what it says it pays', () => {
  const r2 = (n) => Math.round(n * 100) / 100;

  eq('every outcome on the board is accounted for', r2(totalChance()), 100);

  const one = expected(1);
  eq('one ball is worth 319.7 candy', r2(one.candy), 319.7);
  eq('and 1.02 Lightbulbs', r2(one.lightbulb), 1.02);
  eq('and .22 of a pickaxe and an energy drink',
    [r2(one.pickaxe), r2(one.energy)], [0.22, 0.22]);

  /* The two the page counts rather than values -- the ones worth watching,
     because a mis-typed 3.3 is invisible everywhere else. */
  eq('the gift box lands 3.3 times in a hundred', r2(expected(100).hits.card), 3.3);
  eq('and the "?" slot 1.7', r2(expected(100).hits.raid), 1.7);

  eq('a stack scales linearly', r2(expected(4687).candy), r2(one.candy * 4687));
  eq('and an empty stack is worth nothing', expected(0).candy, 0);

  /* The multiplier is not a bonus: forty balls spent one at a time and forty
     spent in one push are the same yield. If that ever stops being true, the
     whole page is wrong in a way no test of a single push would catch. */
  eq('the multiplier pays no premium', r2(expected(40).candy), r2(one.candy * 40));
});

await group('pinball: the tree cap', () => {
  eq('a hoarded stack has to spend down to the cap',
    toCap({ stock: 4687, cap: 420, mult: 40 }), { over: 4267, pushes: 107, blocked: true });

  /* 4267 / 40 is 106.675: the last push overshoots the cap rather than landing
     on it, so this rounds up. Rounding down leaves you one push short and still
     blocked, which is the failure worth naming. */
  eq('and the last push overshoots rather than falling short',
    toCap({ stock: 4267 + 420, cap: 420, mult: 40 }).pushes, 107);

  eq('sitting on the cap exactly is not blocked',
    toCap({ stock: 420, cap: 420, mult: 40 }), { over: 0, pushes: 0, blocked: false });
  eq('nor is sitting under it',
    toCap({ stock: 12, cap: 420, mult: 1 }).blocked, false);

  eq('at x1 a ball is a push', toCap({ stock: 425, cap: 420, mult: 1 }).pushes, 5);
});

/*
 * The multiplier: same average, wider swing.
 *
 * This is the one thing about the board that is genuinely counter-intuitive, and
 * the one a player acts on -- so it is the one worth pinning down. A x40 push is
 * a single roll paid forty times, which means the average cannot move and the
 * deviation must, by exactly root-40. Get either half wrong and the page gives
 * confident advice in the wrong direction.
 */
await group('pinball: the multiplier trades spread, never yield', () => {
  const r2 = (n) => Math.round(n * 100) / 100;
  const BALLS = 4680;   // divides by every multiplier the page offers

  eq('x40 pays the same candy as x1', r2(expected(BALLS).candy), 1496196);

  /* Averages are a property of the balls, not of how they are spent -- which is
     why expected() refuses to take a multiplier at all. */
  eq('and the same rares', [r2(expected(BALLS).raid), r2(expected(BALLS).card)],
    [79.56, 154.44]);

  const one = spread(BALLS, 1);
  const forty = spread(BALLS, 40);

  ok('a x1 stack still has a spread', one.candy > 0);
  eq('x40 widens it by exactly root-40',
    r2(forty.candy / one.candy), r2(Math.sqrt(40)));
  eq('rares widen by the same factor',
    r2(forty.raid / one.raid), r2(Math.sqrt(40)));

  /* The number the page prints, and the reason the panel exists: at x40 the
     raid count swings by two thirds of itself. */
  eq('camp raids swing ~56 at x40', Math.round(forty.raid), 56);
  eq('and ~9 at x1', Math.round(one.raid), 9);

  /* Candy is the counter-example: even at x40 it is within a few percent, which
     is what lets the page say "near enough a certainty" about it and not the
     others. */
  ok('candy stays inside 4% even at x40', forty.candy / expected(BALLS).candy < 0.04);

  eq('one roll of one ball has the spread of one roll',
    r2(spread(1, 1).candy), r2(spread(40, 40).candy / 40));
  eq('a stack too small for one push has no spread', spread(10, 40).candy, 0);
});

/*
 * The specials fold in only once somebody has measured them, and an unmeasured
 * special must change nothing. That is the property worth testing: the failure
 * mode is not a wrong total, it is a page that quietly starts treating zero as
 * a measurement and reports the board's floor as the whole answer.
 */
await group('pinball: the specials are added, never assumed', () => {
  const ev = expected(4680);

  eq('nothing measured changes nothing',
    withSpecials(ev, {}).candy, ev.candy);
  eq('and a partly-filled measurement only moves what it names',
    withSpecials(ev, { cardBalls: 10 }).candy, ev.candy);

  /* 154.44 cards at 5000 candy each, on top of the board's own 1,496,196. */
  eq('candy from cards lands on top of the board candy',
    Math.round(withSpecials(ev, { cardCandy: 5000 }).candy), 2268396);
  eq('raids pay into the same pot',
    Math.round(withSpecials(ev, { raidCandy: 8000 }).candy), 2132676);

  eq('pinballs come back as stock rather than yield',
    Math.round(withSpecials(ev, { cardBalls: 10 }).balls), 1544);
  eq('energy from cards joins the energy from slot 4',
    Math.round(withSpecials(ev, { cardEnergy: 2 }).energy), Math.round(ev.energy + ev.card * 2));

  /* The multiplier is already inside the card count, so a per-card figure must
     not be scaled again -- doing it twice is the one arithmetic slip here that
     would look plausible on screen. */
  eq('a card is worth the same per card at any multiplier',
    withSpecials(expected(4680), { cardCandy: 100 }).candy
      - expected(4680).candy,
    expected(4680).card * 100);
});

/*
 * A pinball is worth the same wherever you spend it.
 *
 * The step you pick is both the pinball cost of a ball and the multiple printed
 * on the slots, so they cancel: stock/mult rolls each paying mult. A draft of
 * this page split them into separate fields and announced x60 as a four-to-one
 * bargain; 11,000 pinballs spent for about 3,000 pickaxes said otherwise. These
 * pin the cancellation, because it is the property the whole page rests on and
 * the one that was got wrong.
 */
await group('pinball: every step is the same value per pinball', () => {
  const r2 = (n) => Math.round(n * 100) / 100;
  /* What the page computes: floor(stock / mult) rolls, each paid mult times. */
  const units = (stock, mult) => Math.floor(stock / mult) * mult;

  for (const m of [1, 2, 3, 5, 10, 20, 40, 60]) {
    eq(`x${m} on a stack that divides by it spends the lot`, units(4800, m), 4800);
  }

  eq('11,000 pinballs buy 2,420 pickaxes at x1',
    Math.round(expected(units(11000, 1)).pickaxe), 2420);
  eq('and the same 2,420 at x40',
    Math.round(expected(units(11000, 40)).pickaxe), 2420);
  eq('and all but the remainder of them at x60',
    Math.round(expected(units(11000, 60)).pickaxe), 2416);

  /* The 4x reading this replaced would have predicted 9,676 here. Named so the
     wrong answer cannot come back without a test going red. */
  ok('no step pays anything like four times another',
    expected(units(11000, 60)).pickaxe < expected(units(11000, 1)).pickaxe * 1.01);

  /* What the step DOES buy: fewer, larger rolls. Same mean, wider spread. */
  eq('x40 swings root-40 wider than x1 on one stack',
    r2(spread(units(4680, 40), 40).candy / spread(units(4680, 1), 1).candy),
    r2(Math.sqrt(40)));

  /* Spending down to the cap is a pinball count, and the step is what a ball
     costs, so this counts balls at that step. */
  eq('the cap is cleared in balls at the step you press',
    toCap({ stock: 4687, cap: 420, mult: 40 }).pushes, 107);
});

/*
 * Landings, not awards.
 *
 * The gift box and the "?" slot report how many times the ball hits them, while
 * every other figure reports what you are handed. They coincide at x1 and
 * diverge by exactly the multiplier -- so the bug guarded against here is the
 * page reporting 154 landings at x40, which would read as an entirely plausible
 * number and be wrong by a factor of forty.
 */
await group('pinball: the two specials are counted in landings', () => {
  const r2 = (n) => Math.round(n * 100) / 100;
  const rolls = Math.floor(4680 / 40);              // the x40 step
  eq('4,680 pinballs at x40 is 117 rolls', rolls, 117);

  const lands = expected(rolls);
  const awards = expected(rolls * 40);

  eq('the ball hits the gift box about four times', r2(lands.card), r2(rolls * 0.033));
  eq('and slot 3 about twice', r2(lands.raid), r2(rolls * 0.017));

  eq('each landing pays the multiplier', r2(awards.card), r2(lands.card * 40));
  ok('so the award dwarfs the landing count', awards.card > lands.card * 30);

  /* A landing count is a plain binomial over the rolls -- no multiplier in it at
     all, because you cannot land a fraction of a ball. */
  eq('landings swing like a coin count, not like a payout',
    r2(spread(rolls, 1).card), r2(Math.sqrt(rolls * 0.033 * 0.967)));

  /* Holding the button launches fifteen balls at once -- fifteen rolls, which
     is how three Reward Cards fit in one pull. It is convenience only, so no
     total may depend on it. */
  eq('a full hold is fifteen rolls and changes no total',
    expected(15).candy, expected(1).candy * 15);
});

// ---------------------------------------------------------------- verdict
const nothingMatched = Boolean(only) && !matchedOnly;
out.innerHTML += `<div style="margin-top:12px">${pass} passed, ${fail} failed</div>`;
document.title = `${fail ? `FAIL (${fail})` : (nothingMatched ? 'ok, nothing matched' : 'ok')}: state and codecs`;
window.__done = { pass, fail };
</script>
