<!doctype html>
<meta charset="utf-8">
<title>Horde Drafter: phone checks</title>
<body style="font:13px/1.5 ui-monospace,monospace;background:#12141a;color:#e7eaf1;margin:0">
<!--
  The phone build, checked at phone size.

  Three quarters of the people who use this are on a phone and 47% of the
  browsers are Safari, so the layout the desktop suite exercises is the minority
  one. This runs the same app in a 390x844 frame, which is where the shell
  changes shape entirely: the field takes the screen, the three panels become
  sheets, and a fixed bar appears along the bottom.

  What it cannot do is pretend to be a touchscreen. `@media (hover: none)` does
  not match in a desktop browser at any width, so the rules in that block --
  touch targets, the plan's drag grip, the sideways effect row -- are checked by
  reading them out of the stylesheet rather than by watching them apply. That
  half is honest about being a static check, and the checks say so.
-->
<div style="display:flex;height:100vh">
  <div style="flex:1 1 auto;overflow:auto;padding:16px;box-sizing:border-box">
    <h1 style="font:600 15px system-ui;margin:0 0 4px">Phone checks</h1>
    <p id="head" style="margin:0 0 12px;color:#a3aab9">starting…</p>
    <div id="log"></div>
  </div>
  <!-- A real phone viewport. 390x844 is an iPhone 14, which is the shape most of
     this app's traffic actually arrives in. -->
  <div id="stage" style="flex:0 0 390px;position:relative;border-left:1px solid #2e3340"></div>
</div>

<script type="module">
const out = document.getElementById('log');
let pass = 0, fail = 0;

const line = (html) => out.insertAdjacentHTML('beforeend', html);
const ok = (name, cond, detail) => {
  if (cond) { pass++; line(`<div style="color:#55c98a">  ok   ${name}</div>`); }
  else {
    fail++;
    line(`<div style="color:#f0654f">  FAIL ${name}${detail ? `<div style="padding-left:7ch;color:#a3aab9">${detail}</div>` : ''}</div>`);
  }
};
const eq = (name, got, want) => ok(name, Object.is(got, want), `got ${JSON.stringify(got)}, wanted ${JSON.stringify(want)}`);
/* Timings are reported whether they pass or not: a budget that quietly passes at
   199ms is worth seeing before it becomes 201. */
/*
 * Timings are a measurement, and a measurement needs a clock.
 *
 * tools/check.sh drives these pages under Chrome's virtual clock, which
 * fast-forwards every wait so a forty-minute suite finishes in fifteen seconds.
 * performance.now() advances with it, so a paint "taking 3s" there is not slow
 * -- it is a number about a clock that is not measuring time. Reported as
 * skipped rather than passed or failed, because both of those would be a claim
 * nobody made. Open the page in a browser to get the real figures.
 */
const noClock = new URLSearchParams(location.search).get('perf') === 'off';
const under = (name, ms, budget) => {
  if (noClock) { skip(name, 'no real clock: this run is under a virtual one'); return; }
  const good = ms <= budget;
  if (good) { pass++; line(`<div style="color:#55c98a">  ok   ${name} <span style="color:#a3aab9">${ms.toFixed(0)}ms of ${budget}ms</span></div>`); }
  else { fail++; line(`<div style="color:#f0654f">  FAIL ${name}: ${ms.toFixed(0)}ms, budget ${budget}ms</div>`); }
};

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (test, what, ms = 25000) => {
  const stop = Date.now() + ms;
  while (Date.now() < stop) { if (test()) return true; await sleep(50); }
  throw new Error(`timed out waiting for ${what}`);
};

/*
 * Run one group, or a few, instead of all of them.
 *
 * `?only=chips` runs every group whose name contains "chips". Two reasons it
 * earns its place. Iterating on one group meant sitting through the other
 * twenty every time; and a browser freezes a page that has been hidden for
 * about five minutes, while clamping every timer in it to a second before that
 * -- so a full run in a background window reaches roughly a hundred checks and
 * stops. Halves finish.
 */
const only = new URLSearchParams(location.search).get('only')?.toLowerCase() ?? '';

/*
 * A third outcome, for the checks that need the window to actually be on
 * screen. A measurement taken while the tab is occluded is not a failure the
 * app caused, and reporting it as one teaches you to ignore the suite.
 */
let skipped = 0;
const skip = (name, why) => {
  line(`<div style="color:#8f99aa">  skip ${name}<div style="padding-left:7ch">${why}</div></div>`);
  skipped += 1;
};

const runGroup = async (name, body) => {
  /* Boot is never skipped. It is where the frame is waited for and where D, W
     and the roster total come from, so filtering it out leaves every other
     group reading properties of undefined -- which is what "?only=flex" did on
     its first outing. */
  if (only && !name.toLowerCase().includes('boot') && !name.toLowerCase().includes(only)) return;

  /*
   * Re-point at the live document before every group.
   *
   * D is the app frame's document, captured once at boot. If anything inside
   * the app navigates that frame -- a link, a reload -- the old document is torn
   * down and every querySelector against it starts answering null, which
   * surfaces two groups later as "cannot read properties of null" and looks
   * like a bug in whatever group happened to be running. It is not; it is a
   * stale handle. One line, once, in the only place every group passes through.
   */
  if (app.contentDocument && app.contentDocument !== D) {
    D = app.contentDocument;
    W = D.defaultView;
  }
  line(`<div style="margin:12px 0 2px;color:#ffc93c;font-weight:700">${name}</div>`);
  try { await body(); } catch (err) {
    fail++;
    line(`<div style="color:#f0654f">  FAIL ${name} threw: ${err.message}</div>`);
  }
};

const saved = { ...localStorage };
/*
 * The frame shares this origin's storage, so whatever is in it is whatever the
 * last visit left: a saved formation, a dismissed update notice, a half-drafted
 * board. Wiped so the drafting checks below start from an empty field, and put
 * back at the end so running the suite never costs anyone their saves.
 */
localStorage.clear();
const stage = document.getElementById('stage');
/*
 * Every file the app is made of, re-fetched past the cache before anything runs.
 *
 * This is not housekeeping. Reload this page after editing a module and the
 * frame can be handed the version that was there before the edit -- a full run
 * of green against code that no longer exists, which is the worst thing a suite
 * can do and exactly what happened while this one was being written. A query
 * string on the frame's own URL does not help: index.html asks for
 * assets/js/app.js by that name whatever the page's address was, and that is
 * the request that comes back stale.
 *
 * So the graph is walked and every file in it fetched with cache: 'reload',
 * which revalidates the entry the frame is about to use. Thirty-odd requests
 * against a local server, and the alternative is a suite that lies.
 */
async function freshen(...entries) {
  const seen = new Set();
  const queue = [...entries];
  while (queue.length) {
    const url = new URL(queue.shift(), location.href).href;
    if (seen.has(url) || !url.startsWith(location.origin)) continue;
    seen.add(url);
    let text;
    try { text = await (await fetch(url, { cache: 'reload' })).text(); } catch { continue; }
    if (/\.html$/.test(url)) {
      for (const m of text.matchAll(/(?:src|href)="([^":]+\.(?:js|css))"/g)) queue.push(new URL(m[1], url).href);
    } else if (/\.js$/.test(url)) {
      for (const m of text.matchAll(/from\s+'([^']+\.js)'/g)) queue.push(new URL(m[1], url).href);
    }
  }
  return seen.size;
}
const freshened = await freshen('index.html', 'changes.html');

let runs = 0;
const frameFor = (src) => {
  const f = document.createElement('iframe');
  f.ready = new Promise((resolve) => f.addEventListener('load', resolve, { once: true }));
  f.src = `${src}?run=${performance.now().toFixed(0)}.${runs++}`;
  f.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
  stage.append(f);
  return f;
};

let D, W;
const $ = (sel) => D.querySelector(sel);
const $$ = (sel) => [...D.querySelectorAll(sel)];
const cards = () => $$('.panel--roster .card').length;
/*
 * Scoped to the bar on purpose. An open sheet writes data-sheet onto <body>,
 * and <body> comes first in document order -- so a plain
 * querySelector('[data-sheet="roster"]') hands back the body element and the
 * second tap lands on nothing. That is exactly how this suite first "found" a
 * broken close button that works.
 */
const barBtn = (name) => $(`#appbar [data-sheet="${name}"]`);
const click = async (el, settle = 260) => { el.click(); await sleep(settle); };
const bootAt = performance.now();
const app = frameFor('index.html');
let firstPaint = 0;
let total = 0;

await runGroup('boot on a phone', async () => {
  ok('the app was re-fetched past the cache first', freshened > 20, `${freshened} files`);
  await app.ready;
  D = app.contentDocument;
  W = app.contentWindow;
  await until(() => D.querySelectorAll('.panel--roster .card').length > 0, 'the roster');
  firstPaint = performance.now() - bootAt;

  eq('the frame really is phone width', W.innerWidth, 390);
  ok('the phone stylesheet is the one in force', W.matchMedia('(max-width: 760px)').matches);
  total = cards();
  ok('every Tatari is there', total > 200, `${total} cards`);
  /*
   * A budget rather than a stopwatch. This is one machine on localhost, so the
   * number means little on its own -- what it catches is the day somebody adds a
   * blocking fetch to boot and it goes from two seconds to nine.
   */
  under('first roster paint', firstPaint, 4000);
});

await runGroup('the phone shell', async () => {
  const bar = $('#appbar');
  ok('the app bar exists', !!bar);
  ok('the app bar is actually visible here',
     W.getComputedStyle(bar).display !== 'none', W.getComputedStyle(bar).display);
  ok('it is pinned to the bottom rather than scrolling away',
     W.getComputedStyle(bar).position === 'fixed');
  const labels = [...bar.querySelectorAll('.appbar__label')].map((l) => l.textContent.trim());
  ok('every panel has a way in', ['Add', 'Summary', 'Plan', 'Saved'].every((l) => labels.includes(l)), labels.join(', '));
  ok('sharing is on the bar, not buried in the header', labels.includes('Share'));

  /* The reason the shell exists: the field is the page here, and a screenshot of
     it is how formations actually travel. If it does not fit, that breaks. */
  const field = $('.panel--field').getBoundingClientRect();
  ok('the field fits one phone screen', field.height <= 844, `${Math.round(field.height)}px tall`);
  ok('nothing overflows sideways',
     D.documentElement.scrollWidth <= 390 + 1, `${D.documentElement.scrollWidth}px wide`);
});

await runGroup('sheets open and close', async () => {
  for (const name of ['roster', 'priority', 'saves']) {
    await click(barBtn(name), 320);
    eq(`${name}: opening it marks the body`, D.body.dataset.sheet, name);
    ok(`${name}: the page behind it stops scrolling`,
       W.getComputedStyle(D.body).overflow === 'hidden');
    ok(`${name}: what is behind it goes inert`, D.querySelector('.topbar').inert);
    await click(barBtn(name), 320);
    ok(`${name}: pressing it again closes`, !D.body.dataset.sheet, D.body.dataset.sheet);
    ok(`${name}: and the page behind it comes back`, !D.querySelector('.topbar').inert);
  }

  // Every other way out of a sheet, since a phone offers three.
  await click(barBtn('roster'), 320);
  D.querySelector('#scrim').click();
  await sleep(300);
  ok('tapping the field behind it closes', !D.body.dataset.sheet, D.body.dataset.sheet);

  await click(barBtn('roster'), 320);
  W.history.back();
  await sleep(400);
  ok('the Android back gesture closes the sheet rather than leaving',
     !D.body.dataset.sheet, D.body.dataset.sheet);
});

await runGroup('the filters fold away', async () => {
  /*
   * The sheet exists to show 230 Tatari and was spending 225px of its 700 on
   * the controls for narrowing them: three card rows of roster, and the rest of
   * the screen describing it. The search stays out, because it is the fastest
   * filter and the first thing people reach for; the rest folds.
   */
  /* Opened here and closed again at the end. The groups after this one open it
     themselves and assert that it opened, so leaving it open turns their first
     press into a close and every check after it measures a hidden sheet. */
  const wasOpen = D.body.dataset.sheet === 'roster';
  if (!wasOpen) await click(barBtn('roster'), 340);
  const fold = $('#filters-toggle');
  ok('there is a way to fold them', !!fold);
  ok('and it is only on a phone', W.getComputedStyle(fold).display !== 'none');

  /*
   * Measured on the filter block itself, not on how much roster is left over.
   *
   * The obvious check -- sheet bottom minus first card top -- is not measurable
   * here. The sheet is revealed by a transform, and a tab that is not being
   * rendered never applies it: the panel reports the same rect open and closed,
   * 700px tall with 650 of it below a 844px viewport. An earlier version of this
   * check believed those numbers and reported a tidy "4.9 card rows" that was
   * arithmetic on a rect nobody could see.
   *
   * The filter block's own height is plain layout and is honest either way, and
   * it is the thing that actually changed: every pixel it gives up is a pixel
   * the roster gets.
   */
  const filtersPx = () => Math.round($('.filters').getBoundingClientRect().height);

  const folded = filtersPx();
  ok('closed by default', fold.getAttribute('aria-expanded') === 'false');
  ok('and folded they cost almost nothing', folded < 60, `${folded}px of filters`);
  ok('the search is still out where you can reach it',
     W.getComputedStyle($('#search')).display !== 'none');

  await click(fold, 340);
  const opened = filtersPx();
  ok('opening them costs real room', opened > folded * 3, `${opened}px open vs ${folded}px folded`);
  ok('and the element chips are reachable', W.getComputedStyle($('#filter-types')).display !== 'none');

  /*
   * The count is the whole point of the closed state. A filter that is on and
   * out of sight is worse than no filter at all -- the roster looks broken and
   * nothing on screen says why.
   */
  await click($('.chip--type[data-value="Water"]'), 320);
  await click($('#filters-toggle'), 340);
  ok('folded again, it admits what is still on', /\d/.test(fold.textContent),
     `button reads "${fold.textContent.trim()}"`);
  ok('and the roster is narrowed to match', cards() < total, `${cards()} of ${total}`);

  await click($('#btn-reset-filters'), 320);
  if (!wasOpen) await click(barBtn('roster'), 320);
});

await runGroup('filtering, from inside the sheet', async () => {
  await click(barBtn('roster'), 340);
  eq('the roster sheet is open', D.body.dataset.sheet, 'roster');

  /*
   * Timed synchronously, and only synchronously.
   *
   * Applying a filter rebuilds every card and rebinds every drag handler in one
   * blocking pass, so the whole cost of a tap sits between .click() returning
   * and the next line -- which is also exactly the stretch a thumb waits
   * through. Nothing here waits on a timer, because a browser clamps
   * setTimeout to one second in a tab that is not in front, and a suite whose
   * verdict depends on whether you were looking at it is worse than no suite.
   * That clamp is why the search box below is checked for what it does rather
   * than for how long its 120ms debounce took.
   */
  const tap = (el) => { const t = performance.now(); el.click(); return performance.now() - t; };

  const filterMs = tap($('.chip--type[data-value="Water"]'));
  const water = cards();
  ok('it narrowed', water > 0 && water < total, `${water} of ${total}`);
  under('applying a filter', filterMs, 250);

  // The heaviest redraw there is: back to all 230 cards, every sprite rebuilt.
  under('clearing it again, all 230 cards', tap($('.chip--type[data-value="Water"]')), 300);
  eq('clearing put it back', cards(), total);

  const box = $('#search');
  box.value = 'frost';
  box.dispatchEvent(new W.Event('input', { bubbles: true }));
  await until(() => cards() !== total, 'the search to apply', 6000);
  const found = cards();
  ok('search narrows the roster', found > 0 && found < total, `${found} cards`);
  /* Not the arbitrary one it looks like. Stoodbeak's skill is Frostbust, so a
     search matching names only would find fewer than a search that reads
     skills, and this is the cheapest way to notice that changed. */
  ok('and it reads skills, not just names',
     $$('.panel--roster .card__name').some((el) => !/frost/i.test(el.textContent)));

  await click($('#btn-reset-filters'), 320);
  box.value = '';
  eq('reset puts it back', cards(), total);
});

await runGroup('drafting, the way a phone does it', async () => {
  /*
   * The whole reason the shell exists, end to end.
   *
   * On a desktop you drag a card onto the field. On a phone the two are never on
   * screen together, so the path is three taps -- card, chip, cell -- and it is
   * the only path most of this app's traffic has. If it breaks, the app does.
   */
  const count = (sel) => Number($(sel).textContent || 0);
  eq('nothing is benched to start', count('#appbar-bench'), 0);

  await click(barBtn('roster'), 340);
  const first = $('.panel--roster .card');
  const name = first.querySelector('.card__name').textContent.trim();
  await click(first, 260);
  eq('tapping a card benches it', count('#appbar-bench'), 1);
  ok('and the card says so', $(`.card[data-slug="${first.dataset.slug}"]`).classList.contains('is-benched'));

  await click(barBtn('roster'), 340);
  const chip = $('.benchchip');
  ok(`${name} is on the bench, under the field`, !!chip);

  await click(chip, 220);
  ok('tapping the chip arms it', $('.benchchip').classList.contains('is-armed'));

  const empty = $$('.cell:not(.cell--enemy)').find((c) => !c.querySelector('.token'));
  await click(empty, 300);
  eq('tapping a square places it', count('#appbar-field'), 1);
  eq('and the chip leaves the bench strip', $$('.benchchip').length, 0);
  /*
   * Still 1, and deliberately. The badge on Add counts what you are bringing,
   * not what is still waiting -- placing a Tatari does not stop you bringing
   * it, and a badge that emptied on the first placement would read as "you have
   * nobody" with a full field.
   */
  eq('but you are still bringing it', count('#appbar-bench'), 1);
  ok('nothing is left armed', !$('.benchchip.is-armed'));

  // The plan, reached from the token rather than from the plan sheet -- which is
  // the only way to add a step without leaving the field.
  const add = $('.cell [data-add-step]');
  ok('a placed Tatari offers a level-up step', !!add);
  await click(add, 300);
  eq('adding one shows on the bar', count('#appbar-steps'), 1);

  await click(barBtn('priority'), 340);
  ok('and the plan sheet lists it', $$('.prio:not(.prio--ghost)').length >= 1);
  ok('the step names the Tatari', $('.panel--priority').textContent.includes(name));
  await click(barBtn('priority'), 320);

  await click(barBtn('summary'), 340);
  ok('the summary sheet has something to say', $('#summary').textContent.trim().length > 0);
  await click(barBtn('summary'), 320);
});

await runGroup('flex slots on a phone', async () => {
  /*
   * The mark exists for the screenshot, and three quarters of the screenshots
   * are taken here. What matters at this width is that the control is reachable
   * without opening a sheet -- the field owns the screen, and a toggle that
   * lives behind a panel you have to open first is a toggle nobody finds.
   */
  const box = $('#opt-flex');
  ok('the toggle is on the field, not behind a sheet', !!box);
  ok('and it is on screen with the board',
     !!box && W.getComputedStyle(box.closest('label')).display !== 'none');

  const cell = (n) => $(`.cell[data-cell="${n}"]`);
  const marked = () => $$('.cell.is-flex').length;

  box.click();
  await sleep(340);
  ok('turning it on marks the board as markable', D.body.classList.contains('is-flexing'));

  /* The empty squares have to look pressable, or the toggle reads as broken:
     it is on, and nothing about the board changed. */
  const empty = $$('.cell:not(.is-filled)')[0];
  eq('empty squares show they are targets now',
     W.getComputedStyle(empty).borderStyle, 'dashed');

  await click(cell(3), 300);
  eq('a tap marks one', marked(), 1);
  const box3 = cell(3).getBoundingClientRect();
  ok('and the square is a real target for a thumb', box3.width >= 24 && box3.height >= 24,
     `${Math.round(box3.width)}x${Math.round(box3.height)}`);
  ok('it says FLEX in the picture', !!cell(3).querySelector('.cell__flex'));

  await click(cell(3), 300);
  eq('tapping again clears it', marked(), 0);

  box.click();
  await sleep(300);
  ok('and the mode ends', !D.body.classList.contains('is-flexing'));
});

await runGroup('past the contact line', async () => {
  /*
   * The rows the boss pull and the Zobo ground open are a second element, and
   * every board handler used to be bound to the near grid alone. A Tatari out
   * there could be dragged and nothing else: double-clicking it did not take it
   * off the field, and an armed chip would not drop into it either.
   *
   * Reached here through the Zobo ground rather than through a pull, because the
   * pull only reaches past the line when a lane is already full to the front
   * rank and that takes six placements to arrange. Same cells, same element,
   * same handlers.
   */
  await click($('#opt-zobo'), 420);
  const beyond = $('#enemy .cell[data-cell="60"]');
  ok('the ground past the line is open', !!beyond && $('#enemy').offsetHeight > 0);

  /* Not merely "not benched": a card from the same evolution line answers a tap
     by switching tier instead, which benches nobody. */
  await click(barBtn('roster'), 340);
  const fresh = $$('.panel--roster .card')
    .find((c) => !c.classList.contains('is-benched') && !c.dataset.switchFrom);
  await click(fresh, 320);
  await click(barBtn('roster'), 340);
  const waiting = $('.benchchip');
  ok('there is something on the bench to place', !!waiting);
  await click(waiting, 250);
  await click(beyond, 350);
  ok('an armed chip drops into a cell past the line', beyond.classList.contains('is-filled'));

  beyond.dispatchEvent(new W.MouseEvent('dblclick', { bubbles: true }));
  await sleep(320);
  ok('and double-clicking it takes it off the field again', !beyond.classList.contains('is-filled'));
  ok('it goes back to the bench rather than nowhere', $$('.benchchip').length >= 1);

  await click($('#opt-zobo'), 420);
});

await runGroup('keeping and sharing it', async () => {
  await click(barBtn('saves'), 340);
  const before = $$('.save').length;
  await click($('#btn-keep'), 420);
  eq('saving adds one', $$('.save').length, before + 1);
  ok('and the bar counts it', Number($('#appbar-saves').textContent || 0) >= 1);
  await click(barBtn('saves'), 320);

  await click($('#appbar [data-action="share"]'), 500);
  const dialog = $('dialog[open]');
  ok('Share opens something', !!dialog);
  ok('the sheet got out of the way first', !D.body.dataset.sheet);
  dialog?.close();
  await sleep(200);
});

await runGroup('what this session added, at phone size', async () => {
  ok('the update notice is on the page before anything is opened',
     !$('#patch-note').hidden);
  const note = $('#patch-note').getBoundingClientRect();
  ok('the notice fits the width', note.width <= 390, `${Math.round(note.width)}px`);
  ok('it links to the update page', $('#patch-note').getAttribute('href') === 'changes.html');

  ok('the patch chips are reachable in the sheet', $$('.chip--changed').length > 0);

  /*
   * Counted against a filter that is already on, which is the whole point of
   * the number.
   *
   * With nothing else set, a chip that ignored the rest of the filters would
   * print the right total anyway -- so checking it on a clean roster proves
   * nothing. Water first, then the chip has to say how many Water Tatari the
   * update touched, not how many Tatari it touched.
   */
  await click($('.chip--type[data-value="Water"]'), 300);
  const narrowed = cards();
  const key = $('.chip--changed').dataset.changed;
  const says = Number($('.chip--changed b').textContent);
  ok('a chip promises fewer than the whole roster', says < narrowed, `${says} of ${narrowed}`);
  await click($(`.chip--changed[data-changed="${key}"]`), 340);
  eq('and finds exactly what it promised', cards(), says);

  /*
   * The half of faceting that only shows once a facet is on.
   *
   * These three are one choice, so while Buffed is selected the other two have
   * to keep counting as though it were not -- otherwise they read 0, and a
   * group where switching looks impossible is a group nobody switches in. It is
   * also the only way this breaks: with nothing chosen, a chip that ignored the
   * rest of the filters would print the right number anyway.
   */
  const others = $$('.chip--changed').map((c) => c.dataset.changed).filter((d) => d !== key);
  const wrong = [];
  for (const dir of others) {
    const promised = Number($(`.chip--changed[data-changed="${dir}"] b`).textContent);
    await click($(`.chip--changed[data-changed="${dir}"]`), 340);
    if (cards() !== promised) wrong.push(`${dir} said ${promised}, found ${cards()}`);
    await click($(`.chip--changed[data-changed="${dir}"]`), 340);
    await click($(`.chip--changed[data-changed="${key}"]`), 340);
  }
  ok('the directions you did not pick still count as if you had not', wrong.length === 0, wrong.join('; '));
  /* Zero is a legitimate answer -- only one line was Adjusted this patch, and
     it is not Water -- so the check above compares promise to result rather
     than demanding a number above zero. */

  await click($(`.chip--changed[data-changed="${key}"]`), 340);
  await click($('#btn-reset-filters'), 300);

  /* The filters fold on a phone, and a folded row measures 0x0. Geometry needs
     them open; the checks above only press things, and a press lands on a
     hidden element just fine. */
  if (D.body.dataset.filters !== 'open') await click($('#filters-toggle'), 320);
  await click($('.fxcaret[data-group="debuff"]'), 340);
  const sub = $('#filter-effect-types');
  ok('the effect row opens', $$('.chip--fxtype').length > 5);
  /*
   * One line that scrolls, not four that wrap. Eleven chips wrapping is the cost
   * the touch block was written to avoid: filters taller than the roster below
   * them. Measured, not assumed -- the row is only one line tall if its content
   * is wider than it is.
   */
  /*
   * The rule that keeps this to one line lives in @media (hover: none), which
   * never matches in a desktop browser -- so what is checked is the claim the
   * rule rests on: that with wrapping off, the row is one line tall and the
   * overflow it then has is horizontal. If a future group grows a chip too tall
   * to fit, this fails even though the CSS did not change.
   */
  const shim = D.createElement('style');
  shim.textContent = `
    .chips--sub { flex-wrap: nowrap; overflow-x: auto; }
    .chips--sub .chips__group { flex-wrap: nowrap; }
    .chips--sub .chip { flex: none; }`;
  D.head.append(shim);
  const row = sub.getBoundingClientRect();
  ok('with wrapping off the row is one line tall', row.height < 44, `${Math.round(row.height)}px tall`);
  ok('and it is wider than the sheet, so it scrolls rather than clips',
     sub.scrollWidth > sub.clientWidth, `${sub.scrollWidth} in ${sub.clientWidth}`);
  shim.remove();
  await click($('#btn-reset-filters'), 320);
});

/*
 * The bug this group exists for, reported from a phone with a screenshot.
 *
 * data-chip-view is written onto #roster when the chips list renders, and it
 * describes only the chips list: in "list" it forces one full-width column.
 * Going back to Tatari left it there, so 230 critters rendered one enormous
 * card per row. Nothing threw. No count was wrong. The only symptom was the
 * layout, which is exactly the kind of break every check written so far walks
 * straight past.
 *
 * So the check is not "the chips tab tidies up after itself". It is the general
 * shape: measure a list, leave by every route there is, come back, and find it
 * exactly as it was -- attributes, columns, card count and the header number.
 * That catches the next thing somebody leaves behind as well as this one.
 */
await runGroup('switching lists leaves nothing behind', async () => {
  await click(barBtn('roster'), 340);   // the roster is a sheet on a phone
  await click($('#btn-reset-filters'), 320);
  const roster = $('#roster');
  const tab = (name) => $(`#roster-tabs [data-list="${name}"]`);
  const LISTS = ['tatari', 'zobos', 'chips'];
  ok('all three lists have a tab', LISTS.every((l) => !!tab(l)));

  const shapeOf = () => {
    const cs = D.defaultView.getComputedStyle(roster);
    return {
      attrs: [...roster.attributes].map((a) => `${a.name}=${a.value}`).sort().join(' | '),
      columns: cs.gridTemplateColumns.split(/\s+/).filter(Boolean).length,
      cards: roster.children.length,
      count: $('#roster-count').textContent.trim(),
    };
  };
  const go = async (name) => { await click(tab(name), 420); return shapeOf(); };

  const first = {};
  for (const l of LISTS) first[l] = await go(l);

  /*
   * The failing symptom, said as a number: one column is the chips' list view
   * wearing the Tatari roster's clothes.
   *
   * Only asked when the roster has a real width. auto-fill fits one 76px track
   * into anything narrower than about 160px, and a window sitting behind
   * another app reports its frame as four pixels wide -- so unguarded this
   * fails for a reason the app had no part in. The round trips above are the
   * check that does not care how wide anything is.
   */
  const wide = () => roster.getBoundingClientRect().width >= 200;
  if (!wide()) {
    skip('the roster is a grid of several columns',
         `the roster measures ${Math.round(roster.getBoundingClientRect().width)}px, so this window is not on screen`);
  } else {
    ok('the Tatari list is a grid of several columns', first.tatari.columns > 1,
       `${first.tatari.columns} column(s)`);
    ok('and so is the Zobo list', first.zobos.columns > 1, `${first.zobos.columns} column(s)`);
  }

  const KEYS = ['attrs', 'columns', 'cards', 'count'];
  for (const home of LISTS) {
    for (const via of LISTS) {
      if (via === home) continue;
      await go(home);
      await go(via);
      const back = await go(home);
      const drift = KEYS.filter((k) => back[k] !== first[home][k]);
      ok(`${home} comes back unchanged from ${via}`, drift.length === 0,
         drift.map((k) => `${k}: ${JSON.stringify(back[k])} not ${JSON.stringify(first[home][k])}`).join('; '));
    }
  }

  /*
   * The other half of the same fix. Clearing the attribute on the way out must
   * not throw away the reader's choice on the way back in -- a view switch that
   * forgets is a worse bug than the one being fixed, and the obvious fix for
   * the leak (never write the attribute) would cause it.
   */
  const view = $('#chip-view');
  ok('the chips have a view switch', !!view);
  if (view) {
    await go('chips');
    await click(view.querySelector('[data-view="grid"]'), 400);
    eq('grid can be chosen', roster.dataset.chipView, 'grid');
    await go('tatari');
    ok('leaving the chips takes their layout with them', !roster.dataset.chipView,
       roster.dataset.chipView);
    if (wide()) {
      ok('and the critters are back in a grid of their own',
         D.defaultView.getComputedStyle(roster).gridTemplateColumns.split(/\s+/).filter(Boolean).length > 1);
    }
    await go('chips');
    eq('coming back remembers grid', roster.dataset.chipView, 'grid');
    await click(view.querySelector('[data-view="list"]'), 400);
    await go('tatari');
  }
});

/*
 * Dragging a chip into the dock, and dragging one around inside it.
 *
 * A tap already keeps a chip, and this could have stopped there. What a tap
 * cannot say is *where*: it appends, and the order of the three is the whole
 * reason the dock exists -- it is the order you take them in during a run. So
 * the checks below are mostly about position, not about membership.
 *
 * Driven with real pointer events rather than by calling the handler, because
 * the handler was never the part that broke. What breaks is the wiring: a grip
 * that is not the element the drag was bound to, a drop zone whose selector
 * misses, a payload the zone refuses. All of that is between pointerdown and
 * pointerup, and none of it is exercised by calling placeAt directly.
 */
await runGroup('chips are dragged into the dock, and around inside it', async () => {
  /*
   * Waited for, not assumed.
   *
   * D is re-pointed at the frame's live document before every group, and a
   * frame caught mid-navigation hands back a document that has loaded nothing
   * yet -- so `$('#roster')` was null about one run in six and the group threw
   * on its first line, blaming itself for something that happened before it
   * started.
   */
  await until(() => !!$('#roster'), 'the drafter to be in the frame', 8000);
  const V = D.defaultView;
  const roster = $('#roster');

  /*
   * Opened only if it is not already open. The bar button toggles, so a group
   * that ran before this one and left the roster up turned "open the roster"
   * into "close it" -- and this group then dragged between two elements that
   * were on the page and not on the screen. It passed alone and failed in the
   * suite, which is the shape of every state-leak bug in this file.
   */
  if (D.body.dataset.sheet !== 'roster') await click(barBtn('roster'), 400);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  if (roster.getBoundingClientRect().width < 200) {
    skip('chips can be dragged into the dock',
         'this window is not on screen, so nothing has a position to drag between');
    await click($('#roster-tabs [data-list="tatari"]'), 380);
    return;
  }

  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  const send = (type, x, y, to) => to.dispatchEvent(new V.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    pointerId: 1, pointerType: 'mouse', isPrimary: true,
    button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1,
    clientX: x, clientY: y,
  }));
  /*
   * Put the thing in the middle of the window, not merely on screen.
   *
   * scrollIntoView centres within the nearest scrollport, which for a dock
   * inside a page with a sticky header left it at y=128 -- on screen, and
   * underneath the header, so elementFromPoint answered <h1> and the drop went
   * nowhere. The window is nudged afterwards to finish the job.
   */
  const bring = (el) => {
    el.scrollIntoView({ block: 'center' });
    const r = el.getBoundingClientRect();
    const off = (r.top + r.height / 2) - V.innerHeight / 2;
    if (Math.abs(off) > 40) V.scrollBy(0, off);
  };

  /* Mouse, not touch: a touch drag waits out a hold timer and this suite has
     enough real waiting in it. The two paths meet at begin(). */
  const dragTo = async (handle, target) => {
    /* Both ends scrolled to before they are measured. A drag is hit-tested with
       elementFromPoint, which only knows about the viewport -- point it at a
       coordinate below the fold and it answers null, and the drop silently does
       nothing. That is a fact about the test, not about the app: a person
       dragging has both ends on their screen because they can see them. */
    bring(handle);
    await sleep(90);
    const a = centre(handle);
    send('pointerdown', a.x, a.y, handle);
    send('pointermove', a.x + 9, a.y + 9, V);   // past the 5px the mouse waits for
    await sleep(80);
    /*
     * Aim, then check the aim, then let go.
     *
     * A sleep is not a wait here. These suites run under a virtual clock when
     * they are driven headlessly, which collapses every setTimeout to almost no
     * real time -- so "scroll, sleep 90ms, measure" measured a scroll that had
     * not landed, the pointer came down beside the target, and the drop did
     * nothing. Roughly one run in two. It asks the page where the pointer
     * actually is instead, which is the same question the drag itself asks.
     */
    let b = centre(target);
    for (let tries = 0; tries < 5; tries += 1) {
      bring(target);
      b = centre(target);
      send('pointermove', b.x, b.y, V);
      await sleep(60);
      const ghost = D.querySelector('.drag-ghost');
      if (ghost) ghost.style.visibility = 'hidden';
      const under = D.elementFromPoint(b.x, b.y);
      if (ghost) ghost.style.visibility = '';
      if (under && (under === target || target.contains(under))) break;
    }
    send('pointerup', b.x, b.y, V);
    await sleep(340);
  };

  /*
   * Scoped to the tray, because the same chip is now drawn twice on purpose:
   * once in the tray you edit in, and once in the dock that ends up in the
   * screenshot. An unscoped `.chipbench__chip` counted both and every number
   * below doubled. The two agreeing is itself worth a check, and gets one.
   */
  const dock = () => $('#chipbench');
  const tray = () => $('#chiptray');
  const kept = () => $$('#chiptray .chipbench__chip').map((e) => e.dataset.chip);
  const inDock = () => $$('#chipbench .chipbench__chip').map((e) => e.dataset.chip);
  const numbered = () => $$('#chiptray .chipbench__chip')
    .filter((e) => e.querySelector('.chipbench__n')).map((e) => e.dataset.chip);
  const slots = () => $$('#chiptray .chipbench__slot');
  const cardFor = (name) => $(`.card--chip[data-chip="${CSS.escape(name)}"]`);
  const grip = (el) => el.querySelector('img') ?? el;

  /* Nothing kept, so the dock is showing what it is for rather than what is in
     it -- which is the state the first drag has to work from. */
  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  /* Both ends of the drag have to be on the screen, not merely in the page.
     This is the check that says which one was not. */
  const trayBox = tray().getBoundingClientRect();
  ok('the tray has a real size to drop into',
     trayBox.width > 40 && trayBox.height > 20,
     `${Math.round(trayBox.width)}x${Math.round(trayBox.height)}`);

  eq('nothing is kept to start', kept().length, 0);
  ok('the tray is there before anything is in it, because that is where the first one goes',
     !tray().hidden);
  eq('and it shows a numbered outline for each of the three', slots().length, 3);
  eq('the outlines are numbered rather than blank',
     slots().map((e) => e.textContent.trim()).join(''), '123');
  ok('and the shortlist says what it is for',
     !!$('#chiptray .chiptray__hint'), $('#chiptray .chiptray__hint')?.textContent);

  const names = $$('.card--chip').slice(0, 4).map((c) => c.dataset.chip);
  ok('there are four chips to work with', names.length === 4, names.join(', '));
  const [a, b, c, d] = names;

  await dragTo(grip(cardFor(a)), slots()[0]);
  eq('dragging one onto an empty slot keeps it', kept().join(), a);
  eq('and it is your first pick', numbered().join(), a);

  await dragTo(grip(cardFor(b)), slots()[0]);
  await dragTo(grip(cardFor(c)), slots()[0]);
  eq('three of them fill the three', numbered().join(), [a, b, c].join());
  eq('and the outlines are used up', slots().length, 0);

  /*
   * The check this whole group is for. Dropping onto a numbered chip takes that
   * number; everything from there down moves along rather than being swapped
   * with, because a plan is a sequence and swapping two of its steps is not the
   * edit anybody meant to make.
   */
  const third = $$('#chiptray .chipbench__chip')[2];
  const first = $$('#chiptray .chipbench__chip')[0];
  await dragTo(grip(third), first);
  eq('dropping the third onto the first makes it the first',
     numbered().join(), [c, a, b].join());
  eq('and the numbers on the faces say so',
     $$('#chiptray .chipbench__chip .chipbench__n').map((e) => e.textContent).join(''), '123');
  /* The dock is a second view of one truth, not a second truth. If it can
     disagree with the tray, one of them is lying in the screenshot. */
  eq('and the dock in the picture agrees with the tray', inDock().join(), kept().join());
  ok('the dock is not hidden while chips are kept', !dock().hidden);

  /* And back again, so this is a reorder and not a one-way trick. */
  await dragTo(grip($$('#chiptray .chipbench__chip')[0]), $$('#chiptray .chipbench__chip')[2]);
  eq('and it goes back the other way', numbered().join(), [a, b, c].join());

  /*
   * A fourth pick when three are taken. The one pushed out lands in the
   * shortlist rather than being dropped, because losing a choice you made to a
   * gesture you were still learning is the worst thing this could do.
   */
  await dragTo(grip(cardFor(d)), $$('#chiptray .chipbench__chip')[0]);
  eq('a fourth dropped onto the first takes first place', numbered()[0], d);
  eq('the three are still three', numbered().length, 3);
  ok('and the one it pushed out is shortlisted, not thrown away',
     kept().includes(c), kept().join(', '));

  /* The roster agrees with the dock: the badge on the card is the same number
     as the badge on the face, which is the only reason to have both. */
  const badge = cardFor(d)?.querySelector('.card__rank');
  eq('the roster card carries the new rank too', badge?.textContent, '1');

  /* Dropping a chip on itself is not an edit, and must not be treated as one. */
  const before = kept().join();
  await dragTo(grip($$('#chiptray .chipbench__chip')[1]), $$('#chiptray .chipbench__chip')[1]);
  eq('dropping one onto itself changes nothing', kept().join(), before);

  /*
   * The same edit without a pointer.
   *
   * A reorder you can only do by dragging is a reorder some people cannot do at
   * all, and the order of the three is the point of the dock. Arrows move a
   * chip one place along; Delete drops it.
   */
  const chipAt = (i) => $$('#chiptray .chipbench__chip')[i];
  const key = async (el, k) => {
    el.focus();
    el.dispatchEvent(new V.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    await sleep(300);
  };
  const order = kept().join();
  await key(chipAt(2), 'ArrowLeft');
  eq('the left arrow moves a chip one place along',
     kept().join(), (() => { const o = order.split(','); [o[1], o[2]] = [o[2], o[1]]; return o.join(); })());
  ok('and focus stays on the chip that moved, not on the slot it left',
     D.activeElement?.dataset?.chip === order.split(',')[2],
     `${D.activeElement?.dataset?.chip}`);
  await key(D.activeElement, 'ArrowRight');
  eq('the right arrow puts it back', kept().join(), order);

  const doomed = kept()[0];
  await key(chipAt(0), 'Delete');
  ok('Delete drops the chip', !kept().includes(doomed), kept().join(', '));

  /*
   * The three ways a chip can leave where it is.
   *
   * Into the shortlist, back out of it, and off the list of kept chips
   * entirely. The last one matters most: somebody who learned "drag it in"
   * will try "drag it out" before they try tapping it, and a gesture that does
   * nothing reads as a broken app rather than as one that was never offered.
   */
  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  for (const n of [a, b, c]) await dragTo(grip(cardFor(n)), slots()[0]);
  eq('three kept again, in order', numbered().join(), [a, b, c].join());

  /* The zone, not the row inside it: the whole bordered square is the target
     now, label included, which is what it looks like from the outside. */
  const shortlist = () => $('#chiptray .chiptray__zone[data-list="extra"]');
  const shortlisted = () => [...shortlist().querySelectorAll('.chipbench__chip')]
    .map((e) => e.dataset.chip);
  ok('the shortlist is a square you can drop into, not just its contents',
     !!shortlist() && shortlist().classList.contains('chiptray__zone'));

  await dragTo(grip(chipAt(0)), shortlist());
  eq('dragging one of the three onto the shortlist moves it there',
     shortlisted().join(), a);
  eq('and the other two close up behind it', numbered().join(), [b, c].join());
  eq('so a slot opens back up', slots().length, 1);
  ok('and it is not in both places at once', kept().filter((n) => n === a).length === 1,
     kept().join(', '));

  await dragTo(grip($(`#chiptray .chipbench__chip[data-chip="${CSS.escape(a)}"]`)), slots()[0]);
  eq('and dragging it back makes it one of the three again',
     numbered().join(), [b, c, a].join());
  eq('the shortlist is empty again', shortlisted().length, 0);

  /* Out of the trays entirely. */
  const evicted = numbered()[0];
  await dragTo(grip($(`#chiptray .chipbench__chip[data-chip="${CSS.escape(evicted)}"]`)), roster);
  ok('dragging a kept chip back onto the list unkeeps it',
     !kept().includes(evicted), kept().join(', '));
  eq('and the ones left move up', numbered().length, 2);
  ok('the card in the list stops claiming a rank',
     !cardFor(evicted)?.querySelector('.card__rank'));
  ok('and stops looking kept', !cardFor(evicted)?.classList.contains('is-benched'));

  /* Dragging a card around the list it already lives in is not a toggle. */
  const untouched = kept().join();
  const spare = $$('.card--chip').map((e) => e.dataset.chip).find((n) => !kept().includes(n));
  await dragTo(grip(cardFor(spare)), roster);
  eq('dragging an unkept chip onto the list does nothing at all', kept().join(), untouched);
  ok('and it is still not kept', !kept().includes(spare), spare);

  /*
   * What it looks like while you are still holding the chip.
   *
   * Two questions get two answers. Hovering a tray asks "in or out", so the
   * whole square lights up. Hovering one of the three asks "before which one",
   * so a bar appears in the gap and the chip steps aside to make it -- a ring
   * would have said "this one", which is not what is about to happen.
   *
   * Split in two on purpose. What it looks like is asked of the stylesheet,
   * which answers the same way every time. Whether the drag actually applies it
   * is asked of a real drag, and only when this browser is drawing frames at
   * all: the hover state is applied on an animation frame, and the headless
   * runner drives these pages under a virtual clock that advances timers
   * without necessarily producing frames. Asserting through a frame that may
   * never come is how you get a check that fails for the harness.
   */
  const styleWith = (el, cls, pseudo) => {
    el.classList.add(cls);
    const out = D.defaultView.getComputedStyle(el, pseudo ?? null);
    const copy = {
      boxShadow: out.boxShadow, transform: out.transform, content: out.content,
      width: out.width, borderColor: out.borderColor, background: out.backgroundColor,
    };
    el.classList.remove(cls);
    return copy;
  };

  const zoneLit = styleWith(shortlist(), 'is-over');
  ok('a hovered tray rings the whole square',
     zoneLit.boxShadow !== 'none' && !zoneLit.boxShadow.includes('inset'), zoneLit.boxShadow);
  ok('and tints it, so it reads as a target rather than an outline',
     zoneLit.background !== styleWith(shortlist(), 'nothing-at-all').background);

  const aim = chipAt(0);
  const barLit = styleWith(aim, 'is-over', '::before');
  ok('a hovered chip draws a bar in the gap in front of it',
     barLit.content === '""' && parseFloat(barLit.width) >= 2,
     `content ${barLit.content}, width ${barLit.width}`);
  const chipLit = styleWith(aim, 'is-over');
  ok('and the chip steps aside to leave that gap',
     chipLit.transform !== 'none', chipLit.transform);
  ok('rather than being ringed, which would have meant "this one"',
     chipLit.boxShadow === 'none', chipLit.boxShadow);
  ok('and the number it is wearing inverts, because that is the number you take',
     (() => {
       aim.classList.add('is-over');
       const n = aim.querySelector('.chipbench__n');
       const lit = n && D.defaultView.getComputedStyle(n).backgroundColor;
       aim.classList.remove('is-over');
       const dim = n && D.defaultView.getComputedStyle(n).backgroundColor;
       return !!n && lit !== dim;
     })());

  /*
   * Now the wiring: does a real drag apply what the stylesheet describes.
   *
   * The mark goes on inside a requestAnimationFrame callback, so this can only
   * be asked of a browser that is drawing. Rather than guess, the attempt
   * counts frames while it runs: no frames and it is skipped with that said out
   * loud, frames and no mark and it is a failure the app earned. A check that
   * cannot tell those two apart is worth nothing.
   */
  {
    let framesSeen = 0;
    let ticking = true;
    const tick = () => { framesSeen += 1; if (ticking) V.requestAnimationFrame(tick); };
    V.requestAnimationFrame(tick);
    const drew = () => framesSeen > 1;
    const hoverOver = async (handle, target) => {
      bring(handle);
      const from = centre(handle);
      send('pointerdown', from.x, from.y, handle);
      send('pointermove', from.x + 9, from.y + 9, V);
      await sleep(70);
      for (let tries = 0; tries < 8; tries += 1) {
        bring(target);
        const to = centre(target);
        send('pointermove', to.x, to.y, V);
        /* Waited on a frame, not a timer: the frame is the thing the mark is
           applied in, and a timer under a virtual clock returns before one. */
        await Promise.race([new Promise((r) => { V.requestAnimationFrame(r); }), sleep(200)]);
        if (target.classList.contains('is-over')) return true;
      }
      return false;
    };
    const endHover = async () => {
      V.dispatchEvent(new V.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await sleep(220);
    };

    /*
     * Every attempt carries its own verdict.
     *
     * The gate has to be per attempt, not per group: frames can arrive for the
     * first hover and stop before the second, and a gate consulted once turns
     * that into a failure the app did not cause. Not lit and no frames drawn is
     * a skip that says so; not lit while the browser was drawing is a real
     * failure, which is the whole point of keeping the two apart.
     */
    const attempt = async (what, target) => {
      const spare3 = $$('.card--chip').map((e) => e.dataset.chip).find((n) => !kept().includes(n));
      const before = framesSeen;
      const lit = await hoverOver(grip(cardFor(spare3)), target);
      if (!lit && framesSeen - before < 2) {
        skip(what, 'no frames were drawn during the attempt, and the mark is applied in one');
        await endHover();
        return false;
      }
      ok(what, lit);
      return lit;
    };

    if (await attempt('dragging over the shortlist marks it', shortlist())) {
      ok('and nothing else is marked at the same time',
         $$('#chiptray .is-over').length === 1,
         $$('#chiptray .is-over').map((e) => e.className).join(' / '));
      await endHover();
      ok('the mark goes when the drag is cancelled', !$('#chiptray .is-over'));
    }

    await attempt('dragging over one of the three marks that chip', chipAt(0));
    await endHover();
    ticking = false;
  }

  /*
   * Picked up by any part of it, and dropped in either tray.
   *
   * The drop targets were always fine; the grab was not. Only the 34px sprite
   * started a drag, so somebody who put a finger on the chip's name got
   * nothing -- and "nothing happens" reads as a broken feature, not as a
   * handle you were supposed to find. The name is the handle here on purpose:
   * if this passes, so does every other part of the card.
   */
  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  eq('nothing kept, so both trays are empty', kept().length, 0);

  const byName = (n) => cardFor(n)?.querySelector('.chiprow__head b') ?? cardFor(n);
  const three = () => $('#chiptray .chiptray__zone[data-list="main"]');
  const inThree = () => [...three().querySelectorAll('.chipbench__chip')].map((e) => e.dataset.chip);

  const [p1, p2] = $$('.card--chip').slice(0, 2).map((e) => e.dataset.chip);
  ok('the chips have a name to grab them by', !!byName(p1) && byName(p1).tagName === 'B');

  await dragTo(byName(p1), shortlist());
  eq('dragging a chip by its name lands it in the shortlist', shortlisted().join(), p1);
  eq('and it did not go into the three by mistake', inThree().length, 0);

  await dragTo(byName(p2), three());
  eq('and dragging another by its name lands it in the three', inThree().join(), p2);
  eq('with the shortlist left alone', shortlisted().join(), p1);

  /* The sprite still works, and with no hold, which is the point of keeping
     touch-action on it alone. */
  const p3 = $$('.card--chip').map((e) => e.dataset.chip).find((n) => !kept().includes(n));
  await dragTo(grip(cardFor(p3)), shortlist());
  ok('the sprite is still a handle too', shortlisted().includes(p3), shortlisted().join(', '));
  ok('and only the sprite refuses the browser its scroll',
     D.defaultView.getComputedStyle(cardFor(p3)).touchAction !== 'none'
     && D.defaultView.getComputedStyle(cardFor(p3).querySelector('.chiprow__art')).touchAction === 'none');

  /* Nothing but the name in the tray headings. */
  ok('the tray headings say their name and nothing else',
     $$('#chiptray .chiptray__label').map((e) => e.textContent.trim()).join('|') === 'Your three|Shortlist',
     $$('#chiptray .chiptray__label').map((e) => e.textContent.trim()).join('|'));
  ok('and carry no explanation hung off them',
     $$('#chiptray .chiptray__label span').length === 0);

  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 380);
});

/*
 * The drag as a finger does it.
 *
 * Everything above drives the chips with mouse events, and a mouse takes a
 * different road through dnd.js: it starts a drag after five pixels of travel
 * and that is all. A finger has to be told apart from a scroll first, so it
 * goes through a hold timer, a give-up-if-you-move rule, and whatever the
 * browser decides about `touch-action` -- none of which the checks above touch.
 * Three quarters of this tool's traffic is on a phone. This is the road they
 * are on, and it was the one road nothing was driving.
 *
 * It found a real one: the sprite declares `touch-action: none`, which means
 * the page will not scroll there, and the hold rules were still being applied
 * to it. Press it and swipe and the drag was cancelled for a scroll that could
 * not happen -- so nothing moved and nothing scrolled either.
 */
await runGroup('a finger can drag a chip, and can still scroll the list', async () => {
  await until(() => !!$('#roster'), 'the drafter to be in the frame', 8000);
  const V = D.defaultView;
  if (D.body.dataset.sheet !== 'roster') await click(barBtn('roster'), 400);
  await click($('#roster-tabs [data-list="chips"]'), 460);

  const tray = $('#chiptray');
  if (!tray || tray.getBoundingClientRect().width < 40) {
    skip('a finger can drag a chip', 'the tray has no size in this window');
    return;
  }

  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  const bring = (el) => {
    el.scrollIntoView({ block: 'center' });
    const r = el.getBoundingClientRect();
    const off = (r.top + r.height / 2) - V.innerHeight / 2;
    if (Math.abs(off) > 40) V.scrollBy(0, off);
  };
  /* pointerType 'touch', which is the whole point: it is what picks the branch
     in dnd.js that a real phone takes. */
  const finger = (type, x, y, to) => to.dispatchEvent(new V.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    pointerId: 7, pointerType: 'touch', isPrimary: true,
    button: type === 'pointermove' ? -1 : 0,
    buttons: type === 'pointerup' ? 0 : 1,
    clientX: x, clientY: y,
  }));

  const three = () => $('#chiptray .chiptray__zone[data-list="main"]');
  const inThree = () => [...three().querySelectorAll('.chipbench__chip')].map((e) => e.dataset.chip);
  const kept = () => $$('#chiptray .chipbench__chip').map((e) => e.dataset.chip);
  const cardFor = (n) => $(`.card--chip[data-chip="${CSS.escape(n)}"]`);
  const spare = () => $$('.card--chip').map((e) => e.dataset.chip).find((n) => !kept().includes(n));

  /* hold: wait past the press-and-hold before moving. Everything a finger does
     is timing, so the timing is the parameter. */
  const swipe = async (handle, target, { hold }) => {
    bring(handle);
    const a = centre(handle);
    finger('pointerdown', a.x, a.y, handle);
    if (hold) await sleep(420);
    for (let tries = 0; tries < 6; tries += 1) {
      bring(target);
      const b = centre(target);
      finger('pointermove', b.x, b.y, V);
      await sleep(90);
      const ghost = D.querySelector('.drag-ghost');
      if (ghost) ghost.style.visibility = 'hidden';
      const under = D.elementFromPoint(b.x, b.y);
      if (ghost) ghost.style.visibility = '';
      if (under && (under === target || target.contains(under))) {
        finger('pointerup', b.x, b.y, V);
        await sleep(360);
        return;
      }
    }
    finger('pointerup', 0, 0, V);
    await sleep(360);
  };

  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 460);
  eq('nothing kept to start', kept().length, 0);

  /*
   * The sprite: no hold at all.
   *
   * It is the one part of the card that has told the browser it will not
   * scroll, so it does not have to prove it is a drag and not a scroll first.
   * A swipe straight off the press has to work, and that is the check that was
   * failing on a real phone.
   */
  const one = spare();
  await swipe(cardFor(one).querySelector('.chiprow__art'), three(), { hold: false });
  ok('a swipe straight off the sprite drops it in the three',
     inThree().includes(one), `three: ${inThree().join(', ') || 'empty'}`);

  /* The rest of the card: press, hold, then move. It has to share the gesture
     with the list, so the hold is what says which one you meant. */
  const two = spare();
  await swipe(cardFor(two).querySelector('.chiprow__head b') ?? cardFor(two), three(), { hold: true });
  ok('and a press-and-hold anywhere else on the card does the same',
     inThree().includes(two), `three: ${inThree().join(', ')}`);

  /*
   * And the half that has to keep working: a flick is a scroll, not a drag.
   *
   * If this ever passes by starting a drag, the roster has stopped scrolling
   * under a thumb, which costs far more than dragging ever bought.
   */
  const three3 = spare();
  const before = kept().join();
  const card = cardFor(three3);
  bring(card);
  const from = centre(card);
  finger('pointerdown', from.x, from.y, card);
  finger('pointermove', from.x, from.y - 40, V);
  await sleep(120);
  const dragging = !!D.querySelector('.drag-ghost');
  finger('pointerup', from.x, from.y - 40, V);
  await sleep(300);
  ok('flicking the card without pausing does not start a drag', !dragging);
  eq('so the list is still something you can scroll', kept().join(), before);

  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 380);
});

await runGroup('touch rules are in the stylesheet', async () => {
  /*
   * Read, not rendered. (hover: none) never matches in a desktop browser at any
   * width, so these rules cannot be watched applying here -- but their absence
   * is still a regression worth catching, and it is exactly the failure the plan
   * grip shipped with: the CSS block existed and .prio was not in it.
   */
  const rules = [];
  for (const sheet of D.styleSheets) {
    let rs; try { rs = sheet.cssRules; } catch { continue; }
    for (const r of rs) {
      if (r.type === CSSRule.MEDIA_RULE && /hover/.test(r.conditionText)) {
        for (const inner of r.cssRules) {
          if (inner.selectorText) rules.push(inner);
        }
      }
    }
  }
  ok('there is a touch block at all', rules.length > 0, `${rules.length} rules`);

  /*
   * Matched on the whole selector, not on a prefix.
   *
   * The loose version of this check read startsWith('.chips--sub'), which the
   * descendant rule `.chips--sub .chips__group` also satisfies -- so deleting
   * nowrap from the row itself left the check green. A selector either is the
   * one being asked about or it is a different rule.
   */
  const declares = (sel, prop) => rules.some((r) =>
    r.selectorText.split(',').some((one) => one.trim() === sel)
    && r.style.getPropertyValue(prop.split(':')[0].trim()) === prop.split(':')[1].trim());

  ok('field pieces claim the gesture', declares('.cell.is-filled', 'touch-action: none'));
  ok('the plan grip claims the gesture', declares('.prio__rank', 'touch-action: none'));
  ok('the grip is a target worth aiming at',
     rules.some((r) => r.selectorText.includes('.prio__rank::after')));
  ok('the effect caret is sized for a thumb', declares('.fxcaret', 'width: 28px'));
  ok('the opened effect row scrolls instead of wrapping',
     declares('.chips--sub', 'flex-wrap: nowrap'));
  ok('and its chips do not wrap either', declares('.chips--sub .chips__group', 'flex-wrap: nowrap'));
  ok('the buttons that cost something keep 44px', declares('.btn--tiny', 'min-height: 44px'));
  ok('so do the ones beside them', declares('.btn', 'min-height: 44px'));
});

await runGroup('nothing is drawn over a critter', async () => {
  await click(barBtn('roster'), 340);
  const bad = $$('.panel--roster .card').slice(0, 80).filter((c) => {
    const img = c.querySelector('.card__art img');
    if (!img) return false;
    const art = img.getBoundingClientRect();
    return [...c.querySelectorAll('.card__fx, .card__patch')].some((b) => {
      const r = b.getBoundingClientRect();
      return r.bottom > art.top + 1 && r.top < art.bottom - 1;
    });
  });
  ok('no badge overlaps the artwork', bad.length === 0,
     bad.map((c) => c.querySelector('.card__name')?.textContent).join(', '));
  await click($('#btn-reset-filters'), 260);
});

await runGroup('the update page on a phone', async () => {
  app.style.display = 'none';
  const frame = frameFor('changes.html');
  const t0 = performance.now();
  await frame.ready;
  const C = frame.contentDocument;
  await until(() => C.querySelectorAll('.chline').length > 0, 'the update page');
  under('the update page paints', performance.now() - t0, 4000);

  ok('it does not overflow sideways',
     C.documentElement.scrollWidth <= 390 + 1, `${C.documentElement.scrollWidth}px`);
  /* One column on a phone: two 330px cards cannot share 390px, and a grid that
     tried would push every number off the side. */
  const grid = C.querySelector('.chgroup__grid');
  const kids = [...grid.children];
  const firstTop = Math.round(kids[0].getBoundingClientRect().top);
  eq('the cards stack into one column',
     kids.filter((k) => Math.round(k.getBoundingClientRect().top) === firstTop).length, 1);
  ok('every stat still reaches a verdict',
     [...C.querySelectorAll('.chstat')].every((s) => ['up', 'down'].includes(s.dataset.move)));
  frame.remove();
});

localStorage.clear();
for (const [k, v] of Object.entries(saved)) localStorage.setItem(k, v);

const skipNote = skipped ? `, ${skipped} skipped` : '';
document.getElementById('head').innerHTML = fail
  ? `<b style="color:#f0654f">${fail} failed</b>, ${pass} passed${skipNote}`
  : `<b style="color:#55c98a">${pass} passed</b>, 0 failed${skipNote}`;
document.title = `${fail ? `FAIL (${fail})` : 'ok'}: phone checks`;
window.__done = { pass, fail, skipped };
</script>
</body>
