<!doctype html>
<meta charset="utf-8">
<title>Horde Drafter: end-to-end checks</title>
<body style="font:13px/1.5 ui-monospace,monospace;background:#12141a;color:#e7eaf1;margin:0">
<!--
  Report on the left, the page under test on the right, both actually visible.
  Two arrangements failed before this one for the same underlying reason: an
  iframe parked at left:-3000px, and an iframe covered by an opaque report
  panel, are both throttled by the browser as not-visible, and the drafter's
  boot never finished inside the timeout. Occluded is the same as off-screen as
  far as rendering priority goes. Side by side, it is a normal frame.
-->
<div style="display:flex;height:100vh">
  <div style="flex:0 0 46%;overflow:auto;padding:16px;box-sizing:border-box">
    <h1 style="font:600 15px system-ui;margin:0 0 4px">End-to-end checks</h1>
    <p id="head" style="margin:0 0 12px;color:#a3aab9">starting…</p>
    <div id="log"></div>
  </div>
  <div id="stage" style="flex:1 1 auto;position:relative;border-left:1px solid #2e3340"></div>
</div>

<!--
  The real pages, driven the way a person drives them.

  Everything here clicks a control that exists on the shipped page and then reads
  what the page rendered. Nothing imports a module and asserts against its return
  value: this session produced four bugs that a unit test of that kind would have
  passed clean -- a CSS escape that shipped "BE" instead of a caret glyph, a
  radius that turned a rect back into a circle, a word-boundary written as a
  literal backspace byte, and a chip whose three children stacked down a column
  and spilled into the row below. All four were only visible in a rendered page.

  changestest.html stays as it is and checks the data file against the roster.
  This checks that the app built on top of it actually works.
-->


<script type="module">
const out = document.getElementById('log');
let pass = 0, fail = 0, suite = '';

const group = (name) => {
  suite = name;
  out.insertAdjacentHTML('beforeend',
    `<div style="margin:12px 0 2px;color:#ffc93c;font-weight:700">${name}</div>`);
};

/*
 * Each group is sealed off from the others.
 *
 * A thrown error used to end the whole run at that point, so one broken thing
 * hid every check after it -- proving that out cost a full pass, because a
 * deliberately broken counter took the update-page checks down with it and they
 * were never reported at all. A suite is most useful when something is broken,
 * which is exactly when it must keep going.
 */
/*
 * Run one group, or a few, instead of all of them.
 *
 * `?only=chips` runs every group whose name contains "chips". Two reasons it
 * earns its place. Iterating on one group meant sitting through the other
 * twenty every time; and a browser freezes a page that has been hidden for
 * about five minutes, while clamping every timer in it to a second before that
 * -- so a full run in a background window reaches roughly a hundred checks and
 * stops. Halves finish.
 */
const only = new URLSearchParams(location.search).get('only')?.toLowerCase() ?? '';

const runGroup = async (name, body) => {
  /* Boot is never skipped. It is where the frame is waited for and where D, W
     and the roster total come from, so filtering it out leaves every other
     group reading properties of undefined -- which is what "?only=flex" did on
     its first outing. */
  if (only && !name.toLowerCase().includes('boot') && !name.toLowerCase().includes(only)) return;

  /*
   * Re-point at the live document before every group.
   *
   * D is the app frame's document, captured once at boot. If anything inside
   * the app navigates that frame -- a link, a reload -- the old document is torn
   * down and every querySelector against it starts answering null, which
   * surfaces two groups later as "cannot read properties of null" and looks
   * like a bug in whatever group happened to be running. It is not; it is a
   * stale handle. One line, once, in the only place every group passes through.
   */
  if (app.contentDocument && app.contentDocument !== D) {
    D = app.contentDocument;
  }
  group(name);
  try { await body(); } catch (err) {
    fail++;
    out.insertAdjacentHTML('beforeend',
      `<div style="color:#f0654f">  FAIL ${name} threw: ${err.message}</div>`);
  }
};
/*
 * Some things cannot be checked in a tab nobody is looking at.
 *
 * A hidden document does not move focus: .focus() returns, activeElement stays
 * on body, and an assertion about focus fails for a reason that has nothing to
 * do with the app. Reported as skipped, with the reason, rather than counted as
 * a pass it did not earn or a failure it did not cause -- a suite that cries
 * wolf while the window is behind another app teaches you to ignore it.
 */
let skipped = 0;
const skip = (name, why) => {
  skipped += 1;
  out.insertAdjacentHTML('beforeend',
    `<div style="color:#8f99aa">  skip ${name}<div style="padding-left:7ch">${why}</div></div>`);
};

const ok = (name, cond, detail) => {
  if (cond) { pass++; out.insertAdjacentHTML('beforeend', `<div style="color:#55c98a">  ok   ${name}</div>`); }
  else {
    fail++;
    out.insertAdjacentHTML('beforeend',
      `<div style="color:#f0654f">  FAIL ${name}${detail ? `<div style="padding-left:7ch;color:#a3aab9">${detail}</div>` : ''}</div>`);
  }
};
const eq = (name, got, want) => ok(name, Object.is(got, want), `got ${JSON.stringify(got)}, wanted ${JSON.stringify(want)}`);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
/* Waits for the page to actually settle rather than for a guessed number of
   milliseconds, which is what made the earlier hand-run checks flaky. */
const until = async (test, what, ms = 25000) => {
  const stop = Date.now() + ms;
  while (Date.now() < stop) { if (test()) return true; await sleep(50); }
  throw new Error(`timed out waiting for ${what}`);
};

/*
 * The app persists to localStorage, and this page shares its origin. Snapshot
 * everything and put it back at the end, so running the checks never costs
 * somebody the formation they had open.
 */
const saved = { ...localStorage };

/*
 * Every file the app is made of, re-fetched past the cache before anything runs.
 *
 * Reload this page after editing a module and the frame can be handed the
 * version that was there before the edit -- a full run of green against code
 * that no longer exists, which is the worst thing a suite can do. A query
 * string on the frame's own URL does not help: index.html asks for
 * assets/js/app.js by that name whatever the page's address was, and that is
 * the request that comes back stale.
 *
 * So the graph is walked and every file in it fetched with cache: 'reload',
 * which revalidates the entry the frame is about to use.
 */
async function freshen(...entries) {
  const seen = new Set();
  const queue = [...entries];
  while (queue.length) {
    const url = new URL(queue.shift(), location.href).href;
    if (seen.has(url) || !url.startsWith(location.origin)) continue;
    seen.add(url);
    let text;
    try { text = await (await fetch(url, { cache: 'reload' })).text(); } catch { continue; }
    if (/\.html$/.test(url)) {
      for (const m of text.matchAll(/(?:src|href)="([^":]+\.(?:js|css))"/g)) queue.push(new URL(m[1], url).href);
    } else if (/\.js$/.test(url)) {
      for (const m of text.matchAll(/from\s+'([^']+\.js)'/g)) queue.push(new URL(m[1], url).href);
    }
  }
  return seen.size;
}
const freshened = await freshen('index.html', 'changes.html');

/* Built rather than written into the markup, so the second frame the checks
   need later can be made the same way and dropped into the same stage. */
const stage = document.getElementById('stage');
let runs = 0;
const frameFor = (src) => {
  const f = document.createElement('iframe');
  /*
   * The load event, captured before src is set, is the only honest signal that
   * the document inside is the one asked for.
   *
   * A fresh iframe's contentDocument is about:blank, and about:blank reports
   * readyState "complete" the instant you look at it. Waiting on readyState and
   * then holding onto that document meant every check ran against a blank page
   * that would never grow a roster, while the real one loaded fine beside it --
   * which is exactly how it looked: 230 cards on screen, and a timeout.
   */
  f.ready = new Promise((resolve) => f.addEventListener('load', resolve, { once: true }));
  f.src = `${src}?run=${performance.now().toFixed(0)}.${runs++}`;
  f.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
  stage.append(f);
  return f;
};
const app = frameFor('index.html');
let D;                                    // the drafter's document

const $ = (sel) => D.querySelector(sel);
const $$ = (sel) => [...D.querySelectorAll(sel)];
const cards = () => $$('.panel--roster .card').length;
const click = async (el, settle = 260) => { el.click(); await sleep(settle); };
const chipFor = (sel, value) => $(`${sel}[data-value="${value}"]`);
/* Shared across sealed groups, so they cannot be const inside one of them. Each
   is filled by the group that discovers it and read by the ones after. */
let total = 0;
let caret = () => null;
let marks = [];

const reset = async () => {
  await click($$('button').find((b) => /^reset$/i.test(b.textContent.trim())));
};

/**
 * Gets one Tatari onto the field, whichever way this run is being asked to.
 *
 * The stage is sized by the browser window, so on a narrow one it is under
 * 760px and the app inside it is in the phone layout -- where a bench chip arms
 * and waits for you to tap a square rather than auto-placing. Three separate
 * groups worked that out the hard way, each of them reading a polite "tap the
 * cell you want" as "it never reached the field".
 *
 * `into` picks the square when there is one that matters; otherwise the first
 * free field square will do. Zobo-ground squares are excluded on purpose: they
 * are closed unless Sandbox opened them, and the app correctly refuses them
 * with a toast that reads exactly like a failure.
 */
const placeOne = async (into = null) => {
  if (!$('.benchchip')) {
    const pick = $$('.panel--roster .card')
      .find((c) => !c.classList.contains('is-benched') && !c.dataset.switchFrom);
    if (!pick) return false;
    pick.click();
    try { await until(() => !!$('.benchchip'), 'the bench', 4000); } catch { return false; }
  }
  $('.benchchip').click();
  await sleep(300);
  if (!$('.cell.is-filled') || into) {
    const target = into ?? $$('.cell:not(.cell--enemy)').find((c) => !c.querySelector('.token'));
    target?.click();
    await sleep(360);
  }
  return !!$('.cell.is-filled');
};

// Each group runs sealed off from the others; see runGroup.
  // ---------------------------------------------------------------- boot
await runGroup('boot', async () => {
  ok('the app was re-fetched past the cache first', freshened > 20, `${freshened} files`);
  await app.ready;
  D = app.contentDocument;
  await until(() => D.querySelectorAll('.panel--roster .card').length > 0, 'the roster to render');

  total = cards();
  ok('the roster renders every Tatari', total > 200, `${total} cards`);
  eq('the count in the heading agrees', $('#roster-count').textContent.trim(), String(total));
  ok('the count is a live region for screen readers',
     $('#roster-count').getAttribute('aria-live') === 'polite');

  // ------------------------------------------------------- plain filters
});
await runGroup('type, role and tier filters', async () => {
  await click(chipFor('.chip--type', 'Water'));
  const water = cards();
  ok('an element chip narrows the roster', water > 0 && water < total, `${water} of ${total}`);
  ok('the heading says "n of total"', $('#roster-count').textContent.includes('of'));
  eq('the pressed chip says so', chipFor('.chip--type', 'Water').getAttribute('aria-pressed'), 'true');

  await click(chipFor('.chip--tier', '2'));
  const waterT2 = cards();
  ok('filters intersect rather than replace', waterT2 > 0 && waterT2 < water, `${waterT2} of ${water}`);

  await reset();
  eq('reset restores every card', cards(), total);
  ok('reset unpresses every chip', $$('.chip[aria-pressed="true"]').length === 0);

  // ------------------------------------------------------------- search
});
await runGroup('search', async () => {
  const box = $('input[placeholder*="Search"]');
  box.value = 'frost';
  box.dispatchEvent(new D.defaultView.Event('input', { bubbles: true }));
  await sleep(320);
  const found = cards();
  ok('search narrows the roster', found > 0 && found < total, `${found} for "frost"`);
  /*
   * Not "every name contains the word". The box searches name, animal, nickname
   * and skill text, so Stoodbeak is a correct hit on "frost" -- its skill is
   * called Frostbust. Asserting name-only matching failed the app for doing
   * exactly what its own placeholder promises.
   */
  const names = $$('.panel--roster .card__name').map((n) => n.textContent);
  ok('a name match is included', names.includes('Frostnip'), names.join(', '));
  ok('something unrelated is excluded', !names.includes('Zapup'), names.join(', '));
  await reset();
  eq('reset clears the search box', box.value, '');

  // ------------------------------------------------------ effect filters
});
await runGroup('effect groups, level ceilings and named effects', async () => {
  caret = (g) => $(`.fxcaret[data-group="${g}"]`);
  ok('each effect group has a caret', ['heal', 'buff', 'debuff'].every((g) => caret(g)));

  await click(caret('debuff'), 340);
  eq('the caret reports itself open', caret('debuff').getAttribute('aria-expanded'), 'true');
  const named = $$('.chip--fxtype');
  ok('opening a group reveals its named effects', named.length > 5, `${named.length} chips`);
  /*
   * Waited for, not sampled.
   *
   * This read activeElement once after a fixed sleep, which is a race dressed up
   * as an assertion: the focus call is synchronous inside the click handler, but
   * whether this line runs before or after everything else the browser has queued
   * is not something a 340ms sleep decides. It failed twice in a row, passed four
   * times after, and cost an afternoon of blaming an unrelated change. Waiting
   * still fails if focus never lands -- it just stops failing when it lands late.
   */
  let landed = false;
  for (let i = 0; i < 20 && !landed; i++) {
    landed = !!D.activeElement?.classList.contains('chip');
    if (!landed) await sleep(50);
  }
  if (!landed && document.hidden) {
    skip('focus follows the disclosure',
      'this tab is hidden, and a hidden document does not move focus');
  } else {
    ok('focus follows the disclosure', landed, D.activeElement?.className || '(nothing focused)');
  }

  const stun = $('.chip--fxtype[data-type="Stun"]');
  const stunSays = Number(stun.querySelector('b').textContent);
  await click(stun, 340);
  eq('pressing a named effect finds exactly what its count promised', cards(), stunSays);

  await click(stun, 340);
  eq('pressing it again releases it', cards(), total);

  // the ceiling
  const budget = (v) => $(`.chip--budget[data-budget="${v}"]`);
  /* Scoped: the patch chips are a radio group as well, so an unscoped count of
     [role=radio] is seven and this used to fail for the wrong reason. */
  ok('the ceiling is a radio group',
     !!$('.chip--budget')?.closest('[role="radiogroup"]')
     && $$('.chip--budget[role="radio"]').length === 4);
  eq('exactly one of them is tabbable', $$('.chip--budget').filter((c) => c.tabIndex >= 0).length, 1);

  await click(budget(0), 340);
  eq('choosing a ceiling checks it', budget(0).getAttribute('aria-checked'), 'true');
  const stunAtStart = Number($('.chip--fxtype[data-type="Stun"]').querySelector('b').textContent);
  ok('a ceiling changes what the counts say', stunAtStart < stunSays, `${stunAtStart} vs ${stunSays}`);
  await click($('.chip--fxtype[data-type="Stun"]'), 340);
  eq('and the roster agrees with the new count', cards(), stunAtStart);

  budget(0).dispatchEvent(new D.defaultView.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
  await sleep(340);
  eq('arrow keys move the ceiling', budget(3).getAttribute('aria-checked'), 'true');
  eq('and only one stays checked', $$('.chip--budget[aria-checked="true"]').length, 1);

  await reset();
  eq('reset clears the ceiling', $$('.chip--budget[aria-checked="true"]').length, 0);
  eq('reset clears the named effect', cards(), total);

  // ------------------------------------------------------- patch filters
});
await runGroup('what the update changed', async () => {
  const patchChips = $$('.chip--changed');
  ok('a chip per direction that has entries', patchChips.length > 0 && patchChips.length <= 3);
  ok('they are radios, not toggles',
     patchChips.every((c) => c.getAttribute('role') === 'radio'));
  eq('exactly one is tabbable', patchChips.filter((c) => c.tabIndex >= 0).length, 1);

  /*
   * Re-queried every time, never held. Choosing a direction redraws the whole
   * row -- that is how the roving tabindex moves -- so a node captured before
   * the first click is detached by the second, and clicking a detached node
   * does nothing at all. Held nodes made two directions silently report the
   * first one's numbers.
   */
  const directions = patchChips.map((c) => c.dataset.changed);
  const patchChip = (dir) => $(`.chip--changed[data-changed="${dir}"]`);

  for (const dir of directions) {
    const says = Number(patchChip(dir).querySelector('b').textContent);
    await click(patchChip(dir), 340);
    eq(`${dir}: the roster matches the count on the chip`, cards(), says);
    ok(`${dir}: every card shown carries that mark`,
       $$('.panel--roster .card').every((c) => c.querySelector('.card__patch')?.dataset.patch === dir));
    eq(`${dir}: choosing it unchooses the others`,
       $$('.chip--changed[aria-checked="true"]').length, 1);
  }
  await click(patchChip(directions.at(-1)), 340);
  eq('pressing the chosen one clears it', cards(), total);

  /*
   * The check that catches a broken facet, which the loop above cannot.
   *
   * With nothing else set, a count computed against the other filters and a
   * count computed against the whole roster are the same number, so removing the
   * faceting entirely still passes. It only shows up once something else is
   * narrowing: press an element first, and every chip has to have adjusted.
   * Verified by deliberately breaking countIf -- the loop above stayed green and
   * this went red.
   */
  await click(chipFor('.chip--type', 'Water'), 300);
  const withWater = cards();
  for (const dir of directions) {
    const says = Number(patchChip(dir).querySelector('b').textContent);
    ok(`${dir}: its count narrowed with the element filter`, says < Number(
      // the unfiltered figure, recovered by reading the mark on every card
      $$('.card__patch').filter((m) => m.dataset.patch === dir).length) || says <= withWater,
       `chip says ${says}, roster holds ${withWater}`);
    await click(patchChip(dir), 340);
    eq(`${dir}: the count still matches once an element is filtered too`, cards(), says);
    await click(patchChip(dir), 340);
  }

  // and the same invariant on a named effect
  if (caret('debuff').getAttribute('aria-expanded') !== 'true') await click(caret('debuff'), 340);
  const slow = $('.chip--fxtype[data-type="Slow"]');
  const slowSays = Number(slow.querySelector('b').textContent);
  await click(slow, 340);
  eq('a named effect also counts against the other filters', cards(), slowSays);
  await reset();
  eq('reset clears all of it', cards(), total);

  const seeAll = $('.chips__seeall');
  ok('there is a way through to the whole update', !!seeAll && seeAll.getAttribute('href') === 'changes.html');

  // -------------------------------------------------- markers on cards
});
await runGroup('markers on the cards', async () => {
  marks = $$('.card__patch');
  ok('the roster marks what the update touched', marks.length > 0, `${marks.length} marked`);
  ok('every mark names a direction we render',
     marks.every((m) => ['buff', 'nerf', 'adjusted'].includes(m.dataset.patch)));
  ok('every mark draws a glyph', marks.every((m) => (m.dataset.glyph ?? '').length === 1),
     marks.map((m) => m.dataset.glyph).filter((g) => (g ?? '').length !== 1).join(' '));
  ok('a mark carries the numbers in its tooltip',
     marks.every((m) => (m.title ?? '').includes('→')), marks[0]?.title);
  /* The bug this catches: a badge that mimics the type and role badges beside
     it. Those are circles; this must not be one. */
  ok('the mark is not another circle in a row of circles',
     !/50%/.test(D.defaultView.getComputedStyle(marks[0]).borderRadius),
     D.defaultView.getComputedStyle(marks[0]).borderRadius);
  ok('no badge is drawn over the artwork', $$('.panel--roster .card').slice(0, 60).every((c) => {
    const img = c.querySelector('.card__art img');
    if (!img) return true;
    const art = img.getBoundingClientRect();
    return [...c.querySelectorAll('.card__fx, .card__patch')].every((b) => {
      const r = b.getBoundingClientRect();
      return r.bottom <= art.top + 1 || r.top >= art.bottom - 1;
    });
  }));

  // ------------------------------------------------- glyphs actually draw
});
await runGroup('glyphs render, not tofu', async () => {
  /*
   * Finds its own elements rather than borrowing them.
   *
   * `caret` and `marks` are set by two groups further up, so under ?only=glyphs
   * this asked getComputedStyle for the style of undefined. A group that cannot
   * be run on its own is a group you cannot iterate on, which is the whole
   * point of the flag.
   */
  const drawn = (el, pseudo) => {
    const c = D.defaultView.getComputedStyle(el, pseudo).content;
    return c && c !== 'none' && c !== 'normal' && !/^"\?[0-9a-fA-F]{2,6}"$/.test(c);
  };
  const aCaret = caret('heal') ?? $('.fxcaret');
  const aMark = (marks && marks[0]) ?? $('.card__patch');

  ok('there is a caret to look at', !!aCaret);
  ok('there is a patch mark to look at', !!aMark);
  if (aCaret) {
    ok('the effect carets draw an arrow, not an escape', drawn(aCaret, '::after'),
       D.defaultView.getComputedStyle(aCaret, '::after').content);
  }
  if (aMark) {
    ok('the patch marks draw their glyph', drawn(aMark, '::after'),
       D.defaultView.getComputedStyle(aMark, '::after').content);
  }

  // ------------------------------------------------------ the whole update
});
await runGroup('the what-changed page', async () => {
  app.style.display = 'none';            // free the stage for the second page
  const frame = frameFor('changes.html');
  await frame.ready;
  const C = frame.contentDocument;
  await until(() => C.querySelectorAll('.chline').length > 0, 'the update page');

  ok('the date is in the header', (C.querySelector('#changes-patch')?.textContent ?? '').length > 0);
  ok('it opens with what changed about the mode', !!C.querySelector('#changes-mode .chmode__list li'));
  ok('there is a card per evolution line', C.querySelectorAll('.chline').length > 10);
  ok('every card names its element',
     [...C.querySelectorAll('.chline')].every((c) => c.dataset.type));
  ok('every skill says which level teaches it',
     [...C.querySelectorAll('.chline__skill')].every((s) => s.querySelector('.chline__lv')));
  const stats = [...C.querySelectorAll('.chstat')];
  ok('each stat is on its own row', stats.length > C.querySelectorAll('.chline__change').length);
  ok('every stat row reaches a verdict',
     stats.every((s) => ['up', 'down'].includes(s.dataset.move)),
     stats.filter((s) => !s.dataset.move).map((s) => s.textContent.trim()).join(' | '));
  /*
   * The check that would have caught the backspace-byte regex: a buffed line
   * whose rows read red, or a nerfed line whose rows read green, means the
   * favourability rule has broken and the page is confidently lying.
   */
  const wrong = [...C.querySelectorAll('.chgroup[data-patch="buff"] .chstat[data-move="down"]')]
    .concat([...C.querySelectorAll('.chgroup[data-patch="nerf"] .chstat[data-move="up"]')]);
  ok('no arrow disagrees with the group it sits in', wrong.length === 0,
     wrong.map((s) => s.textContent.trim()).join(' | '));
  ok('the adjusted group really does move both ways',
     !C.querySelector('.chgroup[data-patch="adjusted"]')
     || (C.querySelector('.chgroup[data-patch="adjusted"] .chstat[data-move="up"]')
       && C.querySelector('.chgroup[data-patch="adjusted"] .chstat[data-move="down"]')));
  frame.remove();
});

await runGroup('a card you already have one of', async () => {
  /*
   * Bring one Tatari and the rest of its line becomes swap targets. The marker
   * that says so used to be a full-width bar pinned to the bottom of the card,
   * which is where the name is: it covered the name, and its own text ("Switch
   * from Frostique") was far too long for a 79px card, so it truncated to
   * "SWITCH FROM...". Three cards of the same line all read those nine
   * characters and nothing else.
   *
   * So this checks the two facts that were lost, not the styling that lost
   * them: the card still says which Tatari it is, and nothing is drawn over it.
   */
  /* The bench first, not just the filters. Earlier groups leave Tatari on it,
     and clicking a card that is already benched takes it off again -- which is
     how this check first reported "nothing clashed" against a working app. */
  /*
   * The stage back, before anything is measured.
   *
   * The changes-page group hides the app frame to make room for the second
   * page, and every rect inside a display:none frame is 0x0 at 0,0. This group
   * is geometry, so on a hidden frame "the marker does not sit on top of the
   * name" becomes 0 >= -0.5, which is true, and the whole group passes against
   * a card it never saw. It did: the original bug was put back and all seven
   * checks stayed green.
   */
  app.style.display = '';
  await sleep(160);

  await reset();
  const clearFirst = $('[data-clear-bench]');
  if (clearFirst) { clearFirst.click(); await sleep(300); }

await runGroup('flex slots', async () => {
  /*
   * A square left open on purpose.
   *
   * Formations travel as a screenshot of the grid -- 286 opens against 4 card
   * downloads and 0 link copies -- and in a picture "I could not fill this" and
   * "bring what you like here" are the same empty square. The second is the
   * more useful post and had no way to say so.
   */
  await reset();
  /* From a clean board. Earlier groups leave Tatari there, and this browser may
     carry marks from a previous visit -- the counts below are all absolute. */
  $('#btn-clear-field').click();
  await sleep(360);

  const flexBox = $('#opt-flex');
  ok('there is a way to mark them', !!flexBox);
  const cell = (n) => $(`.cell[data-cell="${n}"]`);
  const marked = () => $$('.cell.is-flex').length;

  eq('nothing is marked to start', marked(), 0);
  await click(cell(7), 260);
  eq('and pressing a square does nothing until you turn it on', marked(), 0);

  flexBox.click();
  await sleep(320);
  ok('turning it on says so on the board', D.body.classList.contains('is-flexing'));

  await click(cell(7), 280);
  await click(cell(9), 280);
  eq('now a press marks the square', marked(), 2);
  eq('and the square says what it is', $('.cell.is-flex .cell__flex').textContent.trim(), 'FLEX');
  ok('in words a screen reader gets too',
     /on purpose/.test(cell(7).getAttribute('aria-label')), cell(7).getAttribute('aria-label'));

  await click(cell(7), 280);
  eq('pressing it again takes the mark off', marked(), 1);

  flexBox.click();
  await sleep(320);
  ok('the mode ends', !D.body.classList.contains('is-flexing'));
  eq('but the mark stays, because it is part of the formation', marked(), 1);

  /*
   * It has to survive the trip. The mark is only worth having if it is still
   * there in the file you send someone and the tab you come back to.
   */
  const saved = JSON.parse(localStorage.getItem('coc.formation.v4') ?? '{}');
  ok('and it is saved with everything else', Array.isArray(saved.flex) && saved.flex.includes(9),
     JSON.stringify(saved.flex));

  /*
   * A mark cannot outlive something arriving on the square. Checked through
   * placement rather than by calling the store, because place() is not the only
   * route onto a cell and the guard deliberately sits where they all meet.
   */
  flexBox.click(); await sleep(300);
  const free = $$('.cell:not(.is-filled)')
    .map((c) => Number(c.dataset.cell)).filter((n) => n < 36).sort((a, b) => b - a)[0];
  await click(cell(free), 280);
  ok('marked the square the next Tatari will land on', cell(free).classList.contains('is-flex'));
  flexBox.click(); await sleep(300);

  await placeOne(cell(free));
  ok('placing there fills the square', cell(free).classList.contains('is-filled'),
     `last toast: ${$('.toast')?.textContent?.trim() ?? '(none)'}`);
  ok('and the mark is gone rather than hiding under it',
     !cell(free).classList.contains('is-flex'));
  const after = JSON.parse(localStorage.getItem('coc.formation.v4') ?? '{}');
  ok('gone from the formation too, not just from the screen',
     !(after.flex ?? []).includes(free), JSON.stringify(after.flex));

  /* Clearing the field clears them: they describe a board that no longer exists. */
  /*
   * Clear field used to return early on a board with no Tatari on it, so marks
   * on an otherwise empty board could not be cleared at all -- and a board
   * showing three FLEX squares is not a clear board.
   */
  /*
   * The card is the whole point, so the card is what gets checked.
   *
   * Not by reading the code that draws it -- by rendering the real PNG twice,
   * once with marks and once without, and counting pixels of the accent colour.
   * The share card is a canvas: there is no DOM to assert against, and a check
   * that only proved drawCell was *called* would have passed just as happily
   * while drawing nothing.
   */
  /*
   * The previous card is still in the dialog when it reopens.
   *
   * Waiting for "an image that has loaded" is satisfied instantly by the one
   * already sitting there, so two renders in a row returned the same picture
   * and the comparison read 4223 against 4223 -- the feature looking broken
   * because the check never saw the second render. Each draw gets a fresh blob
   * URL, so the src changing is the signal that this is a new one.
   */
  let lastSrc = '';
  const accentPixels = async () => {
    $('#btn-share').click();
    try {
      await until(() => {
        const el = $('dialog[open] img');
        return el && el.src !== lastSrc && el.complete && el.naturalWidth > 0;
      }, 'a freshly drawn share card', 14000);
    } catch { return null; }
    const img = $('dialog[open] img');
    if (!img) return null;
    lastSrc = img.src;
    const V = D.defaultView;
    let bmp;
    /* Same guard as the chips group further down: headless Chrome will hand out
       a blob: URL it then refuses to fetch. Null here already means "no card to
       measure", which is what the caller reports. */
    try { bmp = await V.createImageBitmap(await (await V.fetch(img.src)).blob()); }
    catch { $('dialog[open]')?.close(); await sleep(200); return null; }
    const cv = new V.OffscreenCanvas(bmp.width, bmp.height);
    const cx = cv.getContext('2d');
    cx.drawImage(bmp, 0, 0);
    const d = cx.getImageData(0, 0, bmp.width, bmp.height).data;
    let n = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (Math.abs(d[i] - 255) < 26 && Math.abs(d[i + 1] - 201) < 26 && Math.abs(d[i + 2] - 60) < 40) n += 1;
    }
    $('dialog[open]')?.close();
    await sleep(200);
    return n;
  };

  const litUp = await accentPixels();
  ok('the share card renders at all', litUp !== null);
  if (litUp !== null) {
    $('#btn-clear-field').click();
    await sleep(380);
    const plain = await accentPixels();
    ok('and a marked square puts more of the accent colour in the picture',
       plain !== null && litUp > plain, `${litUp} with marks, ${plain} without`);
  }

  $('#btn-clear-field').click();
  await sleep(380);
  eq('clearing the field takes the marks with it', marked(), 0);

  $('#opt-flex').click(); await sleep(300);
  await click(cell(2), 260);
  $('#opt-flex').click(); await sleep(300);
  eq('a mark on an otherwise empty board', marked(), 1);
  $('#btn-clear-field').click();
  await sleep(380);
  eq('and Clear field clears it', marked(), 0);
});

await runGroup('the chips tab in the roster', async () => {

await runGroup('the chips travel with the picture', async () => {
  /*
   * Formations travel as a picture, so what you would take travels with it or
   * it does not travel at all. Only on the full card: the grid-only card is the
   * tight crop people post, and a chip list is not part of the board -- it goes
   * with the bench, which is also only on the full one.
   *
   * Checked by rendering the real PNG and measuring it, because a section the
   * canvas was not sized for is not pushed into whitespace, it is cut off. That
   * is the one failure a share card cannot have, and card.js says so about the
   * board already.
   */
  app.style.display = '';
  await sleep(200);
  await reset();

  const V = D.defaultView;
  /* Same trap as the flex group's: the dialog reopens showing the last card it
     drew, so "an image that has loaded" is true before this render begins. */
  let lastCard = '';
  const fullCard = async () => {
    $('#btn-share').click();
    await sleep(500);
    $$('dialog[open] button, dialog[open] label')
      .find((e) => /everything/i.test(e.textContent))?.click();
    try {
      await until(() => {
        const el = $('dialog[open] img');
        return el && el.src !== lastCard && el.complete && el.naturalWidth > 0;
      }, 'a freshly drawn full card', 16000);
    } catch { return null; }
    lastCard = $('dialog[open] img').src;
    let bmp;
    try {
      bmp = await V.createImageBitmap(await (await V.fetch($('dialog[open] img').src)).blob());
    } catch {
      /* Headless Chrome under a virtual clock hands out a blob: URL and then
         declines to fetch it. The card did draw -- the wait above only returns
         once the img has a natural width -- so this is the browser refusing to
         read it back, not the app failing to make it. Reported as a skip and
         measured properly the next time the group runs in a real window,
         because a check that goes red for the harness gets ignored. */
      $('dialog[open]')?.close();
      await sleep(240);
      return 'unreadable';
    }
    const cv = new V.OffscreenCanvas(bmp.width, bmp.height);
    const cx = cv.getContext('2d');
    cx.drawImage(bmp, 0, 0);
    const low = cx.getImageData(0, Math.floor(bmp.height * 0.6), bmp.width,
      Math.floor(bmp.height * 0.4)).data;
    let accent = 0;
    for (let i = 0; i < low.length; i += 4) {
      if (Math.abs(low[i] - 255) < 26 && Math.abs(low[i + 1] - 201) < 26
        && Math.abs(low[i + 2] - 60) < 40) accent += 1;
    }
    /* The last rows must be flat background. If the card is a section short,
       this is where the evidence is. */
    const tail = cx.getImageData(0, bmp.height - 8, bmp.width, 8).data;
    let offBg = 0;
    for (let i = 0; i < tail.length; i += 4) {
      if (Math.abs(tail[i] - tail[0]) > 10 || Math.abs(tail[i + 1] - tail[1]) > 10
        || Math.abs(tail[i + 2] - tail[2]) > 10) offBg += 1;
    }
    $('dialog[open]')?.close();
    await sleep(240);
    return { h: bmp.height, accent, offBg };
  };

  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="chips"]'), 420);
  const bare = await fullCard();
  const readable = bare !== 'unreadable';
  if (!readable) skip('the chips are in the picture', 'this browser will not read its own blob: URL back');
  else ok('the full card renders with no chips kept', bare !== null);

  const names = $$('.card--chip').slice(0, 3).map((c) => c.dataset.chip);
  for (const n of names) {
    $(`.card--chip[data-chip="${CSS.escape(n)}"]`)?.click();
    await sleep(260);
  }
  const withChips = await fullCard();
  if (readable) ok('and with three kept', withChips !== null);

  if (readable && bare && withChips && withChips !== 'unreadable') {
    ok('keeping chips puts them in the picture', withChips.accent > bare.accent,
       `${withChips.accent} accent pixels against ${bare.accent}`);
    ok('and the card grows to make room rather than cropping them',
       withChips.h > bare.h, `${withChips.h}px against ${bare.h}px`);
    eq('nothing is cut off the bottom', withChips.offBg, 0);
  }

  await click($('#roster-tabs [data-list="tatari"]'), 380);
});

/*
 * The bug this group exists for, reported from a phone with a screenshot.
 *
 * data-chip-view is written onto #roster when the chips list renders, and it
 * describes only the chips list: in "list" it forces one full-width column.
 * Going back to Tatari left it there, so 230 critters rendered one enormous
 * card per row. Nothing threw. No count was wrong. The only symptom was the
 * layout, which is exactly the kind of break every check written so far walks
 * straight past.
 *
 * So the check is not "the chips tab tidies up after itself". It is the general
 * shape: measure a list, leave by every route there is, come back, and find it
 * exactly as it was -- attributes, columns, card count and the header number.
 * That catches the next thing somebody leaves behind as well as this one.
 */
await runGroup('switching lists leaves nothing behind', async () => {
  await reset();

  const roster = $('#roster');
  const tab = (name) => $(`#roster-tabs [data-list="${name}"]`);
  const LISTS = ['tatari', 'zobos', 'chips'];
  ok('all three lists have a tab', LISTS.every((l) => !!tab(l)));

  const shapeOf = () => {
    const cs = D.defaultView.getComputedStyle(roster);
    return {
      attrs: [...roster.attributes].map((a) => `${a.name}=${a.value}`).sort().join(' | '),
      columns: cs.gridTemplateColumns.split(/\s+/).filter(Boolean).length,
      cards: roster.children.length,
      count: $('#roster-count').textContent.trim(),
    };
  };
  const go = async (name) => { await click(tab(name), 420); return shapeOf(); };

  const first = {};
  for (const l of LISTS) first[l] = await go(l);

  /*
   * The failing symptom, said as a number: one column is the chips' list view
   * wearing the Tatari roster's clothes.
   *
   * Only asked when the roster has a real width. auto-fill fits one 76px track
   * into anything narrower than about 160px, and a window sitting behind
   * another app reports its frame as four pixels wide -- so unguarded this
   * fails for a reason the app had no part in. The round trips above are the
   * check that does not care how wide anything is.
   */
  const wide = () => roster.getBoundingClientRect().width >= 200;
  if (!wide()) {
    skip('the roster is a grid of several columns',
         `the roster measures ${Math.round(roster.getBoundingClientRect().width)}px, so this window is not on screen`);
  } else {
    ok('the Tatari list is a grid of several columns', first.tatari.columns > 1,
       `${first.tatari.columns} column(s)`);
    ok('and so is the Zobo list', first.zobos.columns > 1, `${first.zobos.columns} column(s)`);
  }

  const KEYS = ['attrs', 'columns', 'cards', 'count'];
  for (const home of LISTS) {
    for (const via of LISTS) {
      if (via === home) continue;
      await go(home);
      await go(via);
      const back = await go(home);
      const drift = KEYS.filter((k) => back[k] !== first[home][k]);
      ok(`${home} comes back unchanged from ${via}`, drift.length === 0,
         drift.map((k) => `${k}: ${JSON.stringify(back[k])} not ${JSON.stringify(first[home][k])}`).join('; '));
    }
  }

  /*
   * The other half of the same fix. Clearing the attribute on the way out must
   * not throw away the reader's choice on the way back in -- a view switch that
   * forgets is a worse bug than the one being fixed, and the obvious fix for
   * the leak (never write the attribute) would cause it.
   */
  const view = $('#chip-view');
  ok('the chips have a view switch', !!view);
  if (view) {
    await go('chips');
    await click(view.querySelector('[data-view="grid"]'), 400);
    eq('grid can be chosen', roster.dataset.chipView, 'grid');
    await go('tatari');
    ok('leaving the chips takes their layout with them', !roster.dataset.chipView,
       roster.dataset.chipView);
    if (wide()) {
      ok('and the critters are back in a grid of their own',
         D.defaultView.getComputedStyle(roster).gridTemplateColumns.split(/\s+/).filter(Boolean).length > 1);
    }
    await go('chips');
    eq('coming back remembers grid', roster.dataset.chipView, 'grid');
    await click(view.querySelector('[data-view="list"]'), 400);
    await go('tatari');
  }
});

/*
 * Dragging a chip into the dock, and dragging one around inside it.
 *
 * A tap already keeps a chip, and this could have stopped there. What a tap
 * cannot say is *where*: it appends, and the order of the three is the whole
 * reason the dock exists -- it is the order you take them in during a run. So
 * the checks below are mostly about position, not about membership.
 *
 * Driven with real pointer events rather than by calling the handler, because
 * the handler was never the part that broke. What breaks is the wiring: a grip
 * that is not the element the drag was bound to, a drop zone whose selector
 * misses, a payload the zone refuses. All of that is between pointerdown and
 * pointerup, and none of it is exercised by calling placeAt directly.
 */
await runGroup('chips are dragged into the dock, and around inside it', async () => {
  /*
   * Waited for, not assumed.
   *
   * D is re-pointed at the frame's live document before every group, and a
   * frame caught mid-navigation hands back a document that has loaded nothing
   * yet -- so `$('#roster')` was null about one run in six and the group threw
   * on its first line, blaming itself for something that happened before it
   * started.
   */
  await until(() => !!$('#roster'), 'the drafter to be in the frame', 8000);
  const V = D.defaultView;
  const roster = $('#roster');

  /* Every measurement below is a rectangle, and a window that is not on screen
     reports every rectangle as empty. Nothing here can be asked in that state. */
  await click($('#roster-tabs [data-list="chips"]'), 440);
  if (roster.getBoundingClientRect().width < 200) {
    skip('chips can be dragged into the dock',
         'this window is not on screen, so nothing has a position to drag between');
    await click($('#roster-tabs [data-list="tatari"]'), 380);
    return;
  }

  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  const send = (type, x, y, to) => to.dispatchEvent(new V.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    pointerId: 1, pointerType: 'mouse', isPrimary: true,
    button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1,
    clientX: x, clientY: y,
  }));
  /* Mouse, not touch: a touch drag waits out a hold timer and this suite has
     enough real waiting in it. The two paths meet at begin(). */
  const dragTo = async (handle, target) => {
    /* Both ends scrolled to before they are measured. A drag is hit-tested with
       elementFromPoint, which only knows about the viewport -- point it at a
       coordinate below the fold and it answers null, and the drop silently does
       nothing. That is a fact about the test, not about the app: a person
       dragging has both ends on their screen because they can see them. */
    /*
     * Put the thing in the middle of the window, not merely on screen.
     *
     * scrollIntoView centres within the nearest scrollport, which for a dock
     * inside a page with a sticky header left it at y=128 -- on screen, and
     * underneath the header, so elementFromPoint answered <h1> and the drop
     * went nowhere. The window is nudged afterwards to finish the job.
     */
    const bring = (el) => {
      el.scrollIntoView({ block: 'center' });
      const r = el.getBoundingClientRect();
      const off = (r.top + r.height / 2) - V.innerHeight / 2;
      if (Math.abs(off) > 40) V.scrollBy(0, off);
    };
    bring(handle);
    await sleep(90);
    const a = centre(handle);
    send('pointerdown', a.x, a.y, handle);
    send('pointermove', a.x + 9, a.y + 9, V);   // past the 5px the mouse waits for
    await sleep(80);
    /*
     * Aim, then check the aim, then let go.
     *
     * A sleep is not a wait here. These suites run under a virtual clock when
     * they are driven headlessly, which collapses every setTimeout to almost no
     * real time -- so "scroll, sleep 90ms, measure" measured a scroll that had
     * not landed, the pointer came down beside the target, and the drop did
     * nothing. Roughly one run in two. It asks the page where the pointer
     * actually is instead, which is the same question the drag itself asks.
     */
    let b = centre(target);
    for (let tries = 0; tries < 5; tries += 1) {
      bring(target);
      b = centre(target);
      send('pointermove', b.x, b.y, V);
      await sleep(60);
      const ghost = D.querySelector('.drag-ghost');
      if (ghost) ghost.style.visibility = 'hidden';
      const under = D.elementFromPoint(b.x, b.y);
      if (ghost) ghost.style.visibility = '';
      if (under && (under === target || target.contains(under))) break;
    }
    send('pointerup', b.x, b.y, V);
    await sleep(340);
  };

  /*
   * Scoped to the tray, because the same chip is now drawn twice on purpose:
   * once in the tray you edit in, and once in the dock that ends up in the
   * screenshot. An unscoped `.chipbench__chip` counted both and every number
   * below doubled. The two agreeing is itself worth a check, and gets one.
   */
  const dock = () => $('#chipbench');
  const tray = () => $('#chiptray');
  const kept = () => $$('#chiptray .chipbench__chip').map((e) => e.dataset.chip);
  const inDock = () => $$('#chipbench .chipbench__chip').map((e) => e.dataset.chip);
  const numbered = () => $$('#chiptray .chipbench__chip')
    .filter((e) => e.querySelector('.chipbench__n')).map((e) => e.dataset.chip);
  const slots = () => $$('#chiptray .chipbench__slot');
  const cardFor = (name) => $(`.card--chip[data-chip="${CSS.escape(name)}"]`);
  const grip = (el) => el.querySelector('img') ?? el;

  /* Nothing kept, so the dock is showing what it is for rather than what is in
     it -- which is the state the first drag has to work from. */
  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  /* Both ends of the drag have to be on the screen, not merely in the page.
     This is the check that says which one was not. */
  const trayBox = tray().getBoundingClientRect();
  ok('the tray has a real size to drop into',
     trayBox.width > 40 && trayBox.height > 20,
     `${Math.round(trayBox.width)}x${Math.round(trayBox.height)}`);

  eq('nothing is kept to start', kept().length, 0);
  ok('the tray is there before anything is in it, because that is where the first one goes',
     !tray().hidden);
  eq('and it shows a numbered outline for each of the three', slots().length, 3);
  eq('the outlines are numbered rather than blank',
     slots().map((e) => e.textContent.trim()).join(''), '123');
  ok('and the shortlist says what it is for',
     !!$('#chiptray .chiptray__hint'), $('#chiptray .chiptray__hint')?.textContent);

  const names = $$('.card--chip').slice(0, 4).map((c) => c.dataset.chip);
  ok('there are four chips to work with', names.length === 4, names.join(', '));
  const [a, b, c, d] = names;

  await dragTo(grip(cardFor(a)), slots()[0]);
  eq('dragging one onto an empty slot keeps it', kept().join(), a);
  eq('and it is your first pick', numbered().join(), a);

  await dragTo(grip(cardFor(b)), slots()[0]);
  await dragTo(grip(cardFor(c)), slots()[0]);
  eq('three of them fill the three', numbered().join(), [a, b, c].join());
  eq('and the outlines are used up', slots().length, 0);

  /*
   * The check this whole group is for. Dropping onto a numbered chip takes that
   * number; everything from there down moves along rather than being swapped
   * with, because a plan is a sequence and swapping two of its steps is not the
   * edit anybody meant to make.
   */
  const third = $$('#chiptray .chipbench__chip')[2];
  const first = $$('#chiptray .chipbench__chip')[0];
  await dragTo(grip(third), first);
  eq('dropping the third onto the first makes it the first',
     numbered().join(), [c, a, b].join());
  eq('and the numbers on the faces say so',
     $$('#chiptray .chipbench__chip .chipbench__n').map((e) => e.textContent).join(''), '123');
  /* The dock is a second view of one truth, not a second truth. If it can
     disagree with the tray, one of them is lying in the screenshot. */
  eq('and the dock in the picture agrees with the tray', inDock().join(), kept().join());
  ok('the dock is not hidden while chips are kept', !dock().hidden);

  /* And back again, so this is a reorder and not a one-way trick. */
  await dragTo(grip($$('#chiptray .chipbench__chip')[0]), $$('#chiptray .chipbench__chip')[2]);
  eq('and it goes back the other way', numbered().join(), [a, b, c].join());

  /*
   * A fourth pick when three are taken. The one pushed out lands in the
   * shortlist rather than being dropped, because losing a choice you made to a
   * gesture you were still learning is the worst thing this could do.
   */
  await dragTo(grip(cardFor(d)), $$('#chiptray .chipbench__chip')[0]);
  eq('a fourth dropped onto the first takes first place', numbered()[0], d);
  eq('the three are still three', numbered().length, 3);
  ok('and the one it pushed out is shortlisted, not thrown away',
     kept().includes(c), kept().join(', '));

  /* The roster agrees with the dock: the badge on the card is the same number
     as the badge on the face, which is the only reason to have both. */
  const badge = cardFor(d)?.querySelector('.card__rank');
  eq('the roster card carries the new rank too', badge?.textContent, '1');

  /* Dropping a chip on itself is not an edit, and must not be treated as one. */
  const before = kept().join();
  await dragTo(grip($$('#chiptray .chipbench__chip')[1]), $$('#chiptray .chipbench__chip')[1]);
  eq('dropping one onto itself changes nothing', kept().join(), before);

  /*
   * The same edit without a pointer.
   *
   * A reorder you can only do by dragging is a reorder some people cannot do at
   * all, and the order of the three is the point of the dock. Arrows move a
   * chip one place along; Delete drops it.
   */
  const chipAt = (i) => $$('#chiptray .chipbench__chip')[i];
  const key = async (el, k) => {
    el.focus();
    el.dispatchEvent(new V.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    await sleep(300);
  };
  const order = kept().join();
  await key(chipAt(2), 'ArrowLeft');
  eq('the left arrow moves a chip one place along',
     kept().join(), (() => { const o = order.split(','); [o[1], o[2]] = [o[2], o[1]]; return o.join(); })());
  ok('and focus stays on the chip that moved, not on the slot it left',
     D.activeElement?.dataset?.chip === order.split(',')[2],
     `${D.activeElement?.dataset?.chip}`);
  await key(D.activeElement, 'ArrowRight');
  eq('the right arrow puts it back', kept().join(), order);

  const doomed = kept()[0];
  await key(chipAt(0), 'Delete');
  ok('Delete drops the chip', !kept().includes(doomed), kept().join(', '));

  /*
   * The three ways a chip can leave where it is.
   *
   * Into the shortlist, back out of it, and off the list of kept chips
   * entirely. The last one matters most: somebody who learned "drag it in"
   * will try "drag it out" before they try tapping it, and a gesture that does
   * nothing reads as a broken app rather than as one that was never offered.
   */
  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  for (const n of [a, b, c]) await dragTo(grip(cardFor(n)), slots()[0]);
  eq('three kept again, in order', numbered().join(), [a, b, c].join());

  const shortlistRow = () => $('#chiptray .chiptray__row[data-list="extra"]');
  const shortlisted = () => [...shortlistRow().querySelectorAll('.chipbench__chip')]
    .map((e) => e.dataset.chip);

  await dragTo(grip(chipAt(0)), shortlistRow());
  eq('dragging one of the three onto the shortlist moves it there',
     shortlisted().join(), a);
  eq('and the other two close up behind it', numbered().join(), [b, c].join());
  eq('so a slot opens back up', slots().length, 1);
  ok('and it is not in both places at once', kept().filter((n) => n === a).length === 1,
     kept().join(', '));

  await dragTo(grip($(`#chiptray .chipbench__chip[data-chip="${CSS.escape(a)}"]`)), slots()[0]);
  eq('and dragging it back makes it one of the three again',
     numbered().join(), [b, c, a].join());
  eq('the shortlist is empty again', shortlisted().length, 0);

  /* Out of the trays entirely. */
  const evicted = numbered()[0];
  await dragTo(grip($(`#chiptray .chipbench__chip[data-chip="${CSS.escape(evicted)}"]`)), roster);
  ok('dragging a kept chip back onto the list unkeeps it',
     !kept().includes(evicted), kept().join(', '));
  eq('and the ones left move up', numbered().length, 2);
  ok('the card in the list stops claiming a rank',
     !cardFor(evicted)?.querySelector('.card__rank'));
  ok('and stops looking kept', !cardFor(evicted)?.classList.contains('is-benched'));

  /* Dragging a card around the list it already lives in is not a toggle. */
  const untouched = kept().join();
  const spare = $$('.card--chip').map((e) => e.dataset.chip).find((n) => !kept().includes(n));
  await dragTo(grip(cardFor(spare)), roster);
  eq('dragging an unkept chip onto the list does nothing at all', kept().join(), untouched);
  ok('and it is still not kept', !kept().includes(spare), spare);

  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 380);
});

await runGroup('the chips page', async () => {
  /*
   * The engine behind this page is checked in chipstest.html against boards
   * built on purpose. What is checked here is the page: the two controls on it
   * are a tier filter and a keep button, and neither has any arithmetic to get
   * wrong, only wiring.
   */
  /* From nothing. What you kept lives in localStorage and outlives the page, so
     without this the group inherits whatever the last visit -- or the last hand
     test on this origin -- left behind, and every count below is off by it. The
     suite puts the real value back at the end either way. */
  localStorage.removeItem('coc.chips.taken');

  const frame = frameFor('chips.html');
  await frame.ready;
  const C = frame.contentDocument;
  await until(() => C.querySelectorAll('.chipcard').length > 0, 'the chips page');
  const cards = () => C.querySelectorAll('.chipcard').length;
  const tier = (n) => C.querySelector(`.chip--rarity[data-tier="${n}"]`);

  const all = cards();
  eq('every chip is on the page', all, 49);
  ok('and each one has an icon', C.querySelectorAll('.chipcard__art').length === all);

  ok('there is a tier filter', !!tier(1) && !!tier(2) && !!tier(3));
  const promised = Number(tier(3).textContent.replace(/\D/g, ''));
  tier(3).click();
  await sleep(220);
  eq('pressing a tier finds exactly what it promised', cards(), promised);
  eq('and says so', C.querySelector('.chipfilters__n').textContent.trim(), `${promised} of ${all}`);
  ok('the pressed one reports itself', tier(3).getAttribute('aria-pressed') === 'true');

  /* One at a time. "II or III" answers 35 of 49, which is not a filter, and the
     same control on the roster tab behaves the same way. */
  const alsoII = Number(tier(2).textContent.replace(/\D/g, ''));
  tier(2).click();
  await sleep(240);
  eq('a second tier replaces the first rather than adding', cards(), alsoII);
  eq('and only one is pressed',
     C.querySelectorAll('.chip--rarity[aria-pressed="true"]').length, 1);

  tier(2).click(); await sleep(240);
  eq('pressing the one already on releases it', cards(), all);

  // The three you kept are yours whatever the filter is doing.
  const keep = C.querySelector('[data-keep]');
  const name = keep.dataset.keep;
  keep.click();
  await sleep(240);
  ok('keeping a chip fills a slot',
     [...C.querySelectorAll('.kept__slot.is-filled')].some((el) => el.textContent.includes(name)),
     name);
  eq('and only one slot', C.querySelectorAll('.kept__slot.is-filled').length, 1);
  ok('three slots, always', C.querySelectorAll('.kept__slot').length === 3);

  C.querySelector(`[data-keep="${name}"]`).click();
  await sleep(240);
  eq('pressing it again gives the slot back', C.querySelectorAll('.kept__slot.is-filled').length, 0);

  /*
   * Three ranked, then a shortlist with no limit.
   *
   * The three are what a run hands you, in the order you would take them, so
   * they move. The shortlist is the thinking done before any offer, which has
   * no reason to stop at three -- a fourth press goes there rather than being
   * refused or quietly pushing your first pick out.
   */
  const three = () => [...C.querySelectorAll('.kept__slot.is-filled .keptrow__name')]
    .map((el) => el.textContent.trim());
  const shortlist = () => [...C.querySelectorAll('.kept__list .keptrow__name')]
    .map((el) => el.textContent.trim());
  const slot = (i) => C.querySelectorAll('.kept__slot.is-filled')[i];

  /* By name, re-queried each time. renderPage() replaces every node, so a list
     of elements collected up front is four detached buttons after the first
     click, and the other three do nothing at all. */
  const wanted = [...C.querySelectorAll('[data-keep]')].slice(0, 4).map((b) => b.dataset.keep);
  for (const n of wanted) {
    C.querySelector(`[data-keep="${CSS.escape(n)}"]`).click();
    await sleep(220);
  }
  eq('the first three fill the three', three().length, 3);
  eq('and the fourth goes to the shortlist', shortlist().length, 1);

  const order = three().join(',');
  slot(2).querySelector('[data-act="up"]').click();
  await sleep(240);
  const moved = three();
  eq('moving the third up swaps it with the second',
     moved.join(','), order.split(',').map((n, i, a) => (i === 1 ? a[2] : i === 2 ? a[1] : n)).join(','));

  ok('the first cannot move up', slot(0).querySelector('[data-act="up"]').disabled);
  ok('and the last cannot move down', slot(2).querySelector('[data-act="down"]').disabled);

  const demoted = three()[0];
  slot(0).querySelector('[data-act="demote"]').click();
  await sleep(240);
  eq('demoting drops it out of the three', three().length, 2);
  ok('and onto the shortlist', shortlist().includes(demoted), shortlist().join(', '));

  C.querySelector(`.keptrow[data-name="${CSS.escape(demoted)}"] [data-act="promote"]`).click();
  await sleep(240);
  ok('promoting puts it back', three().includes(demoted), three().join(', '));
  ok('and takes it off the shortlist', !shortlist().includes(demoted));

  ok('promote is refused while the three are full',
     C.querySelector('.kept__list [data-act="promote"]')?.disabled !== false,
     'a fourth would have been promoted into three slots');

  /* Renamed groups, and nothing under the headings. */
  const heads = [...C.querySelectorAll('.chgroup__head')].map((h) => h.firstChild.textContent.trim());
  ok('the groups are named as chips', heads.every((h) => /Chips$/.test(h)), heads.join(' | '));
  eq('nothing explains a heading underneath it', C.querySelectorAll('.chgroup__blurb').length, 0);
  eq('no co-op notes are printed on the cards', C.querySelectorAll('.chipcard__doubt').length, 0);

  /* Position and Element answer in faces; the rest answer in words. */
  const facesGroup = C.querySelector('.chgroup[data-shape="placement"]');
  eq('a Position card says nothing in numbers',
     facesGroup.querySelectorAll('.chipcard__count').length, 0);
  eq('nor does an Element card',
     C.querySelectorAll('.chgroup[data-shape="element"] .chipcard__count').length, 0);
  ok('but the chips that read nothing still print their text',
     C.querySelector('.chgroup[data-shape="economy"] .chipcard__text').textContent.trim().length > 10);
  frame.remove();
});

/* Whatever happened, the reader gets their formation back. */
localStorage.clear();
for (const [k, v] of Object.entries(saved)) localStorage.setItem(k, v);

const skipNote = skipped ? `, ${skipped} skipped` : '';
document.getElementById('head').innerHTML = fail
  ? `<b style="color:#f0654f">${fail} failed</b>, ${pass} passed${skipNote}`
  : `<b style="color:#55c98a">${pass} passed</b>, 0 failed${skipNote}`;
document.title = `${fail ? `FAIL (${fail})` : 'ok'}: end-to-end checks`;
window.__done = { pass, fail };
</script>
</body>
