  await click(view('list'), 420);
  eq('and back', $('#roster').dataset.chipView, 'list');
  ok('the rule is readable again',
     D.defaultView.getComputedStyle($('.card--chip .chiprow__text')).display !== 'none');

  /*
   * The score answers in faces. "3 of your 6 in your back 2 rows" made you look
   * back at the board to find out which three.
   */
  const scored = chips().find((c) => c.querySelector('.chipwho__art'));
  ok('a chip that reads the board names it in sprites', !!scored,
     'no chip drew any Tatari; is anything on the field?');
  if (scored) {
    ok('with a count in front of them', !!scored.querySelector('.chipwho__n'));
    eq('and no sentence left behind', scored.querySelectorAll('.chiprow__score').length, 0);
  }

  /* High contrast has to reach this tab like it reaches everything else. */
  const tierPill = $('.chiptier');
  const ringBefore = D.defaultView.getComputedStyle(tierPill).boxShadow;
  D.documentElement.dataset.contrast = 'more';
  await sleep(200);
  ok('High contrast gives the tier an edge of its own',
     D.defaultView.getComputedStyle($('.chiptier')).boxShadow !== ringBefore,
     `${ringBefore} unchanged`);
  delete D.documentElement.dataset.contrast;
  await sleep(150);

  /*
   * Reset has to reach this tab's filters too.
   *
   * It did not, and the failure was quiet in the worst way: resetFilters
   * unpresses every .chip on the page, so the buttons went pale while the
   * filter stayed on, and the next redraw put them back. Pressing Reset looked
   * like it did nothing because on this tab it did nothing.
   */
  await click($('#filter-chip-tiers [data-tier="2"]'), 340);
  await click($('.chip--group[data-shape="element"]'), 340);
  ok('two filters narrow it', chips().length < 49, `${chips().length}`);
  await click($('#btn-reset-filters'), 420);
  eq('Reset brings every chip back', chips().length, 49);
  eq('and unpresses both rows',
     $$('#filter-chip-tiers [aria-pressed="true"], .chip--group[aria-pressed="true"]').length, 0);

  /* Seven types do not fit a phone, so the row scrolls rather than hiding two
     of them off the edge with no way to reach them. */
  const typeRow = $('#filter-chip-groups');
  ok('the type row can reach all seven',
     D.defaultView.getComputedStyle(typeRow).overflowX === 'auto');

  /* The panel this replaced is gone, not hidden. */
  ok('the old panel under the Summary is gone', !$('#chips'));

  await click(tab('tatari'), 380);
  eq('and the Tatari tab still works', D.body.dataset.rosterList, 'tatari');
  ok('with its filters back', !hidden('#filter-types'));
});

await runGroup('the chips travel with the picture', async () => {
  /*
   * Formations travel as a picture, so what you would take travels with it or
   * it does not travel at all. Only on the full card: the grid-only card is the
   * tight crop people post, and a chip list is not part of the board -- it goes
   * with the bench, which is also only on the full one.
   *
   * Checked by rendering the real PNG and measuring it, because a section the
   * canvas was not sized for is not pushed into whitespace, it is cut off. That
   * is the one failure a share card cannot have, and card.js says so about the
   * board already.
   */
  app.style.display = '';
  await sleep(200);
  await reset();

  const V = D.defaultView;
  /* Same trap as the flex group's: the dialog reopens showing the last card it
     drew, so "an image that has loaded" is true before this render begins. */
  let lastCard = '';
  const fullCard = async () => {
    $('#btn-share').click();
    await sleep(500);
    $$('dialog[open] button, dialog[open] label')
      .find((e) => /everything/i.test(e.textContent))?.click();
    try {
      await until(() => {
        const el = $('dialog[open] img');
        return el && el.src !== lastCard && el.complete && el.naturalWidth > 0;
      }, 'a freshly drawn full card', 16000);
    } catch { return null; }
    lastCard = $('dialog[open] img').src;
    let bmp;
    try {
      bmp = await V.createImageBitmap(await (await V.fetch($('dialog[open] img').src)).blob());
    } catch {
      /* Headless Chrome under a virtual clock hands out a blob: URL and then
         declines to fetch it. The card did draw -- the wait above only returns
         once the img has a natural width -- so this is the browser refusing to
         read it back, not the app failing to make it. Reported as a skip and
         measured properly the next time the group runs in a real window,
         because a check that goes red for the harness gets ignored. */
      $('dialog[open]')?.close();
      await sleep(240);
      return 'unreadable';
    }
    const cv = new V.OffscreenCanvas(bmp.width, bmp.height);
    const cx = cv.getContext('2d');
    cx.drawImage(bmp, 0, 0);
    const low = cx.getImageData(0, Math.floor(bmp.height * 0.6), bmp.width,
      Math.floor(bmp.height * 0.4)).data;
    let accent = 0;
    for (let i = 0; i < low.length; i += 4) {
      if (Math.abs(low[i] - 255) < 26 && Math.abs(low[i + 1] - 201) < 26
        && Math.abs(low[i + 2] - 60) < 40) accent += 1;
    }
    /* The last rows must be flat background. If the card is a section short,
       this is where the evidence is. */
    const tail = cx.getImageData(0, bmp.height - 8, bmp.width, 8).data;
    let offBg = 0;
    for (let i = 0; i < tail.length; i += 4) {
      if (Math.abs(tail[i] - tail[0]) > 10 || Math.abs(tail[i + 1] - tail[1]) > 10
        || Math.abs(tail[i + 2] - tail[2]) > 10) offBg += 1;
    }
    $('dialog[open]')?.close();
    await sleep(240);
    return { h: bmp.height, accent, offBg };
  };

  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="chips"]'), 420);
  const bare = await fullCard();
  const readable = bare !== 'unreadable';
  if (!readable) skip('the chips are in the picture', 'this browser will not read its own blob: URL back');
  else ok('the full card renders with no chips kept', bare !== null);

  const names = $$('.card--chip').slice(0, 3).map((c) => c.dataset.chip);
  for (const n of names) {
    $(`.card--chip[data-chip="${CSS.escape(n)}"]`)?.click();
    await sleep(260);
  }
  const withChips = await fullCard();
  if (readable) ok('and with three kept', withChips !== null);

  if (readable && bare && withChips && withChips !== 'unreadable') {
    ok('keeping chips puts them in the picture', withChips.accent > bare.accent,
       `${withChips.accent} accent pixels against ${bare.accent}`);
    ok('and the card grows to make room rather than cropping them',
       withChips.h > bare.h, `${withChips.h}px against ${bare.h}px`);
    eq('nothing is cut off the bottom', withChips.offBg, 0);
  }

  await click($('#roster-tabs [data-list="tatari"]'), 380);
});

/*
 * The bug this group exists for, reported from a phone with a screenshot.
 *
 * data-chip-view is written onto #roster when the chips list renders, and it
 * describes only the chips list: in "list" it forces one full-width column.
 * Going back to Tatari left it there, so 230 critters rendered one enormous
 * card per row. Nothing threw. No count was wrong. The only symptom was the
 * layout, which is exactly the kind of break every check written so far walks
 * straight past.
 *
 * So the check is not "the chips tab tidies up after itself". It is the general
 * shape: measure a list, leave by every route there is, come back, and find it
 * exactly as it was -- attributes, columns, card count and the header number.
 * That catches the next thing somebody leaves behind as well as this one.
 */
await runGroup('switching lists leaves nothing behind', async () => {
  await reset();

  const roster = $('#roster');
  const tab = (name) => $(`#roster-tabs [data-list="${name}"]`);
  const LISTS = ['tatari', 'zobos', 'chips'];
  ok('all three lists have a tab', LISTS.every((l) => !!tab(l)));

  const shapeOf = () => {
    const cs = D.defaultView.getComputedStyle(roster);
    return {
      attrs: [...roster.attributes].map((a) => `${a.name}=${a.value}`).sort().join(' | '),
      columns: cs.gridTemplateColumns.split(/\s+/).filter(Boolean).length,
      cards: roster.children.length,
      count: $('#roster-count').textContent.trim(),
    };
  };
  const go = async (name) => { await click(tab(name), 420); return shapeOf(); };

  const first = {};
  for (const l of LISTS) first[l] = await go(l);

  /*
   * The failing symptom, said as a number: one column is the chips' list view
   * wearing the Tatari roster's clothes.
   *
   * Only asked when the roster has a real width. auto-fill fits one 76px track
   * into anything narrower than about 160px, and a window sitting behind
   * another app reports its frame as four pixels wide -- so unguarded this
   * fails for a reason the app had no part in. The round trips above are the
   * check that does not care how wide anything is.
   */
  const wide = () => roster.getBoundingClientRect().width >= 200;
  if (!wide()) {
    skip('the roster is a grid of several columns',
         `the roster measures ${Math.round(roster.getBoundingClientRect().width)}px, so this window is not on screen`);
  } else {
    ok('the Tatari list is a grid of several columns', first.tatari.columns > 1,
       `${first.tatari.columns} column(s)`);
    ok('and so is the Zobo list', first.zobos.columns > 1, `${first.zobos.columns} column(s)`);
  }

  const KEYS = ['attrs', 'columns', 'cards', 'count'];
  for (const home of LISTS) {
    for (const via of LISTS) {
      if (via === home) continue;
      await go(home);
      await go(via);
      const back = await go(home);
      const drift = KEYS.filter((k) => back[k] !== first[home][k]);
      ok(`${home} comes back unchanged from ${via}`, drift.length === 0,
         drift.map((k) => `${k}: ${JSON.stringify(back[k])} not ${JSON.stringify(first[home][k])}`).join('; '));
    }
  }

  /*
   * The other half of the same fix. Clearing the attribute on the way out must
   * not throw away the reader's choice on the way back in -- a view switch that
   * forgets is a worse bug than the one being fixed, and the obvious fix for
   * the leak (never write the attribute) would cause it.
   */
  const view = $('#chip-view');
  ok('the chips have a view switch', !!view);
  if (view) {
    await go('chips');
    await click(view.querySelector('[data-view="grid"]'), 400);
    eq('grid can be chosen', roster.dataset.chipView, 'grid');
    await go('tatari');
    ok('leaving the chips takes their layout with them', !roster.dataset.chipView,
       roster.dataset.chipView);
    if (wide()) {
      ok('and the critters are back in a grid of their own',
         D.defaultView.getComputedStyle(roster).gridTemplateColumns.split(/\s+/).filter(Boolean).length > 1);
    }
    await go('chips');
    eq('coming back remembers grid', roster.dataset.chipView, 'grid');
    await click(view.querySelector('[data-view="list"]'), 400);
    await go('tatari');
  }
});

/*
 * The roster cannot spill past its own grid.
 *
 * The bug this pins has been fixed and come back more than once: the rightmost
 * column creeping past the panel, or the cards appearing to slide behind each
 * other, under fractional display scaling or browser zoom. The layout maths is
 * exact, so the fix is not a column count -- it is two CSS invariants the count
 * cannot see, and this is the check that fails the moment either is dropped.
 *
 *   overflow-x is never a value that lets content escape sideways. It resolves
 *   to hidden beside the vertical scroll on a wide screen and to clip on a
 *   phone, but never visible or auto -- either of those lets a rounded-up pixel
 *   past the edge, which is the whole symptom.
 *
 *   the vertical scrollbar does not change the column maths. On a wide screen it
 *   comes and goes as filtering changes the card count, and a reserved gutter is
 *   what stops that reflow shoving every card sideways on a series of clicks.
 *   Asked only where the box actually scrolls -- the phone layout hands the
 *   scroll to the page and has no gutter to reserve.
 */
await runGroup('the roster cannot spill past its grid', async () => {
  await reset();
  const roster = $('#roster');
  const cs = () => D.defaultView.getComputedStyle(roster);

  const x = cs().overflowX;
  ok('the roster clips sideways rather than letting a card escape',
     x === 'hidden' || x === 'clip', `overflow-x is ${x}`);

  if (cs().overflowY === 'auto' || cs().overflowY === 'scroll') {
    ok('and the vertical scrollbar reserves its gutter so it cannot reflow the columns',
       cs().scrollbarGutter.includes('stable'), `scrollbar-gutter is ${cs().scrollbarGutter}`);
  } else {
    skip('the scrollbar gutter', 'this layout hands the vertical scroll to the page');
  }

  /*
   * And a card cannot grow its row. Benching Ashlarva marked its three line-mates
   * as swaps, whose badge band gets 17px of padding for the swap marker; three
   * badges plus that was wider than the art box, the box (min-width: auto) grew
   * to fit, aspect-ratio made it as tall as it was wide, and the whole row of
   * ten cards stretched by 17px. The art box must never be wider than its card.
   */
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  if ($('#btn-clear')) await click($('#btn-clear'), 320);
  const ash = $('.panel--roster .card[data-slug="ashlarva"]');
  if (ash) {
    await click(ash, 320);
    const wide = $$('.panel--roster .card').filter((c) =>
      c.querySelector('.card__art').getBoundingClientRect().width > c.getBoundingClientRect().width);
    ok('no art box is wider than its card after benching a Tatari with swap siblings',
       wide.length === 0, `${wide.length} cards grew: ${wide.slice(0, 3).map((c) => c.dataset.slug).join(', ')}`);
    // And every card is the same size as every other: the art is sized by the
    // card's width alone, so no row is taller than its neighbours and no sprite
    // bigger than the one beside it, whatever badges the cards happen to wear.
    const sizes = new Set($$('.panel--roster .card').map((c) =>
      `${Math.round(c.getBoundingClientRect().height)}x${Math.round(c.querySelector('.card__art').getBoundingClientRect().width)}`));
    ok('every roster card is the same height with the same size of art',
       sizes.size === 1, `sizes seen: ${[...sizes].join(', ')}`);
    await click($(`.panel--roster .card[data-slug="ashlarva"]`), 320);   // put it back
  } else {
    skip('the art box cannot outgrow its card', 'no Ashlarva in this roster');
  }
});

/*
 * Glitter art, which had no check at all and quietly stopped working in 1.8.3.
 *
 * The group below is the one that broke it: the roster learned to update its
 * cards in place, which is defined by not touching the <img> elements -- and
 * Glitter is the one switch that changes every sprite without changing which
 * Tatari are listed. So the toggle did nothing to the roster while the bench and
 * the field changed underneath it, and then appeared to work minutes later when
 * a search or a filter forced a rebuild. Reported as "glitter art toggle doesn't
 * work anymore".
 *
 * Checked by reading the src off the cards, because that is the only place the
 * answer was ever wrong: the checkbox was checked, the state was right, and
 * every other surface already agreed. Only the picture was stale.
 */
await runGroup('the glitter switch changes the roster art, not just the bench', async () => {
  await until(() => !!$('#roster'), 'the drafter to be in the frame', 8000);
  await click($('#roster-tabs [data-list="tatari"]'), 380);
  await reset();

  const box = $('#opt-glitter');
  if (!box) { skip('the glitter switch', 'no glitter control in this copy'); return; }

  /* Counted across the roster rather than named on one Tatari: 207 of the 230
     have a second sprite, so "how many are showing it" needs no fixture and
     cannot rot when the art catalogue changes. */
  const lit = () => $$('.panel--roster .card img').filter((i) => /\/glitter\//.test(i.src)).length;
  const flip = async (on) => {
    box.checked = on;
    box.dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(650);
  };

  await flip(false);
  eq('with it off, nothing in the roster is showing glitter art', lit(), 0);

  await flip(true);
  ok('turning it on swaps the roster sprites over', lit() > 0,
     `${lit()} of ${$$('.panel--roster .card img').length} cards`);

  /* And back, so the switch is a switch rather than a one-way door. */
  await flip(false);
  eq('turning it off puts the ordinary art back', lit(), 0);

  await reset();
});

/*
 * The roster keeps its cards on a formation change, rather than rebuilding them.
 *
 * renderRoster runs on every edit, and it used to rebuild the whole innerHTML
 * each time -- so all 230 <img> elements were thrown away and re-decoded, and the
 * sprites blinked out and reloaded on every drag, worst on a clear-all-then-load.
 * When the visible list is unchanged it now updates the cards in place, so the
 * image nodes survive. This tags one, makes a formation change that keeps the
 * list (benching a Tatari), and checks the very same node is still there.
 */
await runGroup('the roster updates in place instead of reloading its sprites', async () => {
  await reset();
  await click($('#roster-tabs [data-list="tatari"]'), 320);   // in case a prior group left another list up
  if ($('#btn-clear')) await click($('#btn-clear'), 320);       // empty the formation a prior group left
  // A card that is not already brought and is not a tier-swap, so a click brings
  // it (rather than dropping it or switching a tier).
  const first = $$('.panel--roster .card')
    .find((c) => !c.classList.contains('is-benched') && !c.dataset.switchFrom);
  ok('there is a bringable roster card to watch', !!first, 'no bringable roster card');
  if (!first) return;
  const slug = first.dataset.slug;
  const img = first.querySelector('.card__art img');
  img.dataset.probe = 'keep-me';                 // a mark only this exact node carries
  first.dataset.probe = 'keep-me';

  // Bench it: a formation change that leaves the visible list exactly as it was.
  await click(first, 320);
  const card2 = $(`.panel--roster .card[data-slug="${CSS.escape(slug)}"]`);
  ok('the card took the formation state', card2?.classList.contains('is-benched'),
     card2?.className);
  ok('the card element is the same node, not a rebuild', card2?.dataset.probe === 'keep-me');
  ok('and its sprite is the same <img>, so it never reloaded',
     card2?.querySelector('.card__art img')?.dataset.probe === 'keep-me');

  // A real change to the list still rebuilds: filtering to one type drops the
  // rest, so the same node cannot survive that.
  const water = chipFor('.chip--type', 'Water');
  if (water) {
    await click(water, 320);
    const gone = $(`.panel--roster .card[data-slug="${CSS.escape(slug)}"]`);
    ok('a filter that changes the list rebuilds (probe does not persist through it)',
       !gone || gone.dataset.probe !== 'keep-me', 'probe survived a list change');
    await click(water, 320);      // release the filter
  }
});

/*
 * The roster paints its sprites without needing a scroll.
 *
 * Native loading="lazy" in this scroll container loaded the images but, in
 * Chrome, often did not paint them until a scroll -- so the roster opened full of
 * blank squares. The sprites are custom lazy-loaded now: a blank pixel until a
 * geometry check swaps the real src in for cards within a screen of the visible
 * area, which paints the ordinary way and works even in a background tab (where
 * an IntersectionObserver would not fire). This checks no sprite uses native
 * lazy, and that every sprite already in view has swapped to its real art.
 */
await runGroup('the roster paints its sprites without a scroll', async () => {
  await reset();
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await until(() => $$('.panel--roster .card img.lazyart').length > 0, 'the roster sprites', 5000);

  ok('roster sprites are custom lazy, not native loading=lazy',
     !$('.panel--roster .card img[loading="lazy"]')
     && $$('.panel--roster .card img.lazyart').length > 0);

  const host = $('#roster');
  const inView = () => {
    const hr = host.getBoundingClientRect();
    return $$('.panel--roster .card').filter((c) => {
      const r = c.getBoundingClientRect();
      return r.bottom > hr.top && r.top < hr.bottom;
    });
  };
  const start = inView();
  if (!start.length) { skip('sprites load without a scroll', 'the roster is not on screen in this window'); return; }
  const realLoaded = () => inView().every((c) => {
    const img = c.querySelector('.card__art img');
    return img && img.currentSrc && !img.currentSrc.startsWith('data:');
  });
  await until(realLoaded, 'the visible sprites to swap in their real art', 6000);
  ok('every sprite already in view has swapped to its real art (so it paints, no blank squares)',
     realLoaded());
});

/*
 * Dragging a chip into the dock, and dragging one around inside it.
 *
 * A tap already keeps a chip, and this could have stopped there. What a tap
 * cannot say is *where*: it appends, and the order of the three is the whole
 * reason the dock exists -- it is the order you take them in during a run. So
 * the checks below are mostly about position, not about membership.
 *
 * Driven with real pointer events rather than by calling the handler, because
 * the handler was never the part that broke. What breaks is the wiring: a grip
 * that is not the element the drag was bound to, a drop zone whose selector
 * misses, a payload the zone refuses. All of that is between pointerdown and
 * pointerup, and none of it is exercised by calling placeAt directly.
 */
/*
 * Every route a drag can take, in one place.
 *
 * This group exists because of a regression I shipped. Drop zones nest -- the
 * whole roster panel takes a Tatari dragged off the field, and the chips' card
 * list sits inside that panel and takes only chips -- and the hit test was
 * changed to prefer the innermost. So a critter dragged back to the roster
 * landed on the chip list, which refused it, and the panel behind it never
 * heard about the drop. Nothing happened and nothing said why.
 *
 * Every other check for dragging is about one route. That is how a change to
 * the thing all of them share went out green: each route was fine on its own
 * terms and nothing asked whether they still all worked at once.
 */
/*
 * A card that cannot be placed still picks up, and still says why.
 *
 * Reported as "I cannot drag Tatari with ease -- they seem to need to be on my
 * bench already". They did. With the bench or the field full, the roster card
 * refused to start a drag at all: no lift, no message, nothing. Clicking that
 * same card has always answered "P1's bench is full (15 max)", so the rule was
 * never the problem -- one of the two ways of asking simply did not reply.
 *
 * A gesture that dies in silence reads as a broken app rather than as a rule,
 * which is exactly how it was reported.
 */
await runGroup('a card that cannot be brought still explains itself', async () => {
  await until(() => !!$('#roster'), 'the drafter to be in the frame', 8000);
  const V = D.defaultView;
  await click($('#roster-tabs [data-list="tatari"]'), 400);
  await reset();
  $('#btn-clear-field')?.click();
  await sleep(320);
  const clearBench = $$('button').find((b) => /clear bench/i.test(b.textContent));
  if (clearBench && !clearBench.disabled) { clearBench.click(); await sleep(320); }

  if ($('#roster').getBoundingClientRect().width < 200) {
    skip('a blocked card still explains itself', 'the roster has no size in this window');
    return;
  }

  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  const bring = (el) => {
    el.scrollIntoView({ block: 'center' });
    const r = el.getBoundingClientRect();
    const off = (r.top + r.height / 2) - V.innerHeight / 2;
    if (Math.abs(off) > 40) V.scrollBy(0, off);
  };
  const send = (type, x, y, to) => to.dispatchEvent(new V.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    pointerId: 9, pointerType: 'mouse', isPrimary: true,
    button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1,
    clientX: x, clientY: y,
  }));

  /* Fill the bench by tapping, which is the path that already works and
     already explains itself. */
  const free = () => $$('.panel--roster .card')
    .find((c) => !c.classList.contains('is-benched') && !c.dataset.switchFrom);
  for (let i = 0; i < 18; i += 1) {
    const c = free();
    if (!c) break;
    c.click();
    await sleep(110);
  }
  await sleep(360);

  const blocked = free();
  ok('the bench filled up and there is still a card it will not take', !!blocked,
     `${$$('.benchchip').length} benched`);
  if (!blocked) return;

  /* Tapping it says why. This is the answer the drag has to match. */
  blocked.click();
  await sleep(420);
  const spoken = $('.toast')?.textContent.trim() ?? '';
  ok('tapping it explains the refusal', /full|already/i.test(spoken), spoken || 'said nothing');

  /* Now the same card, dragged. */
  const cell = $$('.cell:not(.cell--enemy)').find((c) => !c.querySelector('.token'));
  ok('there is an empty square to aim at', !!cell);
  if (!cell) return;

  bring(blocked);
  const a = centre(blocked);
  send('pointerdown', a.x, a.y, blocked);
  send('pointermove', a.x + 12, a.y + 12, V);
  await sleep(140);
  ok('it can still be picked up, so the gesture is alive', !!D.querySelector('.drag-ghost'));

  const wasPlaced = $$('.cell.is-filled').length;
  bring(cell);
  const b = centre(cell);
  send('pointermove', b.x, b.y, V);
  await sleep(120);
  send('pointerup', b.x, b.y, V);
  await sleep(520);

  const told = $('.toast')?.textContent.trim() ?? '';
  ok('and dropping it on the field says why it will not go', /full|already/i.test(told),
     told || 'said nothing at all, which is the bug');
  eq('nothing was placed', $$('.cell.is-filled').length, wasPlaced);

  $('#btn-clear-field')?.click();
  await sleep(300);
  const clear2 = $$('button').find((bt) => /clear bench/i.test(bt.textContent));
  if (clear2 && !clear2.disabled) { clear2.click(); await sleep(320); }
  await reset();
});

await runGroup('every drag route still lands', async () => {
  await until(() => !!$('#roster'), 'the drafter to be in the frame', 8000);
  const V = D.defaultView;
  await click($('#roster-tabs [data-list="tatari"]'), 420);
  await reset();

  const box = $('#roster').getBoundingClientRect();
  if (box.width < 200) {
    skip('every drag route still lands', 'the roster has no size in this window, so nothing has a position');
    return;
  }

  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  const bring = (el) => {
    el.scrollIntoView({ block: 'center' });
    const r = el.getBoundingClientRect();
    const off = (r.top + r.height / 2) - V.innerHeight / 2;
    if (Math.abs(off) > 40) V.scrollBy(0, off);
  };
  const send = (type, x, y, to) => to.dispatchEvent(new V.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    pointerId: 5, pointerType: 'mouse', isPrimary: true,
    button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1,
    clientX: x, clientY: y,
  }));
  const drag = async (handle, target) => {
    if (!handle || !target) return false;
    bring(handle);
    const a = centre(handle);
    send('pointerdown', a.x, a.y, handle);
    send('pointermove', a.x + 9, a.y + 9, V);
    await sleep(80);
    for (let tries = 0; tries < 6; tries += 1) {
      bring(target);
      const b = centre(target);
      send('pointermove', b.x, b.y, V);
      await sleep(70);
      const ghost = D.querySelector('.drag-ghost');
      if (ghost) ghost.style.visibility = 'hidden';
      const under = D.elementFromPoint(b.x, b.y);
      if (ghost) ghost.style.visibility = '';
      if (under && (under === target || target.contains(under))) {
        send('pointerup', b.x, b.y, V);
        await sleep(380);
        return true;
      }
    }
    V.dispatchEvent(new V.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await sleep(200);
    return false;
  };

  const filled = () => $$('.cell.is-filled').length;
  const benched = () => $$('.benchchip').length;
  const freeCell = () => $$('.cell:not(.cell--enemy)').find((c) => !c.querySelector('.token'));
  const freeCard = () => $$('.panel--roster .card')
    .find((c) => !c.classList.contains('card--chip')
      && !c.classList.contains('is-benched') && !c.dataset.switchFrom);

  /* 1. the roster onto the field, which is what the app is for */
  const wasFilled = filled();
  await drag(freeCard(), freeCell());
  ok('a critter goes from the roster onto the field', filled() > wasFilled,
     `${wasFilled} to ${filled()}`);

  /* 2. the field back to the roster. This is the one that broke. */
  const beforeBack = filled();
  await drag($('.cell.is-filled .token'), $('#roster'));
  ok('and off the field back onto the roster', filled() < beforeBack,
     `${beforeBack} to ${filled()}`);

  /* 3. the roster onto the bench */
  const wasBench = benched();
  await drag(freeCard(), $('.bench__player'));
  ok('a critter goes from the roster onto the bench', benched() > wasBench,
     `${wasBench} to ${benched()}`);

  /* 4. the bench onto the field */
  const beforePlace = filled();
  await drag($('.benchchip'), freeCell());
  ok('and from the bench onto the field', filled() > beforePlace,
     `${beforePlace} to ${filled()}`);

  /* 5. one square to another */
  const from = $('.cell.is-filled');
  const to = freeCell();
  const movedSlug = from?.querySelector('.token')?.dataset.slug ?? null;
  await drag(from?.querySelector('.token'), to);
  ok('a critter moves from one square to another',
     !!to && to.classList.contains('is-filled'),
     movedSlug ? `moving ${movedSlug}` : 'nothing to move');

  /* 6. the field back to the bench */
  const beforeReturn = benched();
  await drag($('.cell.is-filled .token'), $('.bench__player'));
  ok('and off the field back to the bench', benched() >= beforeReturn,
     `${beforeReturn} to ${benched()}`);

  /* 7. the level-up plan reorders by its rank number.
     Two on the field first: the steps come from the board, and the checks above
     have just finished taking everything off it. */
  await placeOne();
  await placeOne();
  /* Steps are added, not implied: putting a critter on the field offers it in
     the picker and you say yes. Two, so there is an order to change. */
  for (let i = 0; i < 2; i += 1) {
    const pick = $('.step-pick');
    if (!pick) break;
    pick.click();
    await sleep(240);
    $('#step-adder button[type="submit"]')?.click();
    await sleep(340);
  }
  const steps = $$('#priority .prio:not(.prio--ghost)');
  if (steps.length < 2) {
    skip('the level-up plan reorders',
         `only ${steps.length} step(s): ${filled()} on the field, ${benched()} benched, `
         + `${$$('#priority .prio').length} rows in the panel, count says "${$('#step-count')?.textContent?.trim()}"`);
  } else {
    /*
     * One of them gets a note, because both steps can be the same critter and
     * two identical rows cannot show you a swap. Not data-index either: that is
     * the position, renumbered on every render, so comparing it would say the
     * order changed no matter what happened.
     */
    const note = steps[0].querySelector('.prio__note');
    if (!note) {
      skip('the level-up plan reorders', 'no note field to tell two identical steps apart');
    } else {
      note.value = 'marked';
      note.dispatchEvent(new V.Event('input', { bubbles: true }));
      await sleep(320);
      const order = () => $$('#priority .prio:not(.prio--ghost)')
        .map((p) => p.querySelector('.prio__note')?.value || '-').join('|');
      const was = order();
      await drag(steps[1], steps[0]);
      ok('a step in the plan moves to another position', order() !== was,
         `${was} -> ${order()}`);
    }
  }

  await reset();
});

/*
 * The click a finished drag leaves behind, which used to undo the drop.
 *
 * Dragging a Tatari from the roster onto the field placed it and then took it
 * straight back off, in the same frame. The drop was never the problem: dnd.js
 * captures the pointer to the element the drag started on, so the mouseup is
 * retargeted to that card, the browser sees a matched mousedown/mouseup pair on
 * one element and fires a click on it -- and the roster reads a click on a card
 * as a tap, which toggles it off the bench. Off the bench is off the field.
 *
 * Every existing drag check missed it, and could not have caught it: they drive
 * the app with synthetic PointerEvents, and a synthetic pointer neither captures
 * nor makes the browser generate a click. So the one event that does the damage
 * is the one the suite never sent. It is sent here, explicitly, at the source
 * element -- which is exactly where the browser puts it.
 */
await runGroup('a drag is not also a tap on the card it started from', async () => {
  await until(() => !!$('#roster'), 'the drafter to be in the frame', 8000);
  const V = D.defaultView;
  await click($('#roster-tabs [data-list="tatari"]'), 420);
  await reset();

  if ($('#roster').getBoundingClientRect().width < 200) {
    skip('a drag is not also a tap', 'the roster has no size in this window');
    return;
  }

  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  const bring = (el) => {
    el.scrollIntoView({ block: 'center' });
    const r = el.getBoundingClientRect();
    const off = (r.top + r.height / 2) - V.innerHeight / 2;
    if (Math.abs(off) > 40) V.scrollBy(0, off);
  };
  const send = (type, x, y, to) => to.dispatchEvent(new V.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    pointerId: 7, pointerType: 'mouse', isPrimary: true,
    button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1,
    clientX: x, clientY: y,
  }));

  const card = $$('.panel--roster .card')
    .find((c) => !c.classList.contains('card--chip')
      && !c.classList.contains('is-benched') && !c.dataset.switchFrom);
  const cell = $$('.cell:not(.cell--enemy)').find((c) => !c.querySelector('.token'));
  ok('there is a card to drag and a square to drop it on', !!card && !!cell);
  if (!card || !cell) return;

  const before = $$('.cell.is-filled').length;
  bring(card);
  const a = centre(card);
  send('pointerdown', a.x, a.y, card);
  send('pointermove', a.x + 9, a.y + 9, V);
  await sleep(90);
  bring(cell);
  const b = centre(cell);
  send('pointermove', b.x, b.y, V);
  await sleep(80);
  send('pointerup', b.x, b.y, V);
  const landed = $$('.cell.is-filled').length;
  ok('the drop lands', landed > before, `${before} to ${landed}`);

  /*
   * And now the event the browser sends and the suite never did -- in the same
   * turn of the event loop, with nothing awaited in between, because that is
   * where a real one arrives: the browser dispatches the click synchronously
   * after the mouseup it pairs with. Sending it after a wait would be testing a
   * click no browser produces, and the guard in dnd.js deliberately ignores it.
   */
  card.dispatchEvent(new V.MouseEvent('click', {
    bubbles: true, cancelable: true, composed: true, button: 0,
  }));
  await sleep(420);

  eq('and the click the capture leaves behind does not undo it',
     $$('.cell.is-filled').length, landed);

  $('#btn-clear-field')?.click();
  await sleep(300);
  const clearBench = $$('button').find((bt) => /clear bench/i.test(bt.textContent));
  if (clearBench && !clearBench.disabled) { clearBench.click(); await sleep(320); }
  await reset();
});

await runGroup('chips are dragged into the dock, and around inside it', async () => {
  /*
   * Waited for, not assumed.
   *
   * D is re-pointed at the frame's live document before every group, and a
   * frame caught mid-navigation hands back a document that has loaded nothing
   * yet -- so `$('#roster')` was null about one run in six and the group threw
   * on its first line, blaming itself for something that happened before it
   * started.
   */
  await until(() => !!$('#roster'), 'the drafter to be in the frame', 8000);
  const V = D.defaultView;
  const roster = $('#roster');

  /* Every measurement below is a rectangle, and a window that is not on screen
     reports every rectangle as empty. Nothing here can be asked in that state. */
  await click($('#roster-tabs [data-list="chips"]'), 440);
  if (roster.getBoundingClientRect().width < 200) {
    skip('chips can be dragged into the dock',
         'this window is not on screen, so nothing has a position to drag between');
    await click($('#roster-tabs [data-list="tatari"]'), 380);
    return;
  }

  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  const send = (type, x, y, to) => to.dispatchEvent(new V.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    pointerId: 1, pointerType: 'mouse', isPrimary: true,
    button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1,
    clientX: x, clientY: y,
  }));
  /*
   * Put the thing in the middle of the window, not merely on screen.
   *
   * scrollIntoView centres within the nearest scrollport, which for a dock
   * inside a page with a sticky header left it at y=128 -- on screen, and
   * underneath the header, so elementFromPoint answered <h1> and the drop went
   * nowhere. The window is nudged afterwards to finish the job.
   */
  const bring = (el) => {
    el.scrollIntoView({ block: 'center' });
    const r = el.getBoundingClientRect();
    const off = (r.top + r.height / 2) - V.innerHeight / 2;
    if (Math.abs(off) > 40) V.scrollBy(0, off);
  };

  /* Mouse, not touch: a touch drag waits out a hold timer and this suite has
     enough real waiting in it. The two paths meet at begin(). */
  const dragTo = async (handle, target) => {
    /* Both ends scrolled to before they are measured. A drag is hit-tested with
       elementFromPoint, which only knows about the viewport -- point it at a
       coordinate below the fold and it answers null, and the drop silently does
       nothing. That is a fact about the test, not about the app: a person
       dragging has both ends on their screen because they can see them. */
    bring(handle);
    await sleep(90);
    const a = centre(handle);
    send('pointerdown', a.x, a.y, handle);
    send('pointermove', a.x + 9, a.y + 9, V);   // past the 5px the mouse waits for
    await sleep(80);
    /*
     * Aim, then check the aim, then let go.
     *
     * A sleep is not a wait here. These suites run under a virtual clock when
     * they are driven headlessly, which collapses every setTimeout to almost no
     * real time -- so "scroll, sleep 90ms, measure" measured a scroll that had
     * not landed, the pointer came down beside the target, and the drop did
     * nothing. Roughly one run in two. It asks the page where the pointer
     * actually is instead, which is the same question the drag itself asks.
     */
    let b = centre(target);
    for (let tries = 0; tries < 5; tries += 1) {
      bring(target);
      b = centre(target);
      send('pointermove', b.x, b.y, V);
      await sleep(60);
      const ghost = D.querySelector('.drag-ghost');
      if (ghost) ghost.style.visibility = 'hidden';
      const under = D.elementFromPoint(b.x, b.y);
      if (ghost) ghost.style.visibility = '';
      if (under && (under === target || target.contains(under))) break;
    }
    send('pointerup', b.x, b.y, V);
    await sleep(340);
  };

  /*
   * Scoped to the tray, because the same chip is now drawn twice on purpose:
   * once in the tray you edit in, and once in the dock that ends up in the
   * screenshot. An unscoped `.chipbench__chip` counted both and every number
   * below doubled. The two agreeing is itself worth a check, and gets one.
   */
  const dock = () => $('#chipbench');
  const tray = () => $('#chiptray');
  const kept = () => $$('#chiptray .chipbench__chip').map((e) => e.dataset.chip);
  const inDock = () => $$('#chipbench .chipbench__chip').map((e) => e.dataset.chip);
  const numbered = () => $$('#chiptray .chipbench__chip')
    .filter((e) => e.querySelector('.chipbench__n')).map((e) => e.dataset.chip);
  const slots = () => $$('#chiptray .chipbench__slot');
  const cardFor = (name) => $(`.card--chip[data-chip="${CSS.escape(name)}"]`);
  const grip = (el) => el.querySelector('img') ?? el;

  /* Nothing kept, so the dock is showing what it is for rather than what is in
     it -- which is the state the first drag has to work from. */
  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  /* Both ends of the drag have to be on the screen, not merely in the page.
     This is the check that says which one was not. */
  const trayBox = tray().getBoundingClientRect();
  ok('the tray has a real size to drop into',
     trayBox.width > 40 && trayBox.height > 20,
     `${Math.round(trayBox.width)}x${Math.round(trayBox.height)}`);

  eq('nothing is kept to start', kept().length, 0);
  ok('the tray is there before anything is in it, because that is where the first one goes',
     !tray().hidden);
  eq('and it shows a numbered outline for each of the three', slots().length, 3);
  eq('the outlines are numbered rather than blank',
     slots().map((e) => e.textContent.trim()).join(''), '123');
  ok('and the shortlist says what it is for',
     !!$('#chiptray .chiptray__hint'), $('#chiptray .chiptray__hint')?.textContent);

  const names = $$('.card--chip').slice(0, 4).map((c) => c.dataset.chip);
  ok('there are four chips to work with', names.length === 4, names.join(', '));
  const [a, b, c, d] = names;

  await dragTo(grip(cardFor(a)), slots()[0]);
  eq('dragging one onto an empty slot keeps it', kept().join(), a);
  eq('and it is your first pick', numbered().join(), a);

  await dragTo(grip(cardFor(b)), slots()[0]);
  await dragTo(grip(cardFor(c)), slots()[0]);
  eq('three of them fill the three', numbered().join(), [a, b, c].join());
  eq('and the outlines are used up', slots().length, 0);

  /*
   * The three are slots, so dropping onto a filled one swaps: the chip you drop
   * takes that slot, and the one that was there takes the spot yours came from.
   * Nothing is pushed off the end and no slot is left empty by the move.
   */
  const third = $$('#chiptray .chipbench__chip')[2];
  const first = $$('#chiptray .chipbench__chip')[0];
  await dragTo(grip(third), first);
  eq('dropping the third onto the first swaps the two',
     numbered().join(), [c, b, a].join());
  eq('and the numbers on the faces still run 1-2-3',
     $$('#chiptray .chipbench__chip .chipbench__n').map((e) => e.textContent).join(''), '123');
  /* The dock is a second view of one truth, not a second truth. If it can
     disagree with the tray, one of them is lying in the screenshot. */
  eq('and the dock in the picture agrees with the tray', inDock().join(), kept().join());
  ok('the dock is not hidden while chips are kept', !dock().hidden);

  /* And back again, so this is a reorder and not a one-way trick. */
  await dragTo(grip($$('#chiptray .chipbench__chip')[0]), $$('#chiptray .chipbench__chip')[2]);
  eq('and it goes back the other way', numbered().join(), [a, b, c].join());

  /*
   * A fourth pick dropped onto a slot that is taken. The chip it displaces is
   * not thrown away -- it goes to the shortlist, because losing a choice you
   * made to a gesture you were still learning is the worst thing this could do.
   * Order here is a,b,c, so the first slot holds a.
   */
  await dragTo(grip(cardFor(d)), $$('#chiptray .chipbench__chip')[0]);
  eq('a fourth dropped onto the first takes first place', numbered()[0], d);
  eq('the three are still three', numbered().length, 3);
  ok('and the one it displaced is shortlisted, not thrown away',
     kept().includes(a) && !numbered().includes(a), kept().join(', '));

  /* The roster agrees with the dock: the badge on the card is the same number
     as the badge on the face, which is the only reason to have both. */
  const badge = cardFor(d)?.querySelector('.card__rank');
  eq('the roster card carries the new rank too', badge?.textContent, '1');

  /* Dropping a chip on itself is not an edit, and must not be treated as one. */
  const before = kept().join();
  await dragTo(grip($$('#chiptray .chipbench__chip')[1]), $$('#chiptray .chipbench__chip')[1]);
  eq('dropping one onto itself changes nothing', kept().join(), before);

  /*
   * The same edit without a pointer.
   *
   * A reorder you can only do by dragging is a reorder some people cannot do at
   * all, and the order of the three is the point of the dock. Arrows move a
   * chip one place along; Delete drops it.
   */
  const chipAt = (i) => $$('#chiptray .chipbench__chip')[i];
  const key = async (el, k) => {
    el.focus();
    el.dispatchEvent(new V.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
    await sleep(300);
  };
  const order = kept().join();
  await key(chipAt(2), 'ArrowLeft');
  eq('the left arrow moves a chip one place along',
     kept().join(), (() => { const o = order.split(','); [o[1], o[2]] = [o[2], o[1]]; return o.join(); })());
  ok('and focus stays on the chip that moved, not on the slot it left',
     D.activeElement?.dataset?.chip === order.split(',')[2],
     `${D.activeElement?.dataset?.chip}`);
  await key(D.activeElement, 'ArrowRight');
  eq('the right arrow puts it back', kept().join(), order);

  const doomed = kept()[0];
  await key(chipAt(0), 'Delete');
  ok('Delete drops the chip', !kept().includes(doomed), kept().join(', '));

  /*
   * The three ways a chip can leave where it is.
   *
   * Into the shortlist, back out of it, and off the list of kept chips
   * entirely. The last one matters most: somebody who learned "drag it in"
   * will try "drag it out" before they try tapping it, and a gesture that does
   * nothing reads as a broken app rather than as one that was never offered.
   */
  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  for (const n of [a, b, c]) await dragTo(grip(cardFor(n)), slots()[0]);
  eq('three kept again, in order', numbered().join(), [a, b, c].join());

  /* The zone, not the row inside it: the whole bordered square is the target
     now, label included, which is what it looks like from the outside. */
  const shortlist = () => $('#chiptray .chiptray__zone[data-list="extra"]');
  const shortlisted = () => [...shortlist().querySelectorAll('.chipbench__chip')]
    .map((e) => e.dataset.chip);
  ok('the shortlist is a square you can drop into, not just its contents',
     !!shortlist() && shortlist().classList.contains('chiptray__zone'));

  await dragTo(grip(chipAt(0)), shortlist());
  eq('dragging one of the three onto the shortlist moves it there',
     shortlisted().join(), a);
  eq('and the other two keep the slots they were in', numbered().join(), [b, c].join());
  eq('so the slot it left is empty and waiting', slots().length, 1);
  ok('and it is not in both places at once', kept().filter((n) => n === a).length === 1,
     kept().join(', '));

  await dragTo(grip($(`#chiptray .chipbench__chip[data-chip="${CSS.escape(a)}"]`)), slots()[0]);
  eq('and dragging it into the empty slot makes it one of the three again',
     numbered().join(), [a, b, c].join());
  eq('the shortlist is empty again', shortlisted().length, 0);

  /* Out of the trays entirely. */
  const evicted = numbered()[0];
  await dragTo(grip($(`#chiptray .chipbench__chip[data-chip="${CSS.escape(evicted)}"]`)), roster);
  ok('dragging a kept chip back onto the list unkeeps it',
     !kept().includes(evicted), kept().join(', '));
  eq('and the slot it held is left empty rather than closing up', numbered().length, 2);
  ok('the card in the list stops claiming a rank',
     !cardFor(evicted)?.querySelector('.card__rank'));
  ok('and stops looking kept', !cardFor(evicted)?.classList.contains('is-benched'));

  /* Dragging a card around the list it already lives in is not a toggle. */
  const untouched = kept().join();
  const spare = $$('.card--chip').map((e) => e.dataset.chip).find((n) => !kept().includes(n));
  await dragTo(grip(cardFor(spare)), roster);
  eq('dragging an unkept chip onto the list does nothing at all', kept().join(), untouched);
  ok('and it is still not kept', !kept().includes(spare), spare);

  /*
   * Double-tapping a kept chip is the way out a phone reaches for, and the one
   * that proves the slots are slots: it sends the chip back to the list and
   * leaves the slot it held empty rather than sliding the others up into it.
   */
  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  for (const n of [a, b, c]) await dragTo(grip(cardFor(n)), slots()[0]);
  eq('three kept once more, in order', numbered().join(), [a, b, c].join());

  const middle = $$('#chiptray .chipbench__chip')[1];
  middle.dispatchEvent(new V.MouseEvent('dblclick', { bubbles: true }));
  await sleep(320);
  ok('double-tapping the middle pick sends it back to the list', !kept().includes(b), kept().join(', '));
  eq('and the two either side keep their own slots', numbered().join(), [a, c].join());
  eq('the middle slot stays empty rather than closing up', slots().length, 1);
  eq('and the hole is the middle one, still numbered 2', slots()[0].textContent.trim(), '2');
  ok('the card in the list is no longer kept', !cardFor(b)?.classList.contains('is-benched'));

  /*
   * What it looks like while you are still holding the chip.
   *
   * Two questions get two answers. Hovering a tray asks "in or out", so the
   * whole square lights up. Hovering one of the three asks "before which one",
   * so a bar appears in the gap and the chip steps aside to make it -- a ring
   * would have said "this one", which is not what is about to happen.
   *
   * Split in two on purpose. What it looks like is asked of the stylesheet,
   * which answers the same way every time. Whether the drag actually applies it
   * is asked of a real drag, and only when this browser is drawing frames at
   * all: the hover state is applied on an animation frame, and the headless
   * runner drives these pages under a virtual clock that advances timers
   * without necessarily producing frames. Asserting through a frame that may
   * never come is how you get a check that fails for the harness.
   */
  const styleWith = (el, cls, pseudo) => {
    el.classList.add(cls);
    const out = D.defaultView.getComputedStyle(el, pseudo ?? null);
    const copy = {
      boxShadow: out.boxShadow, transform: out.transform, content: out.content,
      width: out.width, borderColor: out.borderColor, background: out.backgroundColor,
    };
    el.classList.remove(cls);
    return copy;
  };

  const zoneLit = styleWith(shortlist(), 'is-over');
  ok('a hovered tray rings the whole square',
     zoneLit.boxShadow !== 'none' && !zoneLit.boxShadow.includes('inset'), zoneLit.boxShadow);
  ok('and tints it, so it reads as a target rather than an outline',
     zoneLit.background !== styleWith(shortlist(), 'nothing-at-all').background);

  const aim = chipAt(0);
  const barLit = styleWith(aim, 'is-over', '::before');
  ok('a hovered chip draws a bar in the gap in front of it',
     barLit.content === '""' && parseFloat(barLit.width) >= 2,
     `content ${barLit.content}, width ${barLit.width}`);
  const chipLit = styleWith(aim, 'is-over');
  ok('and the chip steps aside to leave that gap',
     chipLit.transform !== 'none', chipLit.transform);
  ok('rather than being ringed, which would have meant "this one"',
     chipLit.boxShadow === 'none', chipLit.boxShadow);
  ok('and the number it is wearing inverts, because that is the number you take',
     (() => {
       aim.classList.add('is-over');
       const n = aim.querySelector('.chipbench__n');
       const lit = n && D.defaultView.getComputedStyle(n).backgroundColor;
       aim.classList.remove('is-over');
       const dim = n && D.defaultView.getComputedStyle(n).backgroundColor;
       return !!n && lit !== dim;
     })());

  /*
   * Now the wiring: does a real drag apply what the stylesheet describes.
   *
   * The mark goes on inside a requestAnimationFrame callback, so this can only
   * be asked of a browser that is drawing. Rather than guess, the attempt
   * counts frames while it runs: no frames and it is skipped with that said out
   * loud, frames and no mark and it is a failure the app earned. A check that
   * cannot tell those two apart is worth nothing.
   */
  {
    let framesSeen = 0;
    let ticking = true;
    const tick = () => { framesSeen += 1; if (ticking) V.requestAnimationFrame(tick); };
    V.requestAnimationFrame(tick);
    const drew = () => framesSeen > 1;
    const hoverOver = async (handle, target) => {
      bring(handle);
      const from = centre(handle);
      send('pointerdown', from.x, from.y, handle);
      send('pointermove', from.x + 9, from.y + 9, V);
      await sleep(70);
      for (let tries = 0; tries < 8; tries += 1) {
        bring(target);
        const to = centre(target);
        send('pointermove', to.x, to.y, V);
        /* Waited on a frame, not a timer: the frame is the thing the mark is
           applied in, and a timer under a virtual clock returns before one. */
        await Promise.race([new Promise((r) => { V.requestAnimationFrame(r); }), sleep(200)]);
        if (target.classList.contains('is-over')) return true;
      }
      return false;
    };
    const endHover = async () => {
      V.dispatchEvent(new V.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await sleep(220);
    };

    /*
     * Every attempt carries its own verdict.
     *
     * The gate has to be per attempt, not per group: frames can arrive for the
     * first hover and stop before the second, and a gate consulted once turns
     * that into a failure the app did not cause. Not lit and no frames drawn is
     * a skip that says so; not lit while the browser was drawing is a real
     * failure, which is the whole point of keeping the two apart.
     */
    const attempt = async (what, target) => {
      const spare3 = $$('.card--chip').map((e) => e.dataset.chip).find((n) => !kept().includes(n));
      const before = framesSeen;
      const lit = await hoverOver(grip(cardFor(spare3)), target);
      if (!lit && framesSeen - before < 2) {
        skip(what, 'no frames were drawn during the attempt, and the mark is applied in one');
        await endHover();
        return false;
      }
      ok(what, lit);
      return lit;
    };

    if (await attempt('dragging over the shortlist marks it', shortlist())) {
      ok('and nothing else is marked at the same time',
         $$('#chiptray .is-over').length === 1,
         $$('#chiptray .is-over').map((e) => e.className).join(' / '));
      await endHover();
      ok('the mark goes when the drag is cancelled', !$('#chiptray .is-over'));
    }

    await attempt('dragging over one of the three marks that chip', chipAt(0));
    await endHover();
    ticking = false;
  }

  /*
   * Picked up by any part of it, and dropped in either tray.
   *
   * The drop targets were always fine; the grab was not. Only the 34px sprite
   * started a drag, so somebody who put a finger on the chip's name got
   * nothing -- and "nothing happens" reads as a broken feature, not as a
   * handle you were supposed to find. The name is the handle here on purpose:
   * if this passes, so does every other part of the card.
   */
  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 320);
  await click($('#roster-tabs [data-list="chips"]'), 440);
  eq('nothing kept, so both trays are empty', kept().length, 0);

  const byName = (n) => cardFor(n)?.querySelector('.chiprow__head b') ?? cardFor(n);
  const three = () => $('#chiptray .chiptray__zone[data-list="main"]');
  const inThree = () => [...three().querySelectorAll('.chipbench__chip')].map((e) => e.dataset.chip);

  const [p1, p2] = $$('.card--chip').slice(0, 2).map((e) => e.dataset.chip);
  ok('the chips have a name to grab them by', !!byName(p1) && byName(p1).tagName === 'B');

  await dragTo(byName(p1), shortlist());
  eq('dragging a chip by its name lands it in the shortlist', shortlisted().join(), p1);
  eq('and it did not go into the three by mistake', inThree().length, 0);

  await dragTo(byName(p2), three());
  eq('and dragging another by its name lands it in the three', inThree().join(), p2);
  eq('with the shortlist left alone', shortlisted().join(), p1);

  /* The sprite still works, and with no hold, which is the point of keeping
     touch-action on it alone. */
  const p3 = $$('.card--chip').map((e) => e.dataset.chip).find((n) => !kept().includes(n));
  await dragTo(grip(cardFor(p3)), shortlist());
  ok('the sprite is still a handle too', shortlisted().includes(p3), shortlisted().join(', '));
  ok('and only the sprite refuses the browser its scroll',
     D.defaultView.getComputedStyle(cardFor(p3)).touchAction !== 'none'
     && D.defaultView.getComputedStyle(cardFor(p3).querySelector('.chiprow__art')).touchAction === 'none');

  /* Nothing but the name in the tray headings. */
  ok('the tray headings say their name and nothing else',
     $$('#chiptray .chiptray__label').map((e) => e.textContent.trim()).join('|') === 'Your three|Alternatives',
     $$('#chiptray .chiptray__label').map((e) => e.textContent.trim()).join('|'));
  ok('and carry no explanation hung off them',
     $$('#chiptray .chiptray__label span').length === 0);

  /*
   * What you are carrying, and nothing else.
   *
   * The ghost used to be a 62px square with a shadow, which is the size and the
   * look of a Tatari token -- the first thing this app ever dragged. Everything
   * dragged since brings its own shape, so a chip's name pill sat inside a box
   * that had nothing to do with it and you dragged a stray rectangle around.
   * The box carries a coordinate now; the thing inside decides how it looks.
   *
   * Both halves are checked, because the fix moved the square rather than
   * deleting it and the token is the one that still wants it.
   */
  {
    const s = $$('.card--chip').map((e) => e.dataset.chip).find((n) => !kept().includes(n));
    const art = cardFor(s).querySelector('.chiprow__art');
    bring(art);
    const a = centre(art);
    send('pointerdown', a.x, a.y, art);
    send('pointermove', a.x + 12, a.y + 12, V);
    await sleep(140);
    const ghost = D.querySelector('.drag-ghost');
    ok('dragging a chip puts a ghost under the pointer', !!ghost);
    if (ghost) {
      const pill = ghost.querySelector('.chipghost');
      const g = ghost.getBoundingClientRect();
      const p = pill && pill.getBoundingClientRect();
      ok('the ghost is the name, which is the thing worth seeing',
         !!pill && pill.textContent.trim() === s, pill && pill.textContent.trim());
      ok('and the ghost is no bigger than the name it is carrying',
         !!p && Math.abs(g.width - p.width) < 3 && Math.abs(g.height - p.height) < 3,
         p ? `ghost ${Math.round(g.width)}x${Math.round(g.height)}, name ${Math.round(p.width)}x${Math.round(p.height)}` : 'no name');
      const gs = D.defaultView.getComputedStyle(ghost);
      ok('with no box of its own drawn round it',
         gs.boxShadow === 'none' && gs.backgroundColor === 'rgba(0, 0, 0, 0)',
         `${gs.boxShadow} / ${gs.backgroundColor}`);
    }
    send('pointerup', a.x + 12, a.y + 12, V);
    await sleep(280);
  }

  /* And a chip is not text you can drag a highlight across. */
  ok('chip cards cannot be highlighted',
     D.defaultView.getComputedStyle($('.card--chip')).userSelect === 'none');
  ok('nor the trays they go into',
     D.defaultView.getComputedStyle($('#chiptray .chiptray__zone')).userSelect === 'none');

  localStorage.removeItem('coc.chips.taken');
  await click($('#roster-tabs [data-list="tatari"]'), 380);
});

/*
 * The Tatari ghost still wants the square it always had.
 *
 * The chip ghost stopped drawing a box by moving that box off the container
 * and onto the token, which is the only thing that ever wanted it. If this
 * goes, dragging a critter is an unlifted picture with no edge, and the fix
 * for the chips quietly cost the thing it was built around.
 */
await runGroup('a dragged critter still looks like a token', async () => {
  await until(() => !!$('#roster'), 'the drafter to be in the frame', 8000);
  const V = D.defaultView;
  await click($('#roster-tabs [data-list="tatari"]'), 420);
  const card = $$('.panel--roster .card').find((c) => !c.classList.contains('card--chip'));
  ok('there is a critter to drag', !!card);
  if (!card) return;
  const r = card.getBoundingClientRect();
  if (r.width < 10) { skip('the token ghost keeps its square', 'the roster has no size in this window'); return; }
  const at = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  const send = (type, x, y, to) => to.dispatchEvent(new V.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    pointerId: 3, pointerType: 'mouse', isPrimary: true,
    button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1,
    clientX: x, clientY: y,
  }));
  send('pointerdown', at.x, at.y, card);
  send('pointermove', at.x + 12, at.y + 12, V);
  await sleep(150);
  const ghost = $('.drag-ghost');
  const token = ghost && ghost.querySelector('.token');
  ok('picking a critter up gives you a token', !!token);
  if (token) {
    const t = token.getBoundingClientRect();
    ok('the token is still a 62px square', Math.round(t.width) === 62 && Math.round(t.height) === 62,
       `${Math.round(t.width)}x${Math.round(t.height)}`);
    const ts = V.getComputedStyle(token);
    ok('and still lifted off the page', ts.boxShadow !== 'none', ts.boxShadow);
    ok('and still rounded', parseFloat(ts.borderRadius) > 0, ts.borderRadius);
  }
  send('pointerup', at.x + 12, at.y + 12, V);
  await sleep(260);
});


await runGroup('the chips page', async () => {
  /*
   * The engine behind this page is checked in chipstest.html against boards
   * built on purpose. What is checked here is the page: the two controls on it
   * are a tier filter and a keep button, and neither has any arithmetic to get
   * wrong, only wiring.
   */
  /* From nothing. What you kept lives in localStorage and outlives the page, so
     without this the group inherits whatever the last visit -- or the last hand
     test on this origin -- left behind, and every count below is off by it. The
     suite puts the real value back at the end either way. */
  localStorage.removeItem('coc.chips.taken');

  const frame = frameFor('chips.html');
  await frame.ready;
  const C = frame.contentDocument;
  await until(() => C.querySelectorAll('.chipcard').length > 0, 'the chips page');
  const cards = () => C.querySelectorAll('.chipcard').length;
  const tier = (n) => C.querySelector(`.chip--rarity[data-tier="${n}"]`);

  const all = cards();
  eq('every chip is on the page', all, 49);
  ok('and each one has an icon', C.querySelectorAll('.chipcard__art').length === all);

  ok('there is a tier filter', !!tier(1) && !!tier(2) && !!tier(3));
  const promised = Number(tier(3).textContent.replace(/\D/g, ''));
  tier(3).click();
  await sleep(220);
  eq('pressing a tier finds exactly what it promised', cards(), promised);
  eq('and says so', C.querySelector('.chipfilters__n').textContent.trim(), `${promised} of ${all}`);
  ok('the pressed one reports itself', tier(3).getAttribute('aria-pressed') === 'true');

  /* One at a time. "II or III" answers 35 of 49, which is not a filter, and the
     same control on the roster tab behaves the same way. */
  const alsoII = Number(tier(2).textContent.replace(/\D/g, ''));
  tier(2).click();
  await sleep(240);
  eq('a second tier replaces the first rather than adding', cards(), alsoII);
  eq('and only one is pressed',
     C.querySelectorAll('.chip--rarity[aria-pressed="true"]').length, 1);

  tier(2).click(); await sleep(240);
  eq('pressing the one already on releases it', cards(), all);

  // The three you kept are yours whatever the filter is doing.
  const keep = C.querySelector('[data-keep]');
  const name = keep.dataset.keep;
  keep.click();
  await sleep(240);
  ok('keeping a chip fills a slot',
     [...C.querySelectorAll('.kept__slot.is-filled')].some((el) => el.textContent.includes(name)),
     name);
  eq('and only one slot', C.querySelectorAll('.kept__slot.is-filled').length, 1);
  ok('three slots, always', C.querySelectorAll('.kept__slot').length === 3);

  C.querySelector(`[data-keep="${name}"]`).click();
  await sleep(240);
  eq('pressing it again gives the slot back', C.querySelectorAll('.kept__slot.is-filled').length, 0);

  /*
   * Three ranked, then a shortlist with no limit.
   *
   * The three are what a run hands you, in the order you would take them, so
   * they move. The shortlist is the thinking done before any offer, which has
   * no reason to stop at three -- a fourth press goes there rather than being
   * refused or quietly pushing your first pick out.
   */
  const three = () => [...C.querySelectorAll('.kept__slot.is-filled .keptrow__name')]
    .map((el) => el.textContent.trim());
  const shortlist = () => [...C.querySelectorAll('.kept__list .keptrow__name')]
    .map((el) => el.textContent.trim());
  const slot = (i) => C.querySelectorAll('.kept__slot.is-filled')[i];

  /* By name, re-queried each time. renderPage() replaces every node, so a list
     of elements collected up front is four detached buttons after the first
     click, and the other three do nothing at all. */
  const wanted = [...C.querySelectorAll('[data-keep]')].slice(0, 4).map((b) => b.dataset.keep);
  for (const n of wanted) {
    C.querySelector(`[data-keep="${CSS.escape(n)}"]`).click();
    await sleep(220);
  }
  eq('the first three fill the three', three().length, 3);
  eq('and the fourth goes to the shortlist', shortlist().length, 1);

  const order = three().join(',');
  slot(2).querySelector('[data-act="up"]').click();
  await sleep(240);
  const moved = three();
  eq('moving the third up swaps it with the second',
     moved.join(','), order.split(',').map((n, i, a) => (i === 1 ? a[2] : i === 2 ? a[1] : n)).join(','));

  ok('the first cannot move up', slot(0).querySelector('[data-act="up"]').disabled);
  ok('and the last cannot move down', slot(2).querySelector('[data-act="down"]').disabled);

  const demoted = three()[0];
  slot(0).querySelector('[data-act="demote"]').click();
  await sleep(240);
  eq('demoting drops it out of the three', three().length, 2);
  ok('and onto the shortlist', shortlist().includes(demoted), shortlist().join(', '));

  C.querySelector(`.keptrow[data-name="${CSS.escape(demoted)}"] [data-act="promote"]`).click();
  await sleep(240);
  ok('promoting puts it back', three().includes(demoted), three().join(', '));
  ok('and takes it off the shortlist', !shortlist().includes(demoted));

  ok('promote is refused while the three are full',
     C.querySelector('.kept__list [data-act="promote"]')?.disabled !== false,
     'a fourth would have been promoted into three slots');

  /* Renamed groups, and nothing under the headings. */
  const heads = [...C.querySelectorAll('.chgroup__head')].map((h) => h.firstChild.textContent.trim());
  ok('the groups are named as chips', heads.every((h) => /Chips$/.test(h)), heads.join(' | '));
  eq('nothing explains a heading underneath it', C.querySelectorAll('.chgroup__blurb').length, 0);
  eq('no co-op notes are printed on the cards', C.querySelectorAll('.chipcard__doubt').length, 0);

  /* Position and Element answer in faces; the rest answer in words. */
  const facesGroup = C.querySelector('.chgroup[data-shape="placement"]');
  eq('a Position card says nothing in numbers',
     facesGroup.querySelectorAll('.chipcard__count').length, 0);
  eq('nor does an Element card',
     C.querySelectorAll('.chgroup[data-shape="element"] .chipcard__count').length, 0);
  ok('but the chips that read nothing still print their text',
     C.querySelector('.chgroup[data-shape="economy"] .chipcard__text').textContent.trim().length > 10);
  frame.remove();
});

/* Whatever happened, the reader gets their formation back. */
localStorage.clear();
for (const [k, v] of Object.entries(saved)) localStorage.setItem(k, v);

const skipNote = skipped ? `, ${skipped} skipped` : '';
/* A filter that matched nothing ran boot and stopped. That is not a failure --
   the other suite legitimately has no group by that name -- but it must never
   read as "checked and fine", so it is said in the log and in the title, where
   the runner will repeat it. */
const nothingMatched = Boolean(only) && !matchedOnly;
if (nothingMatched) {
  skipped += 1;
  out.insertAdjacentHTML('beforeend', `<div style="color:#8f99aa">  skip ?only=${only} matched no group here, so nothing was checked</div>`);
}
document.getElementById('head').innerHTML = fail
  ? `<b style="color:#f0654f">${fail} failed</b>, ${pass} passed${skipNote}`
  : `<b style="color:#55c98a">${pass} passed</b>, 0 failed${skipNote}`;
document.title = `${fail ? `FAIL (${fail})` : (nothingMatched ? 'ok, nothing matched' : 'ok')}: end-to-end checks`;
window.__done = { pass, fail };
</script>
</body>
