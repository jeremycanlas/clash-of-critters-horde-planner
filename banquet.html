<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Horde Drafter: MVP banquets</title>
  <!-- Private: only Discord accounts holding one role in one server get any data
     back (supabase/migrations/013). -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='20'>🐾</text></svg>">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/site-nav.css">
  <link rel="stylesheet" href="assets/css/tracker.css">
  <link rel="stylesheet" href="assets/css/banquet.css">
</head>

<body class="tracker">

  <header class="topbar">
    <div class="topbar__title">
      <h1>MVP banquets</h1>
      <span id="bq-sub" class="topbar__sub">After every gold rush</span>
    </div>
    <button id="bq-signout" class="btn btn--quiet tr-signout" type="button" hidden>Sign out</button>
  </header>

  <nav id="site-tabs" class="sitetabs" aria-label="Horde Drafter pages"></nav>

  <main class="tr-main bq-main">
    <section id="bq-gate" class="panel tr-gate" hidden>
      <h2 id="bq-gate-head">This page is private</h2>
      <p id="bq-gate-text" class="muted">Sign in with Discord to see it.</p>
      <button id="bq-signin" class="btn btn--primary" type="button">Sign in with Discord</button>
    </section>

    <section id="bq-app" hidden>
      <div class="bq-bar">
        <label class="bq-round">Gold rush
          <select id="bq-round" class="field" aria-label="Which gold rush"></select>
        </label>
        <span id="bq-when" class="muted bq-when"></span>
        <span id="bq-fresh" class="muted bq-when"></span>
      </div>
      <!-- The channels are read every minute; this says when that stopped. -->
      <p id="bq-stale" class="bq-stale" role="status" hidden></p>

      <!-- Only for those who see both groups; built by the script. "As Group N"
           is the page exactly as that group's members see it. -->
      <div id="bq-view" class="bq-view" hidden>
        <div id="bq-groups" class="segmented" role="group" aria-label="View the page as"></div>
        <span id="bq-view-note" class="muted"></span>
        <!-- Hides this bar, for screenshots; tapping the page title brings it back. -->
        <button id="bq-shot" class="btn btn--quiet bq-shot" type="button">Screenshot mode</button>
      </div>

      <!-- For those who see both groups, never in screenshot mode or As Group N:
           members whose UIDs someone else posted first, and UIDs in both groups. -->
      <details id="bq-copies" class="panel bq-copies" hidden>
        <summary><h2>Possible copies <span id="bq-copies-n" class="muted"></span></h2></summary>
        <p class="muted bq-copies__note">Players on one game server share their MVPs, so a match is a lead, not proof. Nobody is blocked by this.</p>
        <div id="bq-copies-body"></div>
      </details>

      <!-- Yours this gold rush: what you posted in Discord, filled in by itself,
           and anything added here. Four of them opens everyone else's. -->
      <form id="bq-mine" class="panel bq-mine">
        <details id="bq-mine-fold" open>
        <summary><h2>Your UIDs <span id="bq-mine-n" class="muted"></span></h2></summary>
        <ul id="bq-my" class="bq-my"></ul>
        <div class="bq-mine__actions">
          <input id="bq-add-uid" class="field" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="off" aria-label="Add a UID">
          <select id="bq-add-grp" class="field" aria-label="Which group" hidden></select>
          <button id="bq-add" class="btn btn--primary" type="submit">Add UID</button>
        </div>
        <p id="bq-mine-error" class="tr-form__error" role="alert" hidden></p>
        </details>
      </form>

      <p id="bq-locked" class="panel bq-locked" hidden></p>

      <section id="bq-list" class="bq-list" hidden>
        <div class="bq-bar">
          <!-- First and full width: after claiming in the game, this is how you find the card. -->
          <label class="bq-find">
            <span class="bq-find__label">Search <small>UID or name</small></span>
            <input id="bq-find" class="field" type="search" maxlength="40" autocomplete="off" spellcheck="false">
          </label>
          <div class="segmented" role="group" aria-label="Which banquets">
            <button class="segmented__btn" type="button" data-show="open" aria-pressed="true">To claim</button>
            <button class="segmented__btn" type="button" data-show="claimed" aria-pressed="false">Claimed</button>
            <button class="segmented__btn" type="button" data-show="full" aria-pressed="false">Full</button>
            <button class="segmented__btn" type="button" data-show="all" aria-pressed="false">All</button>
          </div>
          <span id="bq-count" class="muted tr-count" role="status" aria-live="polite"></span>
        </div>
        <ul id="bq-cards" class="bq-cards"></ul>
      </section>
    </section>

    <p id="bq-status" class="muted tr-status" role="status" aria-live="polite">Loading…</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="assets/js/banquet.js"></script>
  <script type="module" src="assets/js/site-nav.js"></script>
</body>

</html>
